name: GP V4.82 Special Ex-right Provenance

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/special_exright_provenance_v482.py'
      - 'scripts/test_special_exright_provenance_v482.py'
      - '.github/workflows/special-exright-provenance-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Special ex-right provenance tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_special_exright_provenance_v482.py

  collect:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Low-rate materialize 11 special ex-right CNINFO notices
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/special_exright_provenance_v482.py \
            --ledger data/SPECIAL_EXRIGHT_REFERENCE_V482.json \
            --out-dir artifact_special_exright_provenance_v482 \
            --request-interval 1.5
      - name: Verify non-Formal provenance artifact
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifact_special_exright_provenance_v482/SPECIAL_EXRIGHT_PROVENANCE_V482.json',encoding='utf-8'))
          assert x['target_n']==11
          assert x['materialized_n']+x['unresolved_n']==11
          assert x['formal_promotion'] is False
          assert x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False
          assert x['oos_metrics_allowed'] is False
          print(json.dumps({
            'materialized_n':x['materialized_n'],
            'unresolved_n':x['unresolved_n'],
            'unresolved':[(r['symbol'],r['ex_date'],r['candidate_n'],r.get('error')) for r in x['records'] if r['status']!='PASS_CNINFO_MATERIALIZED']
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload special ex-right provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-special-exright-provenance-v482
          path: artifact_special_exright_provenance_v482/
          if-no-files-found: error
          retention-days: 30
