name: GP Missing Event Factor Recalc V481

on:
  push:
    branches:
      - gp/missing-event-factor-v481
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V4.81 missing-event factor recalc unit tests
        run: |
          cd scripts
          python -m unittest -v test_missing_event_terms_v481.py test_missing_event_factor_recalc_v481.py test_missing_event_factor_53_v481.py test_merge_missing_event_closure_v481.py

  recalc:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download integrated V4.81 847 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: gp-global-qfq-ledger-recalc-v481
          path: integrated_847
          run-id: 34073572831
          github-token: ${{ github.token }}
      - name: Download frozen supplemental 6-event evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-supplemental-missing-event-v481
          path: supplemental
          run-id: 34076028687
          github-token: ${{ github.token }}
      - name: Download frozen F10 unresolved-history evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-f10-unresolved-history-v481
          path: f10_history
          run-id: 34075792988
          github-token: ${{ github.token }}
      - name: Download corrected V4.81 Sina factor source census
        uses: actions/download-artifact@v4
        with:
          name: gp-global-qfq-source-census-v481
          path: source_census
          run-id: 34009079533
          github-token: ${{ github.token }}
      - name: Download frozen V4.81 Sohu RAW shards
        uses: actions/download-artifact@v4
        with:
          pattern: gp-global-qfq-nominal-v481-shard-*
          path: nominal_shards
          merge-multiple: true
          run-id: 34009535349
          github-token: ${{ github.token }}
      - name: Recalculate 7 fully evidenced missing-event symbols
        run: |
          BASE_REVIEW="$(find integrated_847 -name GLOBAL_QFQ_LEDGER_REVIEW_QUEUE_V481.csv -print -quit)"
          test -n "$BASE_REVIEW"
          python scripts/run_missing_event_factor_recalc_v481.py \
            --base-review "$BASE_REVIEW" \
            --supplemental-dir supplemental \
            --f10-dir f10_history \
            --source-census source_census \
            --nominal-shards nominal_shards \
            --out-dir artifact_missing_event_factor_v481
      - name: Verify exact 7-symbol result remains fail-closed and non-Formal
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifact_missing_event_factor_v481/MISSING_EVENT_FACTOR_RECALC_V481.json',encoding='utf-8'))
          assert x['target_symbol_n']==7 and x['target_event_date_n']==12 and x['blocked_n']==0
          assert sum(x['status_counts'].values())==7
          assert x['formal_promotion'] is False and x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False and x['oos_metrics_allowed'] is False
          assert all(r['coverage_complete'] is True for r in x['records'])
          print(json.dumps({'status_counts':x['status_counts'],'nominal_checkpoint_after_7':x['nominal_checkpoint_after_7']},ensure_ascii=False,indent=2))
          PY
      - name: Upload V4.81 missing-event factor recalc evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-missing-event-factor-recalc-v481
          path: artifact_missing_event_factor_v481/
          if-no-files-found: error
          retention-days: 30

  recalc-remaining-53:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download integrated V4.81 847 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: gp-global-qfq-ledger-recalc-v481
          path: integrated_847
          run-id: 34073572831
          github-token: ${{ github.token }}
      - name: Download frozen all-60 F10 PageAjax evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-f10-missing-event-v481
          path: f10_all60
          run-id: 34075413814
          github-token: ${{ github.token }}
      - name: Download corrected V4.81 Sina factor source census
        uses: actions/download-artifact@v4
        with:
          name: gp-global-qfq-source-census-v481
          path: source_census
          run-id: 34009079533
          github-token: ${{ github.token }}
      - name: Download frozen V4.81 Sohu RAW shards
        uses: actions/download-artifact@v4
        with:
          pattern: gp-global-qfq-nominal-v481-shard-*
          path: nominal_shards
          merge-multiple: true
          run-id: 34009535349
          github-token: ${{ github.token }}
      - name: Recalculate remaining 53 fully evidenced missing-event symbols
        run: |
          python scripts/run_missing_event_factor_recalc_53_v481.py \
            --integrated-dir integrated_847 \
            --f10-dir f10_all60 \
            --source-census source_census \
            --nominal-shards nominal_shards \
            --out-dir artifact_missing_event_factor_53_v481
      - name: Verify exact 53-symbol result closes missing-event class only
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifact_missing_event_factor_53_v481/MISSING_EVENT_FACTOR_RECALC_53_V481.json',encoding='utf-8'))
          assert x['target_symbol_n']==53 and x['target_missing_event_date_n']==93 and x['blocked_n']==0
          assert sum(x['status_counts'].values())==53 and all(r['coverage_complete'] is True for r in x['records'])
          c=x['nominal_checkpoint_after_60']; assert c['MISSING_EVENT_REVIEW']==0
          assert c['PASS']+c['EXACT_TERM_REVIEW']+c['NOT_APPLICABLE']==847
          assert x['formal_promotion'] is False and x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False and x['oos_metrics_allowed'] is False
          print(json.dumps({'status_counts':x['status_counts'],'nominal_checkpoint_after_60':c},ensure_ascii=False,indent=2))
          PY
      - name: Upload V4.81 remaining-53 factor recalc evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-missing-event-factor-recalc-53-v481
          path: artifact_missing_event_factor_53_v481/
          if-no-files-found: error
          retention-days: 30

  merge-missing-event-closure:
    needs: [recalc, recalc-remaining-53]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen integrated V4.81 847 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: gp-global-qfq-ledger-recalc-v481
          path: integrated_847
          run-id: 34073572831
          github-token: ${{ github.token }}
      - name: Download current-run 7-symbol resolution artifact
        uses: actions/download-artifact@v4
        with:
          name: gp-missing-event-factor-recalc-v481
          path: recalc7
      - name: Download current-run 53-symbol resolution artifact
        uses: actions/download-artifact@v4
        with:
          name: gp-missing-event-factor-recalc-53-v481
          path: recalc53
      - name: Merge exact 60 missing-event resolutions into 847 checkpoint
        run: |
          python scripts/merge_missing_event_closure_v481.py \
            --base-dir integrated_847 \
            --recalc7-dir recalc7 \
            --recalc53-dir recalc53 \
            --out-dir artifact_missing_event_closure_v481
      - name: Verify closed missing-event partition and Formal guard
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifact_missing_event_closure_v481/GLOBAL_QFQ_MISSING_EVENT_CLOSURE_V481.json',encoding='utf-8'))
          s=x['summary']
          assert x['scope_n']==847 and x['record_n']==847 and x['partition_exact'] is True
          assert x['missing_event_status']=='CLOSED_V481'
          assert s['pass_n']==746 and s['exact_review_n']==98 and s['missing_event_n']==0 and s['not_applicable_n']==3
          assert s['pass_n']+s['exact_review_n']+s['missing_event_n']+s['not_applicable_n']==847
          assert sum(1 for r in x['records'] if r.get('missing_event_resolution'))==60
          assert x['formal_promotion'] is False and x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False and x['oos_metrics_allowed'] is False
          print(json.dumps({'summary':s,'resolved_records':60},ensure_ascii=False,indent=2))
          PY
      - name: Upload V4.81 merged 847 missing-event closure checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: gp-global-qfq-missing-event-closure-v481
          path: artifact_missing_event_closure_v481/
          if-no-files-found: error
          retention-days: 30
