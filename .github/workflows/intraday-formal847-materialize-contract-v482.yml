name: GP V4.82 Intraday Formal847 Materialize Contract

# Freshness checkpoint: optimized required-day index verification.
on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - 'scripts/intraday_formal847_materialize_v482.py'
      - 'scripts/test_intraday_formal847_materialize_v482.py'
      - '.github/workflows/intraday-formal847-materialize-contract-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check --quiet pandas pyarrow requests
      - name: Formal847 required-date materialization contract
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_intraday_formal847_materialize_v482.py
