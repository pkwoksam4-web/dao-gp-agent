name: PIT Calendar Gate CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  calendar-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_pit_calendar_gate
      - name: Compile calendar gate and ingest
        run: python -m py_compile scripts/pit_calendar_gate.py scripts/live_pit_ingest.py
