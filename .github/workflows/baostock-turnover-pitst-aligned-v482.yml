name: GP BaoStock turnover PIT-ST aligned V482

on:
  push:
    branches: [gp/baostock-fullraw-crosscheck-v482]
    paths: ['.github/workflows/baostock-turnover-pitst-aligned-v482.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas pyarrow
      - name: Download BaoStock turnover shards
        uses: actions/download-artifact@v4
        with:
          pattern: gp-baostock-turnover-full847-shard-*
          path: upstream/shards
          merge-multiple: true
          run-id: 34459482270
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pkwoksam4-web/dao-gp-agent
      - name: Download sealed Sohu RAW
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-full-raw-v482-reaudit
          path: upstream/raw
          run-id: 34192233633
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pkwoksam4-web/dao-gp-agent
      - name: Apply frozen correction mask and validate
        run: |
          mkdir -p out/pitst_aligned_turnover
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          CORR={
            ('002087.SZ','2024-06-13'),('300356.SZ','2023-06-20'),
            ('600647.SH','2024-06-13'),('600766.SH','2024-06-13'),
            ('603133.SH','2024-06-13')
          }
          files=sorted(Path('upstream/shards').glob('BAOSTOCK_TURNOVER_FULL847_SHARD_*_ROWS_V482.csv'))
          assert len(files)==12
          bao=pd.concat([pd.read_csv(p,dtype={'symbol':str,'date':str}) for p in files],ignore_index=True)
          for c in ['volume','amount','turn','tradestatus','isST']:
            bao[c]=pd.to_numeric(bao[c],errors='coerce')
          bao['symbol']=bao['symbol'].str.upper().str.strip()
          bao['date']=bao['date'].str.strip()
          bao['key']=list(zip(bao['symbol'],bao['date']))
          bao['frozen_trade']=bao['tradestatus'].eq(1) | bao['key'].isin(CORR)
          aligned=bao[bao['frozen_trade']].copy()
          aligned['turnover_ratio']=aligned['turn']/100.0

          raw=pd.read_parquet('upstream/raw/SOHU_RAW_FULL_V482.parquet',columns=['symbol','date'])
          raw['symbol']=raw['symbol'].astype(str).str.upper().str.strip()
          raw['date']=pd.to_datetime(raw['date']).dt.strftime('%Y-%m-%d')
          raw=raw.drop_duplicates(['symbol','date'])
          m=aligned[['symbol','date']].merge(raw,on=['symbol','date'],how='outer',indicator=True)
          left=m[m['_merge']=='left_only'][['symbol','date']]
          right=m[m['_merge']=='right_only'][['symbol','date']]
          corr_rows=aligned[aligned['key'].isin(CORR)][['symbol','date','turn','volume','amount','tradestatus']].sort_values(['symbol','date'])
          zero=aligned[aligned['turn'].eq(0)][['symbol','date','turn','volume','amount','tradestatus']].sort_values(['symbol','date'])

          audit={
            'artifact':'BAOSTOCK_TURNOVER_PITST_ALIGNED_V482',
            'version':'V4.82',
            'formal_window':['2020-06-01','2026-04-17'],
            'source_daily_rows':int(len(bao)),
            'aligned_trade_rows':int(len(aligned)),
            'sohu_trade_rows':int(len(raw)),
            'left_only_n':int(len(left)),
            'right_only_n':int(len(right)),
            'exact_symbol_date_coverage':bool(len(left)==0 and len(right)==0 and len(aligned)==len(raw)==1011607),
            'turn_missing_n':int(aligned['turn'].isna().sum()),
            'turn_negative_n':int((aligned['turn']<0).sum()),
            'turn_zero_n':int((aligned['turn']==0).sum()),
            'known_correction_rows':corr_rows.to_dict('records'),
            'zero_turn_rows':zero.to_dict('records'),
            'candidate_transform':'turn_pct / 100.0',
            'interpretation':[
              'Frozen PIT-ST trade semantics override BaoStock tradestatus for the five already-established trade corrections.',
              'Stopped rows outside the correction set are excluded even if BaoStock leaves residual volume/turn fields.',
              'Zero turnover on a frozen traded row is accepted only as a nonnegative reported value; the exact rows are emitted for audit.',
              'This establishes structural Formal coverage only; historical as-of immutability remains a separate PIT requirement.'
            ],
            'promotion':{'formal_admission':False,'turnover_ratio_blocker_closed':False,'pit_verified':False,'oos_metrics_allowed':False}
          }
          status='PASS_STRUCTURAL_PITST_ALIGNED_TURNOVER' if audit['exact_symbol_date_coverage'] and audit['turn_missing_n']==0 and audit['turn_negative_n']==0 and len(corr_rows)==5 else 'REVIEW_STRUCTURAL_PITST_ALIGNED_TURNOVER'
          audit['status']=status
          Path('out/pitst_aligned_turnover/BAOSTOCK_TURNOVER_PITST_ALIGNED_V482.json').write_text(json.dumps(audit,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          aligned[['symbol','date','turn','turnover_ratio','volume','amount','tradestatus','isST']].sort_values(['symbol','date']).to_parquet('out/pitst_aligned_turnover/BAOSTOCK_TURNOVER_PITST_ALIGNED_V482.parquet',index=False,compression='zstd')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Verify fail-closed structural result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('out/pitst_aligned_turnover/BAOSTOCK_TURNOVER_PITST_ALIGNED_V482.json').read_text())
          assert x['status']=='PASS_STRUCTURAL_PITST_ALIGNED_TURNOVER'
          assert x['exact_symbol_date_coverage'] is True
          assert x['turn_missing_n']==0
          assert x['turn_negative_n']==0
          assert x['promotion']['turnover_ratio_blocker_closed'] is False
          assert x['promotion']['pit_verified'] is False
          assert x['promotion']['oos_metrics_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gp-baostock-turnover-pitst-aligned-v482
          path: out/pitst_aligned_turnover/
          if-no-files-found: error
          retention-days: 30
