name: GP12 Main Net Flow Tushare Secret Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-tushare-secret-probe-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tushare client
        run: pip install -q tushare pandas
      - name: Probe credential and Formal-window moneyflow capability
        run: |
          python - <<'PY'
          import json, os, sys
          import pandas as pd
          import tushare as ts

          token=(os.getenv('TUSHARE_TOKEN') or '').strip()
          if not token:
              print('TUSHARE_SECRET_STATUS=MISSING')
              raise SystemExit(3)
          print('TUSHARE_SECRET_STATUS=PRESENT')
          pro=ts.pro_api(token)
          checks=[]
          for label,start,end in [
              ('formal_2020','20200601','20200630'),
              ('formal_2026','20260301','20260417'),
          ]:
              try:
                  df=pro.moneyflow(ts_code='000001.SZ',start_date=start,end_date=end)
                  if not isinstance(df,pd.DataFrame):
                      raise RuntimeError(f'unexpected response type {type(df).__name__}')
                  required={'ts_code','trade_date','buy_lg_amount','sell_lg_amount','buy_elg_amount','sell_elg_amount','net_mf_amount'}
                  missing=sorted(required-set(df.columns))
                  item={
                      'label':label,
                      'row_n':int(len(df)),
                      'first':str(df['trade_date'].min()) if len(df) and 'trade_date' in df else None,
                      'last':str(df['trade_date'].max()) if len(df) and 'trade_date' in df else None,
                      'missing_fields':missing,
                  }
                  if len(df):
                      x=df.iloc[0]
                      item['sample_main_net_flow_wan']=(
                          float(x['buy_lg_amount'])+float(x['buy_elg_amount'])-
                          float(x['sell_lg_amount'])-float(x['sell_elg_amount'])
                      )
                  checks.append(item)
                  print('CHECK',json.dumps(item,ensure_ascii=False))
                  if missing or not len(df):
                      raise RuntimeError(f'{label} returned incomplete moneyflow evidence')
              except Exception as exc:
                  print('PROBE_ERROR',label,type(exc).__name__,str(exc)[:500])
                  raise
          print('TUSHARE_MONEYFLOW_CAPABILITY=PASS')
          PY
