name: GP12 Eastmoney sharebonus full PIT audit V482

on:
  push:
    branches: [gp/baostock-fullraw-crosscheck-v482]
    paths: ['.github/workflows/eastmoney-sharebonus-full-pit-audit-v482.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen effective-event base ledger
        uses: actions/download-artifact@v4
        with:
          name: gp-global-qfq-missing-event-closure-v481
          path: upstream/frozen
          run-id: 34078398130
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pkwoksam4-web/dao-gp-agent
      - name: Materialize full Formal Eastmoney sharebonus response and audit timing
        run: |
          mkdir -p out/eastmoney_full_pit/raw_pages
          python - <<'PY'
          import csv,datetime as dt,hashlib,json,time,urllib.parse,urllib.request
          from pathlib import Path

          BEG='2020-06-01'; END='2026-04-17'
          frozen_path=next(Path('upstream/frozen').rglob('GLOBAL_QFQ_MISSING_EVENT_CLOSURE_V481.json'))
          frozen=json.loads(frozen_path.read_text(encoding='utf-8'))
          targets=[]
          for rec in frozen.get('records') or []:
              sym=str(rec.get('symbol') or '').upper()
              for e in rec.get('events') or []:
                  if e.get('source')=='EASTMONEY_RPT_SHAREBONUS_DET':
                      targets.append({
                        'symbol':sym,'code':sym.split('.')[0],'ex_date':str(e.get('ex_date') or '')[:10],
                        'event_ratio':e.get('event_ratio'),'source':e.get('source')
                      })
          assert len(targets)==2620,len(targets)
          target_keys={(r['code'],r['ex_date']) for r in targets}
          assert len(target_keys)==2620,len(target_keys)

          base='https://datacenter-web.eastmoney.com/api/data/v1/get'
          all_rows=[]; page=1; page_meta=[]; total_pages=None
          while True:
              params={
                'reportName':'RPT_SHAREBONUS_DET','columns':'ALL',
                'filter':f"(EX_DIVIDEND_DATE>='{BEG}')(EX_DIVIDEND_DATE<='{END}')",
                'pageSize':'500','pageNumber':str(page),
                'sortColumns':'SECURITY_CODE,EX_DIVIDEND_DATE','sortTypes':'1,1',
                'source':'WEB','client':'WEB'
              }
              url=base+'?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://data.eastmoney.com/yjfp/'})
              last=None
              for attempt in range(1,4):
                  try:
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          raw=resp.read(); status=resp.status
                      break
                  except Exception as exc:
                      last=exc
                      if attempt==3: raise
                      time.sleep(attempt*2)
              payload=json.loads(raw)
              result=payload.get('result') or {}
              rows=result.get('data') or []
              pages=int(result.get('pages') or 1)
              total_pages=pages
              sha=hashlib.sha256(raw).hexdigest()
              Path(f'out/eastmoney_full_pit/raw_pages/page_{page:03d}.json').write_bytes(raw)
              page_meta.append({'page':page,'rows':len(rows),'bytes':len(raw),'sha256':sha,'http_status':status})
              all_rows.extend(rows)
              if page>=pages: break
              page+=1
              if page>200: raise RuntimeError('unexpected pagination >200 pages')
              time.sleep(0.08)

          by_key={}
          duplicate_keys=[]
          for r in all_rows:
              code=str(r.get('SECURITY_CODE') or '')
              ex=str(r.get('EX_DIVIDEND_DATE') or '')[:10]
              k=(code,ex)
              if k in by_key: duplicate_keys.append(k)
              by_key.setdefault(k,[]).append(r)

          def date10(v):
              s=str(v or '')[:10]
              try: return dt.date.fromisoformat(s)
              except Exception: return None

          audits=[]
          for t in targets:
              k=(t['code'],t['ex_date']); candidates=by_key.get(k,[])
              row=None
              if len(candidates)==1: row=candidates[0]
              elif len(candidates)>1:
                  impl=[r for r in candidates if str(r.get('ASSIGN_PROGRESS') or '').find('实施')>=0]
                  row=impl[0] if len(impl)==1 else candidates[0]
              ex=date10(t['ex_date'])
              notice=date10((row or {}).get('NOTICE_DATE'))
              plan=date10((row or {}).get('PLAN_NOTICE_DATE'))
              publish=date10((row or {}).get('PUBLISH_DATE'))
              available=notice or plan or publish
              audits.append({
                **t,'matched':row is not None,'candidate_n':len(candidates),
                'notice_date':notice.isoformat() if notice else None,
                'plan_notice_date':plan.isoformat() if plan else None,
                'publish_date':publish.isoformat() if publish else None,
                'pit_date':available.isoformat() if available else None,
                'notice_lag_days':(ex-notice).days if ex and notice else None,
                'pit_lag_days':(ex-available).days if ex and available else None,
                'notice_not_after_ex':bool(notice and ex and notice<=ex),
                'pit_not_after_ex':bool(available and ex and available<=ex),
                'assign_progress':(row or {}).get('ASSIGN_PROGRESS'),
                'impl_plan_profile':(row or {}).get('IMPL_PLAN_PROFILE'),
              })

          matched=[r for r in audits if r['matched']]
          missing=[r for r in audits if not r['matched']]
          no_time=[r for r in matched if not r['pit_date']]
          late=[r for r in matched if r['pit_date'] and not r['pit_not_after_ex']]
          notice_late=[r for r in matched if r['notice_date'] and not r['notice_not_after_ex']]
          lags=[r['notice_lag_days'] for r in matched if r['notice_lag_days'] is not None]
          audit={
            'artifact':'EASTMONEY_SHAREBONUS_FULL_PIT_AUDIT_V482','version':'V4.82',
            'formal_window':[BEG,END],
            'target_event_n':len(targets),'target_unique_key_n':len(target_keys),
            'eastmoney_response_rows':len(all_rows),'page_n':total_pages,'page_meta':page_meta,
            'matched_n':len(matched),'missing_n':len(missing),'missing_examples':missing[:50],
            'matched_without_any_disclosure_date_n':len(no_time),'no_time_examples':no_time[:50],
            'pit_date_after_ex_n':len(late),'late_examples':late[:50],
            'notice_date_after_ex_n':len(notice_late),'notice_late_examples':notice_late[:50],
            'notice_lag_days_min':min(lags) if lags else None,
            'notice_lag_days_max':max(lags) if lags else None,
            'exact_target_key_coverage':len(matched)==2620 and len(missing)==0,
            'all_matched_have_pit_date':len(no_time)==0,
            'all_pit_dates_not_after_ex':len(late)==0,
            'source_semantics':'Current Eastmoney historical RPT_SHAREBONUS_DET response materialized with raw-page SHA256; historical disclosure fields are used only as provenance timing evidence.',
            'promotion':{'adjusted_close_blocker_closed':False,'event_timing_pit_verified':False,'formal_feature_ready':False,'model_freeze_allowed':False,'oos_metrics_allowed':False}
          }
          status='PASS_MAIN_SOURCE_TIMING_COVERAGE' if audit['exact_target_key_coverage'] and audit['all_matched_have_pit_date'] and audit['all_pit_dates_not_after_ex'] else 'REVIEW_MAIN_SOURCE_TIMING_COVERAGE'
          audit['status']=status
          out=Path('out/eastmoney_full_pit')
          (out/'EASTMONEY_SHAREBONUS_FULL_PIT_AUDIT_V482.json').write_text(json.dumps(audit,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          with (out/'EASTMONEY_SHAREBONUS_FULL_PIT_ROWS_V482.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(audits[0])); w.writeheader(); w.writerows(audits)
          print(json.dumps({k:audit[k] for k in ['status','target_event_n','eastmoney_response_rows','page_n','matched_n','missing_n','matched_without_any_disclosure_date_n','pit_date_after_ex_n','notice_date_after_ex_n','notice_lag_days_min','notice_lag_days_max','promotion']},ensure_ascii=False,indent=2))
          PY
      - name: Verify fail-closed source audit
        run: |
          python - <<'PY'
          import json
          x=json.load(open('out/eastmoney_full_pit/EASTMONEY_SHAREBONUS_FULL_PIT_AUDIT_V482.json'))
          assert x['target_event_n']==2620
          assert x['promotion']['adjusted_close_blocker_closed'] is False
          assert x['promotion']['event_timing_pit_verified'] is False
          assert x['promotion']['formal_feature_ready'] is False
          assert x['promotion']['model_freeze_allowed'] is False
          assert x['promotion']['oos_metrics_allowed'] is False
          assert x['status'] in {'PASS_MAIN_SOURCE_TIMING_COVERAGE','REVIEW_MAIN_SOURCE_TIMING_COVERAGE'}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gp12-eastmoney-sharebonus-full-pit-audit-v482
          path: out/eastmoney_full_pit/
          if-no-files-found: error
          retention-days: 30
