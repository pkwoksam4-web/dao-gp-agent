name: GP V4.82 Remaining Exact Candidates

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/remaining_exact_candidates_v482.py'
      - 'scripts/test_remaining_exact_candidates_v482.py'
      - '.github/workflows/remaining-exact-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remaining exact candidate tests
        run: |
          cd scripts
          python -m unittest -v test_remaining_exact_candidates_v482.py
