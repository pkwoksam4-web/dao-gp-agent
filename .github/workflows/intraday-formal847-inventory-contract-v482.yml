name: GP V4.82 Intraday Formal847 Inventory Contract

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - 'scripts/intraday_formal847_inventory_audit_v482.py'
      - 'scripts/test_intraday_formal847_inventory_audit_v482.py'
      - '.github/workflows/intraday-formal847-inventory-contract-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependency
        run: python -m pip install --disable-pip-version-check --quiet pandas
      - name: Formal847 inventory parsing contract
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_intraday_formal847_inventory_audit_v482.py
