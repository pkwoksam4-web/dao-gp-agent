# Checkpoint after exact evidence persistence commit aa8b583586e457562ed74dc758e3ce49bc0c388f
name: GP V4.82 Intraday Formal847 Inventory Contract

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - 'scripts/intraday_formal847_inventory_audit_v482.py'
      - 'scripts/test_intraday_formal847_inventory_audit_v482.py'
      - 'scripts/test_intraday_formal847_inventory_evidence_v482.py'
      - 'data/INTRADAY_FORMAL847_INVENTORY_AUDIT_V482.json'
      - 'data/FORMAL847_NEIGEZHU_INVENTORY_ROWS_V482.csv'
      - 'data/FORMAL847_SYMBOLS_V482.txt'
      - '.github/workflows/intraday-formal847-inventory-contract-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract dependency
        run: python -m pip install --disable-pip-version-check --quiet pandas
      - name: Formal847 inventory parsing and evidence contracts
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v \
            test_intraday_formal847_inventory_audit_v482.py \
            test_intraday_formal847_inventory_evidence_v482.py
