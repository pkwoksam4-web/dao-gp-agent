name: Public code index provenance probe

on:
  push:
    branches:
      - gp-sourcegraph-probe-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Search Sourcegraph including archived and forked repositories
        shell: bash
        run: |
          set +e
          mkdir -p probe/sourcegraph
          ua='dao-gp-agent-provenance-probe/3.3'
          run_sg() {
            name="$1"; query="$2"
            curl -G -L --retry 2 --connect-timeout 12 --max-time 120 -sS -A "$ua" \
              --data-urlencode "q=$query" --data-urlencode 'v=V3' \
              -D "probe/sourcegraph/${name}.headers" \
              -o "probe/sourcegraph/${name}.body" \
              -w '%{http_code}\n' 'https://sourcegraph.com/.api/search/stream' \
              > "probe/sourcegraph/${name}.status" 2> "probe/sourcegraph/${name}.err" || true
          }
          suffix='archived:yes fork:yes count:1000'
          run_sg rolling "context:global \"rolling_rank_quantile_weighted_stats_fast\" $suffix"
          run_sg liquidity "context:global \"liquidity_cut\" $suffix"
          run_sg growth_moti "context:global \"growth_moti\" $suffix"
          run_sg factor_memory "context:global \"factor-pipeline-memory\" $suffix"
          run_sg legacy_codes "context:global \"legacy_codes\" \"0_5_1\" $suffix"
          run_sg sha_dl "context:global \"39ae5ede04027f3d41de03fac658bb0728b45361\" $suffix"
          run_sg sha_aa "context:global \"166bc13f93d4538a66f2f4bff5d4cfa09d1b26e8\" $suffix"
          run_sg agent_desc "context:global \"Multi Agent Factor Research System\" $suffix"

      - name: Summarize useful hits
        shell: bash
        run: |
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          root=Path('probe/sourcegraph'); out={}
          for body in sorted(root.glob('*.body')):
              name=body.stem; raw=body.read_bytes(); text=raw.decode('utf-8','replace')
              status=(root/(name+'.status')).read_text(errors='replace').strip() if (root/(name+'.status')).exists() else None
              repos=sorted(set(re.findall(r'"repository":"([^"]+)"',text)))
              match_counts=[int(x) for x in re.findall(r'"matchCount":(\d+)',text)]
              out[name]={'http_status':status,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest() if raw else None,'repos':repos[:200],'final_match_count':max(match_counts) if match_counts else 0,'done':'"done":true' in text.replace(' ','')}
          (Path('probe')/'summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sourcegraph-all-repos-probe-20260914
          path: probe/
          retention-days: 30
