name: data_lake creation-hour neighbor GH Archive scan

on:
  push:
    branches:
      - gp-metadata-lineage-recovery-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scan 2026-07-10 04Z target and neighboring repo ids
        shell: bash
        run: |
          set -u
          mkdir -p out
          u="https://data.gharchive.org/2026-07-10-4.json.gz"
          tmp="/tmp/gha-2026-07-10-4.gz"
          code=$(curl -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 -sS -o "$tmp" -w '%{http_code}' "$u" || true)
          bytes=$(stat -c%s "$tmp" 2>/dev/null || echo 0)
          printf '2026-07-10\t4\t%s\t%s\n' "$code" "$bytes" > out/status.tsv
          : > out/matches.jsonl
          if [ "$code" = "200" ] && [ "$bytes" -gt 1000 ]; then
            gzip -dc "$tmp" 2>/dev/null | grep -F -e '1296046915' -e '1296046921' -e '1296046930' -e '300349603' >> out/matches.jsonl || true
          fi
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('out/matches.jsonl')
          ids={1296046915,1296046921,1296046930}
          rows=[]; seen=set()
          for line in p.read_text(errors='replace').splitlines():
              try: o=json.loads(line)
              except Exception: continue
              repo=o.get('repo') or {}; actor=o.get('actor') or {}; payload=o.get('payload') or {}
              if repo.get('id') not in ids and actor.get('id') != 300349603:
                  continue
              eid=str(o.get('id'))
              if eid in seen: continue
              seen.add(eid)
              rows.append({'id':o.get('id'),'type':o.get('type'),'created_at':o.get('created_at'),'actor':actor,'repo':repo,'org':o.get('org'),'payload':payload,'public':o.get('public')})
          rows.sort(key=lambda x:x.get('created_at') or '')
          pathlib.Path('out/matches_pretty.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          by_repo={str(i):[r for r in rows if (r.get('repo') or {}).get('id')==i] for i in sorted(ids)}
          pathlib.Path('out/by_repo.json').write_text(json.dumps(by_repo,indent=2,ensure_ascii=False))
          print(json.dumps(by_repo,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: datalake-creation-hour-neighbor-check
          path: out
          retention-days: 30
