name: zjzesheng legacy migration GH Archive scan

on:
  push:
    branches:
      - gp-metadata-lineage-recovery-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - {name: aug11-18, start: '2026-08-11', end: '2026-08-18'}
          - {name: aug19-26, start: '2026-08-19', end: '2026-08-26'}
          - {name: aug27-sep03, start: '2026-08-27', end: '2026-09-03'}
          - {name: sep04-08, start: '2026-09-04', end: '2026-09-08'}
          - {name: sep09-13, start: '2026-09-09', end: '2026-09-13'}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Scan ${{ matrix.chunk.name }} for organization and migration identities
        shell: bash
        env:
          START_DATE: ${{ matrix.chunk.start }}
          END_DATE: ${{ matrix.chunk.end }}
        run: |
          set -u
          mkdir -p out
          : > out/matches.jsonl
          : > out/status.tsv
          d="$START_DATE"
          while :; do
            for hour in $(seq 0 23); do
              u="https://data.gharchive.org/${d}-${hour}.json.gz"
              tmp="/tmp/gha-${d}-${hour}.gz"
              code=$(curl -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 -sS -o "$tmp" -w '%{http_code}' "$u" || true)
              bytes=$(stat -c%s "$tmp" 2>/dev/null || echo 0)
              printf '%s\t%s\t%s\t%s\n' "$d" "$hour" "$code" "$bytes" >> out/status.tsv
              if [ "$code" = "200" ] && [ "$bytes" -gt 1000 ]; then
                gzip -dc "$tmp" 2>/dev/null | grep -F -e 'zjzesheng/' -e 'legacy_codes' -e '315634734' -e '300349603' -e '216113541' >> out/matches.jsonl || true
              fi
              rm -f "$tmp"
            done
            [ "$d" = "$END_DATE" ] && break
            d=$(date -I -d "$d + 1 day")
          done
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('out/matches.jsonl')
          seen=set(); rows=[]
          for line in p.read_text(errors='replace').splitlines():
              try: o=json.loads(line)
              except Exception: continue
              eid=str(o.get('id'))
              if eid in seen: continue
              seen.add(eid)
              rows.append({
                  'id':o.get('id'),'type':o.get('type'),'created_at':o.get('created_at'),
                  'actor':o.get('actor'),'repo':o.get('repo'),'org':o.get('org'),'payload':o.get('payload')
              })
          rows.sort(key=lambda x: x.get('created_at') or '')
          pathlib.Path('out/matches_pretty.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          pathlib.Path('out/first_match.json').write_text(json.dumps(rows[0] if rows else None,indent=2,ensure_ascii=False))
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zjzesheng-legacy-migration-${{ matrix.chunk.name }}
          path: out
          retention-days: 30
