name: AlphaAgent origin GH Archive scan

on:
  push:
    branches:
      - gp-metadata-lineage-recovery-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        chunk:
          - {name: jul01-08, start: 1, end: 8}
          - {name: jul09-16, start: 9, end: 16}
          - {name: jul17-24, start: 17, end: 24}
          - {name: jul25-31, start: 25, end: 31}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan ${{ matrix.chunk.name }} for repo id and name
        shell: bash
        run: |
          set -u
          mkdir -p out
          : > out/matches.jsonl
          : > out/status.tsv
          for daynum in $(seq ${{ matrix.chunk.start }} ${{ matrix.chunk.end }}); do
            day=$(printf '%02d' "$daynum")
            for hour in $(seq 0 23); do
              u="https://data.gharchive.org/2026-07-${day}-${hour}.json.gz"
              tmp="/tmp/gha-${day}-${hour}.gz"
              code=$(curl -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 -sS -o "$tmp" -w '%{http_code}' "$u" || true)
              bytes=$(stat -c%s "$tmp" 2>/dev/null || echo 0)
              printf '2026-07-%s\t%s\t%s\t%s\n' "$day" "$hour" "$code" "$bytes" >> out/status.tsv
              if [ "$code" = "200" ] && [ "$bytes" -gt 1000 ]; then
                gzip -dc "$tmp" 2>/dev/null | grep -F -e '1317931511' -e 'leo-quant-research/AlphaAgent' >> out/matches.jsonl || true
              fi
              rm -f "$tmp"
            done
          done
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('out/matches.jsonl')
          rows=[]
          for line in p.read_text(errors='replace').splitlines():
              try: o=json.loads(line)
              except Exception: continue
              rows.append({'id':o.get('id'),'type':o.get('type'),'created_at':o.get('created_at'),'actor':o.get('actor'),'repo':o.get('repo'),'payload':o.get('payload')})
          rows.sort(key=lambda x: x.get('created_at') or '')
          pathlib.Path('out/matches_pretty.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          pathlib.Path('out/first_match.json').write_text(json.dumps(rows[0] if rows else None,indent=2,ensure_ascii=False))
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alphaagent-origin-gharchive-20260914-${{ matrix.chunk.name }}
          path: out
          retention-days: 30
