name: AlphaAgent origin GH Archive scan

on:
  push:
    branches:
      - gp-metadata-lineage-recovery-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Scan Aug 4-7 for repo id and name
        shell: bash
        run: |
          set -u
          mkdir -p out
          : > out/matches.jsonl
          : > out/status.tsv
          for day in 04 05 06 07; do
            for hour in $(seq 0 23); do
              u="https://data.gharchive.org/2026-08-${day}-${hour}.json.gz"
              tmp="/tmp/gha-${day}-${hour}.gz"
              code=$(curl -L --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 120 -sS -o "$tmp" -w '%{http_code}' "$u" || true)
              bytes=$(stat -c%s "$tmp" 2>/dev/null || echo 0)
              printf '2026-08-%s\t%s\t%s\t%s\n' "$day" "$hour" "$code" "$bytes" >> out/status.tsv
              if [ "$code" = "200" ] && [ "$bytes" -gt 1000 ]; then
                gzip -dc "$tmp" 2>/dev/null | grep -F -e '1317931511' -e 'leo-quant-research/AlphaAgent' >> out/matches.jsonl || true
              fi
              rm -f "$tmp"
            done
          done
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('out/matches.jsonl')
          rows=[]
          for line in p.read_text(errors='replace').splitlines():
              try: o=json.loads(line)
              except: continue
              rows.append({'id':o.get('id'),'type':o.get('type'),'created_at':o.get('created_at'),'actor':o.get('actor'),'repo':o.get('repo'),'payload':o.get('payload')})
          pathlib.Path('out/matches_pretty.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: alphaagent-origin-gharchive-20260914-aug04-07
          path: out
          retention-days: 30
