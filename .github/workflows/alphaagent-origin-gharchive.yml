name: Software Heritage revision object probe

on:
  push:
    branches:
      - gp-metadata-lineage-recovery-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe commit SHAs directly in Software Heritage
        shell: bash
        run: |
          set -u
          mkdir -p out/bodies
          : > out/status.tsv
          cat > out/targets.tsv <<'EOF'
          data_lake d659e6a5d849d8557e4cb2b25f9014f94ef3dec4
          data_lake eb1345a857c7fd577f3102cd18812bc0924bf4c2
          data_lake 993c24cf8aea3e63619e35ee4f9f2639810431a2
          data_lake f46f72eda893fa2abb5abe020e1cb67b233d9a59
          data_lake 39ae5ede04027f3d41de03fac658bb0728b45361
          AlphaAgent 25812984ac52635af50c6522b964c5ed9f1fa658
          AlphaAgent b813095f2fb17d0e890e0a80cc86ad222700b9ef
          AlphaAgent 166bc13f93d4538a66f2f4bff5d4cfa09d1b26e8
          EOF
          while read -r repo sha; do
            url="https://archive.softwareheritage.org/api/1/revision/${sha}/"
            body="out/bodies/${sha}.json"
            code=$(curl -L --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 60 -sS -A 'dao-gp-recovery/1.0' -o "$body" -w '%{http_code}' "$url" || true)
            bytes=$(stat -c%s "$body" 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\t%s\n' "$repo" "$sha" "$code" "$bytes" >> out/status.tsv
          done < out/targets.tsv
          python - <<'PY'
          import json, pathlib
          rows=[]
          for line in pathlib.Path('out/status.tsv').read_text().splitlines():
              repo,sha,code,bytes_=line.split('\t')
              body=pathlib.Path('out/bodies',sha+'.json').read_text(errors='replace')
              parsed=None
              try: parsed=json.loads(body)
              except Exception: pass
              rows.append({'repo':repo,'sha':sha,'http_code':int(code or 0),'bytes':int(bytes_),'body':parsed if parsed is not None else body[:1000]})
          pathlib.Path('out/results.json').write_text(json.dumps(rows,indent=2,ensure_ascii=False))
          print(json.dumps(rows,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: swh-revision-object-probe-20260914
          path: out
          retention-days: 30
