name: Wayback wildcard inventory for deleted repos

on:
  push:
    branches:
      - gp-metadata-lineage-recovery-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enumerate archived URLs for deleted repositories
        shell: bash
        run: |
          set -u
          mkdir -p out
          : > out/status.tsv
          python - <<'PY' > out/queries.tsv
          import urllib.parse
          qs=[
            ('data_lake_github','github.com/leo-quant-research/data_lake/*'),
            ('data_lake_raw','raw.githubusercontent.com/leo-quant-research/data_lake/*'),
            ('data_lake_api','api.github.com/repos/leo-quant-research/data_lake/*'),
            ('alphaagent_github','github.com/leo-quant-research/AlphaAgent/*'),
            ('alphaagent_raw','raw.githubusercontent.com/leo-quant-research/AlphaAgent/*'),
          ]
          for name,target in qs:
              params={'url':target,'from':'2026','to':'2026','output':'json','fl':'timestamp,original,statuscode,mimetype,digest','filter':'statuscode:200','collapse':'urlkey','limit':'5000'}
              print(name+'\t'+'https://web.archive.org/cdx/search/cdx?'+urllib.parse.urlencode(params))
          PY
          while IFS=$'\t' read -r name url; do
            body="out/${name}.json"
            code=$(curl -L --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 90 -sS -A 'Mozilla/5.0' -o "$body" -w '%{http_code}' "$url" || true)
            bytes=$(stat -c%s "$body" 2>/dev/null || echo 0)
            printf '%s\t%s\t%s\n' "$name" "$code" "$bytes" >> out/status.tsv
          done < out/queries.tsv
          python - <<'PY'
          import json,pathlib
          summary={}
          for line in pathlib.Path('out/status.tsv').read_text().splitlines():
              name,code,bytes_=line.split('\t')
              p=pathlib.Path('out',name+'.json')
              txt=p.read_text(errors='replace') if p.exists() else ''
              rows=None
              try: rows=json.loads(txt)
              except Exception: pass
              summary[name]={'http_code':int(code or 0),'bytes':int(bytes_),'rows':(len(rows)-1 if isinstance(rows,list) and rows else None),'sample':rows[:20] if isinstance(rows,list) else txt[:1500]}
          pathlib.Path('out/summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          print(json.dumps(summary,indent=2,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wayback-wildcard-inventory-20260914
          path: out
          retention-days: 30
