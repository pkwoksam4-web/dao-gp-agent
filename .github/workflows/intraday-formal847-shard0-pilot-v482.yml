name: GP V4.82 Intraday Formal847 Shard0 Pilot

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - '.github/workflows/intraday-formal847-shard0-pilot-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  shard0:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install materialization dependencies
        run: python -m pip install --disable-pip-version-check --quiet pandas pyarrow requests
      - name: Contract smoke test
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_intraday_formal847_materialize_v482.py
      - name: Download authoritative PIT-ST input
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-merged
          path: input/pitst
          run-id: 33971534669
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify PIT-ST identity and materialize real shard 0 of 17
        shell: bash
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          PIT="$(find input/pitst -name 'PIT_ST_DAILY_MERGED_V480.csv' -print -quit)"
          test -n "$PIT"
          echo 'ffb2967872836d0669db3ce0804ca38df1fde9c220f8e63bb4bbf5eafb4f97de  '"$PIT" | sha256sum -c -
          rm -rf out/shard0 cache/shard0
          python scripts/intraday_formal847_materialize_v482.py shard \
            --pitst "$PIT" \
            --inventory data/FORMAL847_NEIGEZHU_INVENTORY_ROWS_V482.csv \
            --shard-index 0 \
            --shard-count 17 \
            --out-dir out/shard0 \
            --cache-dir cache/shard0
          rm -rf cache/shard0
      - name: Upload byte-bound shard0 materialization evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-intraday-formal847-shard00-v482
          path: out/shard0/
          if-no-files-found: error
          retention-days: 30
