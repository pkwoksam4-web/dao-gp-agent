name: GP V4.82 Intraday 000638 BaoStock Fallback

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - 'scripts/test_intraday_000638_baostock_fallback_v482.py'
      - 'scripts/intraday_000638_baostock_fallback_v482.py'
      - '.github/workflows/intraday-000638-baostock-fallback-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check --quiet pandas
      - name: Run exact targeted fallback contract tests
        run: |
          cd scripts
          python -m unittest -v test_intraday_000638_baostock_fallback_v482.py
