name: DAO2 C FFD Full Series State Apply V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-ffd-full-series-state-apply-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gp/dao2-c-sector-pit
          fetch-depth: 1
      - name: Download verified full Series audit
        uses: actions/download-artifact@v4
        with:
          name: dao2-c-ffd-full-series-admission-audit-v1
          path: /tmp/full-series
          run-id: 37914902681
          github-token: ${{ github.token }}
      - name: Apply verified Series PASS and keep Breadth fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          B=Path('data/dao2/modules')
          audit=json.loads(Path('/tmp/full-series/C_SECTOR_FFD_FULL_SERIES_ADMISSION_AUDIT_V1.json').read_text(encoding='utf-8'))
          assert audit['status']=='PASS_SUBCOMPONENT'
          assert audit['inputs']['frozen_base_rows']==42783
          assert audit['inputs']['ffd_direct_rows_total']==301
          assert audit['inputs']['derived_close_rows_admitted']==0
          assert audit['set_audit']['union_keys']==43084
          assert audit['set_audit']['missing_keys']==0 and audit['set_audit']['extra_keys']==0
          v=audit['frozen_verifier']
          assert v['status']=='PASS' and v['full_coverage'] is True
          assert v['missing_required_keys']==0 and v['derived_close_rows_rejected']==0
          assert audit['output']['sha256']=='f579ac35c0009e516ab92be0f4c6d36531a7026bde7ccd00e013590e8ea13b70'
          (B/'C_SECTOR_FFD_FULL_SERIES_ADMISSION_AUDIT_V1.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          series=json.loads((B/'C_SECTOR_SERIES_CHECKPOINT_V1.json').read_text(encoding='utf-8'))
          series['status']='PASS_SUBCOMPONENT'
          series['blocker_closed_within_module']=True
          ex=series['exact_audit']
          ex['workflow_run_id']=37914902681
          ex['workflow_job_id']=113768595346
          ex['head_sha']='e23f39a4662d9cc03eaf302cd2b287cb02322ecd'
          ex['status']='PASS_SUBCOMPONENT'
          ex['observed_required_keys']=43084
          ex['missing_required_keys']=0
          ex['gap_dates']=[]
          ex['logical_observed_required_keys']=43084
          ex['admitted_derived_close_rows']=0
          ex['evidence_only_derived_close_rows']=298
          ex['potential_observed_after_future_derived_governance_migration']=43084
          ex['ffd_298_direct_recovery']={
              'status':'PASS_BINDING_DIRECT_298_ADMISSION',
              'binding_checkpoint':'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json',
              'patch':'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_PATCH_V1.csv',
              'workflow_run_id':37907353461,'artifact_id':11605290540,
              'admitted_raw_close_rows':298,'derived_close_rows_admitted':0,
              'crosscheck_exact_2dp_rows':298,'crosscheck_mismatch_rows':0,
          }
          ex['full_series_admission_audit']={
              'status':'PASS_SUBCOMPONENT','workflow_run_id':37914902681,'workflow_job_id':113768595346,
              'artifact_id':11609296558,'artifact_digest':'sha256:7b095dcaa082dac06aeeeb6e8b42b8bfbdddb4a588e09df688067b2a3fb994ea',
              'evidence_path':'data/dao2/modules/C_SECTOR_FFD_FULL_SERIES_ADMISSION_AUDIT_V1.json',
              'output_member':'sector_close_formal_ffd_bound.csv.gz','output_sha256':'f579ac35c0009e516ab92be0f4c6d36531a7026bde7ccd00e013590e8ea13b70',
              'rows':43084,'missing':0,'derived_close_rows_admitted':0,
          }
          ex['gap_ledger_v1']['coverage_changed']=True
          ex['gap_ledger_v1']['admitted_direct_rows']=301
          ex['gap_ledger_v1']['remaining_missing_after_direct_admission']=0
          val=series['validation']
          val['exact_required_key_coverage']='43084/43084'
          val['missing_required_keys']=0
          val['duplicate_required_keys']=0
          val['full_formal_coverage_proven']=True
          val['admissible_coverage']='43084/43084'
          val['admitted_derived_close_rows']=0
          val['admitted_direct_recovery_rows']=301
          val['same_date_provenance']=True
          val['fill_method']='NONE'
          val['forward_fill']=False
          val['synthetic']=False
          val['finite_positive_close']=True
          series['blockers']=[]
          series['evidence_boundary']['ffd_direct_rows_admitted']=301
          series['evidence_boundary']['ffd_298_direct_binding_pass']=True
          series['evidence_boundary']['wind_derived_rows_not_yet_admitted']=True
          series['evidence_boundary']['wind_derived_rows_admitted_as_distinct_provenance']=False
          series['safety']['model_freeze_allowed']=False
          series['safety']['oos_metrics_allowed']=False
          (B/'C_SECTOR_SERIES_CHECKPOINT_V1.json').write_text(json.dumps(series,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          breadth=json.loads((B/'C_SECTOR_BREADTH_CHECKPOINT_V1.json').read_text(encoding='utf-8'))
          breadth['status']='BLOCKED_FORMULA_UNBOUND'
          breadth['blocker_closed_within_module']=False
          breadth['derivation_allowed']=False
          breadth['dependencies']['dependencies_satisfied']=True
          breadth['blockers']=['exact same-day sector breadth ratio definition remains unrecovered']
          breadth['safety']['derivation_before_dependencies_forbidden']=True
          (B/'C_SECTOR_BREADTH_CHECKPOINT_V1.json').write_text(json.dumps(breadth,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          state=json.loads((B/'C_SECTOR_PIT_STATE_V1.json').read_text(encoding='utf-8'))
          ss=state['progress']['sector_series']
          ss['status']='PASS_SUBCOMPONENT'
          ss['full_formal_coverage_proven']=True
          ss['observed_required_keys']=43084
          ss['missing_required_keys']=0
          ss['admitted_derived_close_rows']=0
          ss['evidence_only_derived_close_rows']=298
          ss['admissible_coverage']='43084/43084'
          ss['admitted_direct_recovery_rows']=301
          ss['unresolved_direct_keys']=[]
          ss['manual_intervention_required']=False
          ss['manual_intervention_status']='NOT_REQUIRED_SERIES_PASS'
          ss['resume_condition']='Series PASS_SUBCOMPONENT; proceed only to breadth identity/formula recovery.'
          ss['ffd_298_direct_recovery']={
              'status':'PASS_BINDING_DIRECT_298_ADMISSION','admitted_rows':298,
              'binding_checkpoint':'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json',
              'full_series_audit':'data/dao2/modules/C_SECTOR_FFD_FULL_SERIES_ADMISSION_AUDIT_V1.json',
          }
          sb=state['progress']['sector_breadth']
          sb['status']='BLOCKED_FORMULA_UNBOUND'
          sb['derivation_allowed']=False
          sb['membership_dependency_closed']=True
          sb['series_dependency_closed']=True
          state['progress']['latest_subcomponent_checkpoint']={
              'component':'sector_series','status':'PASS_SUBCOMPONENT',
              'path':'data/dao2/modules/C_SECTOR_SERIES_CHECKPOINT_V1.json',
              'workflow_run_id':37914902681,'artifact_id':11609296558,
          }
          state['open_blockers']=['SECTOR_BREADTH_UNBOUND']
          state['closed_blockers']=['SECTOR_MEMBERSHIP_PIT_UNBOUND','SECTOR_SERIES_UNBOUND']
          (B/'C_SECTOR_PIT_STATE_V1.json').write_text(json.dumps(state,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'series':'PASS_SUBCOMPONENT','coverage':'43084/43084','derived_admitted':0,'breadth':'BLOCKED_FORMULA_UNBOUND'},ensure_ascii=False))
          PY
      - name: Verify guards before commit
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest -v scripts/test_dao2_c_ffd_298_direct_admission_v1.py
          python -m unittest -v scripts/test_dao2_c_sector_governance_guard_v1.py
          python scripts/dao2_c_sector_governance_guard_v1.py
          python scripts/dao2_module_state_guard_v1.py data/dao2/modules/C_SECTOR_PIT_STATE_V1.json
      - name: Commit verified Series PASS transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dao2/modules/C_SECTOR_FFD_FULL_SERIES_ADMISSION_AUDIT_V1.json \
                  data/dao2/modules/C_SECTOR_SERIES_CHECKPOINT_V1.json \
                  data/dao2/modules/C_SECTOR_BREADTH_CHECKPOINT_V1.json \
                  data/dao2/modules/C_SECTOR_PIT_STATE_V1.json
          git commit -m 'state(dao2-c): close Series with 43084 direct-provenance rows'
          git push origin HEAD:gp/dao2-c-sector-pit
