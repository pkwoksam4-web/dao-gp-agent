name: DAO2 C FFD Partial Admission Apply V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-ffd-partial-admission-apply-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gp/dao2-c-sector-pit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the three FFD direct rows
        env:
          PYTHONPATH: scripts
        run: python scripts/dao2_c_apply_ffd_partial_admission_v1.py
      - name: Verify FFD binding and existing fail-closed governance
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest -v scripts/test_dao2_c_ffd_direct_binding_v1.py
          python -m unittest -v scripts/test_dao2_c_sector_governance_guard_v1.py
          python scripts/dao2_c_sector_governance_guard_v1.py
          python scripts/dao2_module_state_guard_v1.py data/dao2/modules/C_SECTOR_PIT_STATE_V1.json
      - name: Commit generated evidence and accounting only
        shell: bash
        run: |
          git config user.name 'dao2-c-bot'
          git config user.email 'dao2-c-bot@users.noreply.github.com'
          git add \
            data/dao2/modules/C_SECTOR_FFD_801020_BINDING_AUDIT_V1.json \
            data/dao2/modules/C_SECTOR_FFD_801020_DIRECT_OHLC_EVIDENCE_V1.json \
            data/dao2/modules/C_SECTOR_FFD_801020_BINDING_CHECKPOINT_V1.json \
            data/dao2/modules/C_SECTOR_FFD_801020_DIRECT_PATCH_V1.csv \
            data/dao2/modules/C_SECTOR_801020_DIRECT_CLOSE_SEARCH_V1.json \
            data/dao2/modules/C_SECTOR_SERIES_CHECKPOINT_V1.json \
            data/dao2/modules/C_SECTOR_PIT_STATE_V1.json
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat(dao2-c): admit 3 FFD direct SW2014 rows under frozen gate'
          git push origin HEAD:gp/dao2-c-sector-pit
