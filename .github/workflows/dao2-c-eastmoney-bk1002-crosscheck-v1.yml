name: DAO2 C Eastmoney BK1002 Crosscheck V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-eastmoney-bk1002-crosscheck-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch historical Eastmoney BK1002 unadjusted K-line
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib,json,urllib.parse,urllib.request
          from pathlib import Path
          OUT=Path('artifact_em_bk1002_c'); OUT.mkdir(exist_ok=True)
          hosts=['push2his.eastmoney.com','91.push2his.eastmoney.com','63.push2his.eastmoney.com']
          params={'secid':'90.BK1002','klt':'101','fqt':'0','beg':'20210801','end':'20211031','fields1':'f1,f2,f3,f4,f5,f6','fields2':'f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61'}
          wanted={
            '2021-08-05':{'role':'neighbor','expected_close':2954.25},
            '2021-08-06':{'role':'target','ffd_close':3037.61},
            '2021-08-09':{'role':'neighbor','expected_close':3048.39},
            '2021-09-30':{'role':'neighbor','expected_close':3976.45},
            '2021-10-08':{'role':'target','ffd_close':3913.73},
            '2021-10-11':{'role':'neighbor','expected_close':3971.72},
            '2021-10-21':{'role':'neighbor','expected_close':3886.69},
            '2021-10-22':{'role':'target','ffd_close':3702.52},
            '2021-10-25':{'role':'neighbor','expected_close':3804.92}}
          result={'artifact':'DAO2_C_EASTMONEY_BK1002_CROSSCHECK_V1','secid':'90.BK1002','historical_mapping_evidence':'old Eastmoney industry API documentation: BK1002=采掘','adjust':'none/fqt=0','requests':[],'formal_admission_changed':False,'derived_close_admitted':False,'breadth_derivation_allowed':False}
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://quote.eastmoney.com/'}
          baseline=None
          for i,h in enumerate(hosts,1):
            url='https://'+h+'/api/qt/stock/kline/get?'+urllib.parse.urlencode(params); ent={'host':h,'url':url}
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); ent['http_status']=r.status
              ent['raw_sha256']=hashlib.sha256(raw).hexdigest(); ent['bytes']=len(raw); (OUT/f'response_{i}.json').write_bytes(raw)
              obj=json.loads(raw.decode()); data=obj.get('data') or {}; ent['returned_code']=data.get('code'); ent['returned_name']=data.get('name'); ent['market']=data.get('market')
              rows=[]
              for line in data.get('klines') or []:
                p=str(line).split(',')
                if len(p)>=5: rows.append({'date':p[0],'open':float(p[1]),'close':float(p[2]),'high':float(p[3]),'low':float(p[4]),'raw':line})
              by={r['date']:r for r in rows}; exact=[]
              for d,spec in wanted.items():
                if d not in by: continue
                x=dict(by[d]); x.update(spec)
                if 'expected_close' in spec: x['neighbor_exact']=abs(x['close']-spec['expected_close'])<1e-9
                if 'ffd_close' in spec: x['ffd_target_exact']=abs(x['close']-spec['ffd_close'])<1e-9
                exact.append(x)
              ent['total_klines']=len(rows); ent['wanted_rows']=exact; ent['wanted_dates_found']=sorted(x['date'] for x in exact)
              ent['neighbor_exact_count']=sum(x.get('neighbor_exact') is True for x in exact); ent['target_ffd_exact_count']=sum(x.get('ffd_target_exact') is True for x in exact)
              norm=[(x['date'],x['open'],x['high'],x['low'],x['close']) for x in rows]
              if baseline is None: baseline=norm
              ent['matches_first_host_full_series']=norm==baseline
            except Exception as e: ent['error']=f'{type(e).__name__}: {e}'
            result['requests'].append(ent)
          ok=[x for x in result['requests'] if x.get('http_status')==200 and x.get('returned_name')]
          result['successful_hosts']=len(ok); result['all_successful_hosts_same_series']=bool(ok) and all(x.get('matches_first_host_full_series') for x in ok)
          result['best_neighbor_exact_count']=max([x.get('neighbor_exact_count',0) for x in ok] or [0]); result['best_target_ffd_exact_count']=max([x.get('target_ffd_exact_count',0) for x in ok] or [0])
          result['status']='PASS_SECOND_CARRIER_EXACT_CROSSCHECK' if result['best_neighbor_exact_count']==6 and result['best_target_ffd_exact_count']==3 else ('PARTIAL_OR_MISMATCH' if ok else 'TRANSPORT_OR_SYMBOL_UNAVAILABLE')
          can=json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':')); result['content_sha256_without_hash_field']=hashlib.sha256(can.encode()).hexdigest(); (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'successful_hosts':result['successful_hosts'],'same_series':result['all_successful_hosts_same_series'],'neighbor_exact':result['best_neighbor_exact_count'],'target_exact':result['best_target_ffd_exact_count'],'names':[x.get('returned_name') for x in ok],'hash':result['content_sha256_without_hash_field']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dao2-c-eastmoney-bk1002-crosscheck-v1
          path: artifact_em_bk1002_c/
          if-no-files-found: error
          retention-days: 30
