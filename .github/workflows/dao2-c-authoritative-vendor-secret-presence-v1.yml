name: DAO2 C Authoritative Vendor Secret Presence V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-authoritative-vendor-secret-presence-v1.yml'
  pull_request:
    branches:
      - gp/dao2-migration-20260920
    paths:
      - '.github/workflows/dao2-c-authoritative-vendor-secret-presence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RQDATA_USERNAME: ${{ secrets.RQDATA_USERNAME }}
      RQDATA_PASSWORD: ${{ secrets.RQDATA_PASSWORD }}
      RQDATA_TOKEN: ${{ secrets.RQDATA_TOKEN }}
      RQDATAC_USERNAME: ${{ secrets.RQDATAC_USERNAME }}
      RQDATAC_PASSWORD: ${{ secrets.RQDATAC_PASSWORD }}
      DATACUBE_TOKEN: ${{ secrets.DATACUBE_TOKEN }}
      FOUNDER_DATACUBE_TOKEN: ${{ secrets.FOUNDER_DATACUBE_TOKEN }}
      DCUBE_TOKEN: ${{ secrets.DCUBE_TOKEN }}
      WIND_TOKEN: ${{ secrets.WIND_TOKEN }}
      WIND_USERNAME: ${{ secrets.WIND_USERNAME }}
      WIND_PASSWORD: ${{ secrets.WIND_PASSWORD }}
      IFIND_TOKEN: ${{ secrets.IFIND_TOKEN }}
      IFIND_USERNAME: ${{ secrets.IFIND_USERNAME }}
      IFIND_PASSWORD: ${{ secrets.IFIND_PASSWORD }}
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
    steps:
      - name: Record presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          names = [
              'RQDATA_USERNAME','RQDATA_PASSWORD','RQDATA_TOKEN',
              'RQDATAC_USERNAME','RQDATAC_PASSWORD',
              'DATACUBE_TOKEN','FOUNDER_DATACUBE_TOKEN','DCUBE_TOKEN',
              'WIND_TOKEN','WIND_USERNAME','WIND_PASSWORD',
              'IFIND_TOKEN','IFIND_USERNAME','IFIND_PASSWORD',
              'TUSHARE_TOKEN',
          ]
          present = {name: bool(os.environ.get(name, '').strip()) for name in names}
          grouped = {
              'rqdata_any': any(present[n] for n in ['RQDATA_USERNAME','RQDATA_PASSWORD','RQDATA_TOKEN','RQDATAC_USERNAME','RQDATAC_PASSWORD']),
              'datacube_any': any(present[n] for n in ['DATACUBE_TOKEN','FOUNDER_DATACUBE_TOKEN','DCUBE_TOKEN']),
              'wind_any': any(present[n] for n in ['WIND_TOKEN','WIND_USERNAME','WIND_PASSWORD']),
              'ifind_any': any(present[n] for n in ['IFIND_TOKEN','IFIND_USERNAME','IFIND_PASSWORD']),
              'tushare_token': present['TUSHARE_TOKEN'],
          }
          out = {
              'artifact': 'DAO2_C_AUTHORITATIVE_VENDOR_SECRET_PRESENCE_V1',
              'status': 'PASS_PRESENCE_ONLY',
              'secret_values_exposed': False,
              'present': present,
              'grouped': grouped,
          }
          Path('artifact_vendor_presence').mkdir(exist_ok=True)
          Path('artifact_vendor_presence/result.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(out, ensure_ascii=False))
          PY
      - name: Upload presence evidence
        uses: actions/upload-artifact@v4
        with:
          name: dao2-c-authoritative-vendor-secret-presence-v1
          path: artifact_vendor_presence/result.json
          if-no-files-found: error
          retention-days: 30
