name: GP12 Reconstruction Candidate V1

on:
  push:
    branches:
      - gp/strategy-package-candidate-v482
      - gp/gp12-candidate-benchmark-000985-v1
    paths:
      - 'scripts/gp12_candidate_v1.py'
      - 'scripts/test_gp12_candidate_v1.py'
      - 'scripts/gp12_candidate_package_review_v1.py'
      - 'scripts/test_gp12_candidate_benchmark_integration_v1.py'
      - 'scripts/gp12_candidate_benchmark_v1.py'
      - 'scripts/test_gp12_candidate_benchmark_v1.py'
      - 'scripts/gp12_candidate_input_readiness_v1.py'
      - 'scripts/test_gp12_candidate_input_readiness_v1.py'
      - 'scripts/gp12_eastmoney_adapter_v1.py'
      - 'scripts/test_gp12_eastmoney_adapter_v1.py'
      - 'scripts/gp12_sohu_qfq_adapter_v1.py'
      - 'scripts/test_gp12_sohu_qfq_adapter_v1.py'
      - 'scripts/gp12_source_router_v1.py'
      - 'scripts/test_gp12_source_router_v1.py'
      - 'data/GP12_CANDIDATE_BENCHMARK_V1.json'
      - 'data/GP12_CANDIDATE_PARAMETERS_V1.json'
      - 'data/GP12_CANDIDATE_FACTORS_V1.json'
      - 'docs/gp12-candidate-review.md'
      - '.github/workflows/gp12-candidate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: pip install -q requests
      - name: Candidate formulas and gate regressions
        env:
          PYTHONPATH: scripts
        run: |
          python -m unittest -v \
            test_gp12_candidate_v1 \
            test_gp12_candidate_benchmark_v1 \
            test_gp12_candidate_benchmark_integration_v1 \
            test_gp12_candidate_input_readiness_v1 \
            test_gp12_eastmoney_adapter_v1 \
            test_gp12_sohu_qfq_adapter_v1 \
            test_gp12_source_router_v1 \
            test_strategy_asset_recovery_v482 \
            test_model_freeze_recovery_v482 \
            test_oos_admission_v482
      - name: Download verified V4.80 frozen calendar artifact
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-final-audit
          path: calendar-final
          run-id: 33977325822
          github-token: ${{ github.token }}
      - name: Validate CSI All Share candidate benchmark over full Formal window
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p out/benchmark
          python scripts/gp12_candidate_benchmark_v1.py \
            --binding data/GP12_CANDIDATE_BENCHMARK_V1.json \
            --factors data/GP12_CANDIDATE_FACTORS_V1.json \
            --parameters data/GP12_CANDIDATE_PARAMETERS_V1.json \
            --calendar-csv calendar-final/OFFICIAL_A_SHARE_OPEN_DATES_V357.csv \
            --out-dir out/benchmark
      - name: Review candidate package with benchmark evidence
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/gp12_candidate_package_review_v1.py \
            --review \
            --benchmark-validation out/benchmark/GP12_CANDIDATE_BENCHMARK_VALIDATION_V1.json \
            --out out/GP12_CANDIDATE_REVIEW_V1.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('out/GP12_CANDIDATE_REVIEW_V1.json').read_text(encoding='utf-8'))
          assert report['artifact'] == 'GP12_CANDIDATE_PACKAGE_REVIEW_WITH_BENCHMARK_V1'
          assert report['candidate_review_passed'] is True
          assert report['candidate_benchmark_validated'] is True
          assert report['candidate_benchmark_blocker_closed'] is True
          assert report['candidate_benchmark']['name'] == 'CSI All Share'
          assert report['candidate_benchmark']['code'] == '000985'
          assert report['candidate_benchmark']['eastmoney_secid'] == '1.000985'
          assert report['candidate_benchmark']['calendar_n'] == 1426
          assert report['candidate_benchmark']['formal_window'] == ['2020-06-01','2026-04-17']
          assert report['candidate_benchmark']['pit_scope'] == 'SESSION_CLOSE_NO_LOOKAHEAD_POLICY'
          assert report['candidate_benchmark']['source_identity_valid'] is True
          assert report['benchmark_binding_scope'] == 'BENCHMARK_REFERENCE_ONLY'
          assert report['benchmark_feature_binding_allowed'] is False
          assert report['market_adjusted_close_substitution_allowed'] is False
          assert report['historical_benchmark_recovered'] is False
          assert report['historical_strategy_recovered'] is False
          assert report['real_feature_inputs_validated'] is False
          assert report['model_freeze_allowed'] is False
          assert report['oos_metrics_allowed'] is False
          assert report['adoption_status'] == 'UNAPPROVED'
          assert report['asset_hashes']['factor_definition_sha256'] == 'b52f394fb13417e6f0323f7175a50a7d950dba8af09f63a97e739c6a4c70160e'
          assert report['asset_hashes']['parameter_sha256'] == '22f054d0068c2c1d7bed3c17e586eca1b22d7b3888547de36e6e754578ceb204'
          assert 'CANDIDATE_BENCHMARK_EVIDENCE_INVALID' not in report['blockers']
          assert 'NEW_STRATEGY_ADOPTION_REQUIRED' in report['blockers']
          print(json.dumps({
              'candidate_review_passed': report['candidate_review_passed'],
              'candidate_benchmark_validated': report['candidate_benchmark_validated'],
              'candidate_benchmark_blocker_closed': report['candidate_benchmark_blocker_closed'],
              'benchmark': report['candidate_benchmark'],
              'benchmark_feature_binding_allowed': report['benchmark_feature_binding_allowed'],
              'market_adjusted_close_substitution_allowed': report['market_adjusted_close_substitution_allowed'],
              'historical_benchmark_recovered': report['historical_benchmark_recovered'],
              'real_feature_inputs_validated': report['real_feature_inputs_validated'],
              'factor_definition_sha256': report['asset_hashes']['factor_definition_sha256'],
              'parameter_sha256': report['asset_hashes']['parameter_sha256'],
              'blockers': report['blockers'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload reviewable candidate package
        uses: actions/upload-artifact@v4
        with:
          name: gp12-reconstruction-candidate-v1
          path: |
            out/GP12_CANDIDATE_REVIEW_V1.json
            out/benchmark/GP12_CANDIDATE_BENCHMARK_VALIDATION_V1.json
            out/benchmark/CSI_ALL_SHARE_000985_DAILY_CLOSE_20200601_20260417.csv
            scripts/gp12_candidate_v1.py
            scripts/test_gp12_candidate_v1.py
            scripts/gp12_candidate_package_review_v1.py
            scripts/test_gp12_candidate_benchmark_integration_v1.py
            scripts/gp12_candidate_benchmark_v1.py
            scripts/test_gp12_candidate_benchmark_v1.py
            scripts/test_gp12_candidate_input_readiness_v1.py
            scripts/gp12_eastmoney_adapter_v1.py
            scripts/test_gp12_eastmoney_adapter_v1.py
            scripts/gp12_sohu_qfq_adapter_v1.py
            scripts/test_gp12_sohu_qfq_adapter_v1.py
            scripts/gp12_source_router_v1.py
            scripts/test_gp12_source_router_v1.py
            data/GP12_CANDIDATE_BENCHMARK_V1.json
            data/GP12_CANDIDATE_PARAMETERS_V1.json
            data/GP12_CANDIDATE_FACTORS_V1.json
            docs/gp12-candidate-review.md
          if-no-files-found: error
          retention-days: 30
