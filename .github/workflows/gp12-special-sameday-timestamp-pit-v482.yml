name: GP12 V482 special same-day PIT timestamp proof

on:
  push:
    branches: [gp/baostock-fullraw-crosscheck-v482]
    paths: ['.github/workflows/gp12-special-sameday-timestamp-pit-v482.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query CNINFO exact announcement metadata and freeze raw responses
        run: |
          mkdir -p out/sameday_timestamp/raw
          python - <<'PY'
          import datetime as dt, hashlib, json, re, time, urllib.parse, urllib.request
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ENDPOINT='https://www.cninfo.com.cn/new/hisAnnouncement/query'
          TOPSEARCH='https://www.cninfo.com.cn/new/information/topSearch/detailOfQuery'
          def post(url,payload,attempts=3):
              body=urllib.parse.urlencode(payload).encode('utf-8')
              headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept':'application/json, text/plain, */*','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Referer':'https://www.cninfo.com.cn/new/commonUrl?url=disclosure/list/notice','Origin':'https://www.cninfo.com.cn','X-Requested-With':'XMLHttpRequest','Connection':'close'}
              last=None
              for i in range(1,attempts+1):
                  try:
                      req=urllib.request.Request(url,data=body,headers=headers)
                      with urllib.request.urlopen(req,timeout=30) as r: raw=r.read(); status=getattr(r,'status',None)
                      return {'raw':raw,'json':json.loads(raw.decode('utf-8')),'http_status':status,'attempts':i}
                  except Exception as e:
                      last=e
                      if i<attempts: time.sleep(.75*i)
              raise last
          def column(code): return 'sse' if code[0] in {'5','6','9'} else 'szse'
          def resolve_orgid(code):
              x=post(TOPSEARCH,{'keyWord':code,'maxSecNum':'10','maxListNum':'5'})
              obj=x['json']; rows=obj if isinstance(obj,list) else (obj.get('keyBoardList') or obj.get('keyBoard') or obj.get('data') or [])
              hits=[r for r in rows if str(r.get('code') or '')==code and str(r.get('orgId') or '')]
              assert len(hits)==1,(code,len(hits)); return hits[0]['orgId']
          def query(code,orgid,start,end,searchkey):
              return post(ENDPOINT,{'pageNum':'1','pageSize':'30','column':column(code),'tabName':'fulltext','plate':'','stock':f'{code},{orgid}','searchkey':searchkey,'secid':'','category':'','trade':'','seDate':f'{start}~{end}','sortName':'','sortType':'','isHLtitle':'true'})

          targets=[
            {'symbol':'000697.SZ','ex_date':'2025-11-28','announcement_id':'1224831706','adjusted_reference_price':8.05,'start':'2025-11-26','end':'2025-11-28','queries':['重整计划资本公积金转增股本实施公告','资本公积金转增股本实施公告','']},
            {'symbol':'600306.SH','ex_date':'2023-12-26','announcement_id':'1218716690','adjusted_reference_price':8.14,'start':'2023-12-22','end':'2023-12-26','queries':['重整计划资本公积金转增股本实施公告','资本公积金转增股本实施公告','']},
          ]
          tz=ZoneInfo('Asia/Shanghai'); out=[]
          for t in targets:
              code=t['symbol'].split('.')[0]; orgid=resolve_orgid(code); all_items=[]; attempts=[]
              for qi,sk in enumerate(t['queries']):
                  q=query(code,orgid,t['start'],t['end'],sk); raw=q['raw']
                  fn=f'{code}_{t["announcement_id"]}_q{qi}.json'; Path('out/sameday_timestamp/raw',fn).write_bytes(raw)
                  items=(q['json'] or {}).get('announcements') or []
                  attempts.append({'searchkey':sk,'http_status':q['http_status'],'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'announcement_n':len(items),'raw_file':fn})
                  all_items.extend(items)
              uniq={str(x.get('announcementId') or x.get('adjunctUrl') or i):x for i,x in enumerate(all_items)}
              hits=[x for x in uniq.values() if str(x.get('announcementId') or '')==t['announcement_id']]
              item=hits[0] if len(hits)==1 else None; ms=(item or {}).get('announcementTime'); ts=None
              if ms is not None: ts=dt.datetime.fromtimestamp(float(ms)/1000,tz=dt.timezone.utc).astimezone(tz)
              ex_open=dt.datetime.combine(dt.date.fromisoformat(t['ex_date']),dt.time(9,30),tzinfo=tz)
              rec={**{k:v for k,v in t.items() if k!='queries'},'orgid':orgid,'queries':attempts,'unique_announcement_n':len(uniq),'exact_hit_n':len(hits),'announcement_time_ms':ms,'announcement_time_asia_shanghai':ts.isoformat() if ts else None,'ex_date_open_asia_shanghai':ex_open.isoformat(),'published_before_ex_open':bool(ts and ts<=ex_open),'announcement_title':str((item or {}).get('announcementTitle') or ''),'adjunct_url':(item or {}).get('adjunctUrl'),'status':'PASS' if len(hits)==1 and ts and ts<=ex_open else 'REVIEW'}
              out.append(rec)
          audit={'artifact':'GP12_SPECIAL_SAMEDAY_TIMESTAMP_PIT_V482','version':'V4.82','target_n':2,'pass_n':sum(r['status']=='PASS' for r in out),'review_n':sum(r['status']!='PASS' for r in out),'records':out,'promotion':{'adjustment_provenance_blocker_closed':False,'formal_feature_ready':False,'model_freeze_allowed':False,'oos_metrics_allowed':False}}
          Path('out/sameday_timestamp/GP12_SPECIAL_SAMEDAY_TIMESTAMP_PIT_V482.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Fail closed unless exact metadata proves pre-open publication
        run: |
          python - <<'PY'
          import json
          x=json.load(open('out/sameday_timestamp/GP12_SPECIAL_SAMEDAY_TIMESTAMP_PIT_V482.json'))
          assert x['target_n']==2
          p=x['promotion']; assert p['adjustment_provenance_blocker_closed'] is False and p['formal_feature_ready'] is False and p['model_freeze_allowed'] is False and p['oos_metrics_allowed'] is False
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gp12-special-sameday-timestamp-pit-v482
          path: out/sameday_timestamp/
          if-no-files-found: error
          retention-days: 30
