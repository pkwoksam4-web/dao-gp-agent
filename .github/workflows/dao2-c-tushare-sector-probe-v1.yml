name: DAO2 C Tushare Sector Probe V1
on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-tushare-sector-probe-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas tushare
      - name: Probe exact sector endpoints
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p artifact_probe
          python - <<'PY'
          import json, os, traceback
          from pathlib import Path
          out={"artifact":"DAO2_C_TUSHARE_SECTOR_PROBE_V1","token_present":bool(os.environ.get("TUSHARE_TOKEN")),"calls":{}}
          if not out["token_present"]:
              out["status"]="NO_TOKEN"
          else:
              import tushare as ts
              pro=ts.pro_api(os.environ["TUSHARE_TOKEN"])
              tests=[
                  ("index_classify_SW2021",lambda:pro.index_classify(level="L1",src="SW2021")),
                  ("index_classify_SW2014",lambda:pro.index_classify(level="L1",src="SW2014")),
                  ("index_member_all_801960_Y",lambda:pro.index_member_all(l1_code="801960.SI",is_new="Y")),
                  ("index_member_all_801960_N",lambda:pro.index_member_all(l1_code="801960.SI",is_new="N")),
                  ("sw_daily_trade_date",lambda:pro.sw_daily(trade_date="20260417")),
                  ("sw_daily_801960",lambda:pro.sw_daily(ts_code="801960.SI",start_date="20260417",end_date="20260417")),
              ]
              for name,fn in tests:
                  try:
                      x=fn()
                      out["calls"][name]={"ok":True,"rows":0 if x is None else int(len(x)),"columns":[] if x is None else list(x.columns)}
                      if x is not None and not x.empty:
                          out["calls"][name]["sample"]=x.head(2).astype(str).to_dict("records")
                  except Exception as exc:
                      out["calls"][name]={"ok":False,"error":repr(exc)}
              out["status"]="PROBED"
          Path("artifact_probe/tushare_sector_probe.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dao2-c-tushare-sector-probe-v1
          path: artifact_probe/
          if-no-files-found: warn
          retention-days: 30
