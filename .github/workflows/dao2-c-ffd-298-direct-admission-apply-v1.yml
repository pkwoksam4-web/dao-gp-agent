name: DAO2 C FFD 298 Direct Admission Apply V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-ffd-298-direct-admission-apply-v1.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gp/dao2-c-sector-pit
          fetch-depth: 1
      - name: Download immutable FFD 298 recovery artifact
        uses: actions/download-artifact@v4
        with:
          name: dao2-c-ffd-298-direct-close-recovery-v1
          path: /tmp/ffd298
          run-id: 37907353461
          github-token: ${{ github.token }}
      - name: Verify artifact and generate direct patch/checkpoint
        shell: bash
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          SRC=Path('/tmp/ffd298')
          BASE=Path('data/dao2/modules')
          result=json.loads((SRC/'result.json').read_text(encoding='utf-8'))
          self_hash=result['content_sha256_without_hash_field']
          tmp=dict(result); tmp.pop('content_sha256_without_hash_field')
          canonical=json.dumps(tmp,ensure_ascii=False,sort_keys=True,separators=(',',':'))
          assert hashlib.sha256(canonical.encode('utf-8')).hexdigest()==self_hash
          assert self_hash=='617283bd986e1ba0d0ddb27c457a1088c39d246374cc022de9731563da14bc61'
          rec=result['recovery']
          assert result['status']=='PASS_298_DIRECT_CLOSE_RECOVERY_NOT_YET_ADMITTED'
          assert rec['expected_rows']==298 and rec['found_rows']==298
          assert rec['missing_rows']==0 and rec['extra_rows']==0
          assert rec['derived_evidence_exact_2dp_rows']==298 and rec['derived_evidence_mismatch_rows']==0
          assert rec['all_http_200'] is True and rec['all_no_recalculation'] is True and rec['all_unadjusted'] is True

          hashes={}
          request_manifest=[]
          for req in result['requests']:
              raw=(SRC/req['raw_file']).read_bytes()
              got=hashlib.sha256(raw).hexdigest()
              assert got==req['raw_sha256'],(req['raw_file'],got,req['raw_sha256'])
              assert req['http_status']==200
              assert req['coverage_status']=='complete'
              assert req['missing_cell_count']==0
              assert req['adjustment_effective']=='none'
              assert req['conversion_or_recalculation_by_ffd'] is False
              hashes[req['trade_date']]=got
              request_manifest.append({
                  'trade_date':req['trade_date'],
                  'requested_code_count':req['requested_code_count'],
                  'extracted_count':req['extracted_count'],
                  'raw_file':req['raw_file'],
                  'raw_sha256':got,
                  'http_status':req['http_status'],
                  'coverage_status':req['coverage_status'],
                  'missing_cell_count':req['missing_cell_count'],
                  'adjustment_effective':req['adjustment_effective'],
                  'conversion_or_recalculation_by_ffd':req['conversion_or_recalculation_by_ffd'],
              })

          ledger=json.loads((BASE/'C_301_GAP_LEDGER_V1.json').read_text(encoding='utf-8'))
          schema=ledger['row_schema']
          lrows=[dict(zip(schema,r)) for r in ledger['rows']]
          expected={(str(r['sector_code']),str(r['trade_date'])):r for r in lrows if r.get('gap_class')=='DERIVED_CLOSE_EVIDENCE_ONLY' and r.get('current_provenance_type')=='DERIVED_CLOSE'}
          assert len(expected)==298
          comparisons=rec['comparisons']
          assert len(comparisons)==298
          keys={(str(x['sector_code']),str(x['trade_date'])) for x in comparisons}
          assert keys==set(expected)

          patch=BASE/'C_SECTOR_FFD_298_DIRECT_PATCH_V1.csv'
          fields=['industry_code','trade_date','close','source_provider','source_trade_date','fill_method','provenance_type','source_raw_sha256','source_artifact_id','vendor_contract_version','vendor_contract_raw_sha256']
          with patch.open('w',encoding='utf-8',newline='') as fh:
              w=csv.DictWriter(fh,fieldnames=fields); w.writeheader()
              for x in sorted(comparisons,key=lambda z:(z['sector_code'],z['trade_date'])):
                  key=(str(x['sector_code']),str(x['trade_date']))
                  assert round(float(x['ffd_close']),2)==round(float(expected[key]['candidate_close_2dp']),2)
                  w.writerow({
                      'industry_code':key[0], 'trade_date':key[1], 'close':x['ffd_close'],
                      'source_provider':'FFD / FinDesk', 'source_trade_date':key[1],
                      'fill_method':'NONE', 'provenance_type':'RAW_CLOSE',
                      'source_raw_sha256':hashes[key[1]], 'source_artifact_id':'11605290540',
                      'vendor_contract_version':'0.8.15-consensus-estimates-20261008-r2',
                      'vendor_contract_raw_sha256':'274630e658eab0025e437543fddbe2a1db09d03da07bb830288816472a9dc05a',
                  })
          patch_sha=hashlib.sha256(patch.read_bytes()).hexdigest()

          cp={
              'artifact':'DAO2_C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1',
              'version':'1.0','module_id':'C','component':'sector_series',
              'status':'PASS_BINDING_DIRECT_298_NOT_DERIVED',
              'binding':{
                  'vendor_identity':'FFD / FinDesk',
                  'vendor_contract_version':'0.8.15-consensus-estimates-20261008-r2',
                  'vendor_contract_raw_sha256':'274630e658eab0025e437543fddbe2a1db09d03da07bb830288816472a9dc05a',
                  'binding_checkpoint_801020':'data/dao2/modules/C_SECTOR_FFD_801020_BINDING_CHECKPOINT_V1.json',
                  'public_contract_evidence':'data/dao2/modules/C_SECTOR_FFD_PUBLIC_HISTORY_CONTRACT_EVIDENCE_V1.json',
                  'same_interface_semantics_as_bound_801020':True,
                  'upstream_brand_equivalence_claimed':False,
              },
              'source':{
                  'workflow_run_id':37907353461,'workflow_job_id':113743921185,
                  'artifact_id':11605290540,
                  'artifact_digest':'sha256:7a54393f8495fda174c7ff1a376f4c4f0d8173fd6feb088af785b898da21f569',
                  'result_content_sha256':self_hash,
                  'raw_response_manifest':request_manifest,
              },
              'validation':{
                  'expected_rows':298,'found_rows':298,'missing_rows':0,'extra_rows':0,
                  'unique_key_rows':298,
                  'crosscheck_only_reference':'Wind DERIVED_CLOSE evidence; not used as source provenance',
                  'crosscheck_exact_2dp_rows':298,'crosscheck_mismatch_rows':0,
                  'all_http_200':True,'all_unadjusted':True,'all_no_recalculation':True,
                  'same_day_direct_source':True,'fill_method':'NONE','provenance_type':'RAW_CLOSE',
              },
              'admission':{
                  'patch':'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_PATCH_V1.csv',
                  'patch_sha256':patch_sha,'admitted_direct_rows':298,'admitted_derived_rows':0,
                  'admissible_before':42786,'admissible_after':43084,'required':43084,
                  'missing_before':298,'missing_after':0,
                  'series_pass_requires_full_panel_verifier':True,
                  'breadth_reopened':False,
              },
              'governance':{
                  'contract_lowered':False,'verifier_modified_for_ffd':False,
                  'derived_close_migrated':False,'neighbor_or_derived_match_used_as_provenance_substitute':False,
                  'frozen_42783_rewritten':False,'breadth_reopened':False,
              }
          }
          (BASE/'C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json').write_text(json.dumps(cp,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          ruling={
              'artifact':'DAO2_C_SECTOR_FFD_VENDOR_BINDING_RULING_V1','version':'1.0','module_id':'C',
              'status':'PASS_SEMANTIC_PRECEDENCE_RULING',
              'ruling':{
                  'upstream_authority_binding':'NOT_PROVEN_AND_NOT_CLAIMED',
                  'ffd_vendor_identity_binding':'PASS',
                  'normative_gate':'source_repo_or_vendor_identity_required',
                  'interpretation':'The earlier upstream-provenance audit answers the narrower question whether FFD can be identified as a Wind/iFind/RQData/DataCube/Tushare export; it cannot. The later binding audit answers the actual frozen gate: whether the direct carrier has a stable, immutable vendor identity. FFD itself is the bound vendor through its versioned public-stable history contract. No upstream-brand equivalence is required or claimed.',
                  'provider_whitelist_added':False,
                  'contract_lowered':False,
              },
              'evidence':{
                  'upstream_audit':'data/dao2/modules/C_SECTOR_FFD_801020_UPSTREAM_PROVENANCE_AUDIT_V1.json',
                  'final_binding_audit':'data/dao2/modules/C_SECTOR_FFD_801020_BINDING_AUDIT_V1.json',
                  'public_contract':'data/dao2/modules/C_SECTOR_FFD_PUBLIC_HISTORY_CONTRACT_EVIDENCE_V1.json',
                  'direct_298_checkpoint':'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json',
              },
              'admission_effect':'FFD direct RAW_CLOSE rows may be evaluated under existing row provenance gates; DERIVED_CLOSE remains non-admissible.'
          }
          (BASE/'C_SECTOR_FFD_VENDOR_BINDING_RULING_V1.json').write_text(json.dumps(ruling,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'patch_rows':298,'patch_sha256':patch_sha,'checkpoint':cp['status']},ensure_ascii=False))
          PY
      - name: Verify GREEN contract tests before commit
        run: python -m unittest -v scripts/test_dao2_c_ffd_298_direct_admission_v1.py
      - name: Commit immutable direct admission evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dao2/modules/C_SECTOR_FFD_298_DIRECT_PATCH_V1.csv \
                  data/dao2/modules/C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json \
                  data/dao2/modules/C_SECTOR_FFD_VENDOR_BINDING_RULING_V1.json
          git commit -m 'evidence(dao2-c): bind 298 FFD direct raw closes'
          git push origin HEAD:gp/dao2-c-sector-pit
