name: Live PIT Manifest Ingest

on:
  push:
    paths:
      - "runtime/pit_manifests/*.json"

permissions:
  contents: read

jobs:
  ingest:
    # Hard-disabled until PR #27 is merged to main and all four issue #26 gates pass.
    # Re-enable only after the full authoritative preflight is bound and passes.
    if: ${{ false }}
    environment: pit-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce owner authorization kill switch
        shell: bash
        env:
          PIT_WRITE_AUTHORIZATION: ${{ vars.PIT_WRITE_AUTHORIZATION }}
        run: |
          test "$PIT_WRITE_AUTHORIZATION" = "APPROVED" || {
            echo "::error::PIT production writes are not authorized"
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Resolve immutable PIT manifest
        id: manifest
        shell: bash
        run: |
          FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^runtime/pit_manifests/.*\.json$' | head -n 1)"
          test -n "$FILE" || { echo "::error::No PIT manifest in triggering commit"; exit 1; }
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
      - name: Ingest live PIT manifest
        env:
          PIT_MANIFEST_PATH: ${{ steps.manifest.outputs.path }}
          NEON_DATABASE_URL: ${{ secrets.PIT_WRITER_DATABASE_URL }}
        run: python scripts/live_pit_ingest_compat_runner.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pit-ingest-${{ github.run_id }}
          path: artifacts/live-pit-ingest-report.json
          if-no-files-found: warn
          retention-days: 30
