name: GP V4.82 Strategy Recovery Dependency

on:
  push:
    branches:
      - gp/strategy-recovery-dependency-v482
    paths:
      - 'scripts/strategy_recovery_dependency_v482.py'
      - 'scripts/test_strategy_recovery_dependency_v482.py'
      - '.github/workflows/strategy-recovery-dependency-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strategy recovery dependency contract tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_strategy_recovery_dependency_v482.py
