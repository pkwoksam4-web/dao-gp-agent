name: GP12 Main Net Flow Public Archive Formal844 Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-public-archive-formal844-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install -q pandas pyarrow requests
      - name: Download pinned Formal RAW evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-full-raw-v482-reaudit
          path: upstream/raw
          run-id: 34192233633
          github-token: ${{ github.token }}
      - name: Audit exact symbol-date rows against public archive
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p out/shard-${{ matrix.shard }}
          python - <<'PY'
          import csv, hashlib, io, json, math, time
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from decimal import Decimal, InvalidOperation
          from pathlib import Path
          import requests
          from gp12_main_net_flow_tushare_v1 import (
              EXPECTED_TRADE_ROWS,
              FORMAL_END,
              FORMAL_START,
              FORMAL_SYMBOL_N,
              load_expected_dates,
              load_scope,
          )

          SHARD_INDEX = ${{ matrix.shard }}
          SHARD_COUNT = 8
          SOURCE_REPO = 'Jessica-Zhangyj/dlquant'
          SOURCE_COMMIT = '6b245fa09cb628f3bcb812f0662bfef520e65fb4'
          RAW_SHA256 = 'bc72238d046378cf3b6fa61723e86fb43f1c491ac3da86d76932e3185f60e1eb'
          SCOPE_SHA256 = '9e64e111c5eeff1f43fcce6e920d7e5590aa5bb14268c482bbdfe1a936affef8'
          REQUIRED_COLUMNS = [
              'ts_code','trade_date',
              'buy_sm_vol','buy_sm_amount','sell_sm_vol','sell_sm_amount',
              'buy_md_vol','buy_md_amount','sell_md_vol','sell_md_amount',
              'buy_lg_vol','buy_lg_amount','sell_lg_vol','sell_lg_amount',
              'buy_elg_vol','buy_elg_amount','sell_elg_vol','sell_elg_amount',
              'net_mf_vol','net_mf_amount',
          ]
          AMOUNT_FIELDS = ('buy_lg_amount','sell_lg_amount','buy_elg_amount','sell_elg_amount')

          def sha256(path):
              h = hashlib.sha256()
              with Path(path).open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          raw_path = Path('upstream/raw/SOHU_RAW_FULL_V482.parquet')
          scope_path = Path('data/pit_st_scope_v480.txt')
          assert sha256(raw_path) == RAW_SHA256
          assert sha256(scope_path) == SCOPE_SHA256
          symbols = load_scope(scope_path)
          assert len(symbols) == FORMAL_SYMBOL_N
          symbol_set = set(symbols)
          expected_by_symbol = load_expected_dates(raw_path, symbols)
          assert sum(len(v) for v in expected_by_symbol.values()) == EXPECTED_TRADE_ROWS
          expected_by_date = defaultdict(set)
          for symbol, dates in expected_by_symbol.items():
              for day in dates:
                  expected_by_date[day].add(symbol)
          all_dates = sorted(expected_by_date)
          assert all_dates[0] == FORMAL_START and all_dates[-1] == FORMAL_END
          shard_dates = [d for i, d in enumerate(all_dates) if i % SHARD_COUNT == SHARD_INDEX]

          def parse_decimal(raw, label):
              try:
                  value = Decimal(str(raw).strip())
              except (InvalidOperation, ValueError) as exc:
                  raise ValueError(f'{label}: non-numeric {raw!r}') from exc
              if not value.is_finite() or value < 0:
                  raise ValueError(f'{label}: invalid nonnegative finite amount {raw!r}')
              return value

          def download(day):
              compact = day.replace('-','')
              url = f'https://raw.githubusercontent.com/{SOURCE_REPO}/{SOURCE_COMMIT}/data/moneyflow/{compact}.csv'
              last_error = None
              for attempt in range(4):
                  try:
                      r = requests.get(url, timeout=45)
                      if r.status_code == 200:
                          return day, r.content
                      last_error = RuntimeError(f'HTTP_{r.status_code}')
                  except Exception as exc:
                      last_error = exc
                  time.sleep(0.5 * (2 ** attempt))
              raise RuntimeError(f'{day}: download failed after retries: {last_error}')

          def audit_one(day, content):
              expected = expected_by_date[day]
              text = content.decode('utf-8-sig')
              reader = csv.DictReader(io.StringIO(text))
              if reader.fieldnames != REQUIRED_COLUMNS:
                  return {
                      'date': day,
                      'expected_n': len(expected),
                      'observed_formal_n': 0,
                      'matched_n': 0,
                      'missing_n': len(expected),
                      'extra_n': 0,
                      'duplicate_n': 0,
                      'invalid_n': 0,
                      'schema_exact': False,
                      'blockers': ['PUBLIC_ARCHIVE_SCHEMA_MISMATCH'],
                  }, []
              observed = {}
              duplicate_symbols = set()
              invalid_symbols = set()
              wrong_date_symbols = set()
              for row_index, row in enumerate(reader, start=2):
                  symbol = str(row.get('ts_code','')).strip().upper()
                  if symbol not in symbol_set:
                      continue
                  raw_date = str(row.get('trade_date','')).strip()
                  row_day = f'{raw_date[:4]}-{raw_date[4:6]}-{raw_date[6:8]}' if len(raw_date) >= 8 else raw_date
                  if row_day != day:
                      wrong_date_symbols.add(symbol)
                  if symbol in observed:
                      duplicate_symbols.add(symbol)
                      continue
                  try:
                      values = {field: parse_decimal(row.get(field,''), f'{day}:{symbol}:{field}') for field in AMOUNT_FIELDS}
                      candidate_cny = (
                          values['buy_lg_amount'] + values['buy_elg_amount']
                          - values['sell_lg_amount'] - values['sell_elg_amount']
                      ) * Decimal('10000')
                  except Exception:
                      invalid_symbols.add(symbol)
                      continue
                  observed[symbol] = candidate_cny
              observed_set = set(observed)
              missing = sorted(expected - observed_set)
              extra = sorted(observed_set - expected)
              matched = sorted(expected & observed_set)
              blockers = []
              if missing:
                  blockers.append('PUBLIC_ARCHIVE_SYMBOL_DATE_MISSING')
              if extra:
                  blockers.append('PUBLIC_ARCHIVE_SYMBOL_DATE_EXTRA')
              if duplicate_symbols:
                  blockers.append('PUBLIC_ARCHIVE_DUPLICATE_SYMBOL_DATE')
              if invalid_symbols:
                  blockers.append('PUBLIC_ARCHIVE_INVALID_MONEYFLOW_AMOUNT')
              if wrong_date_symbols:
                  blockers.append('PUBLIC_ARCHIVE_ROW_DATE_MISMATCH')
              canonical = [(symbol, day, format(observed[symbol], 'f')) for symbol in matched]
              report = {
                  'date': day,
                  'expected_n': len(expected),
                  'observed_formal_n': len(observed_set),
                  'matched_n': len(matched),
                  'missing_n': len(missing),
                  'extra_n': len(extra),
                  'duplicate_n': len(duplicate_symbols),
                  'invalid_n': len(invalid_symbols),
                  'wrong_date_n': len(wrong_date_symbols),
                  'missing_sample': missing[:10],
                  'extra_sample': extra[:10],
                  'duplicate_sample': sorted(duplicate_symbols)[:10],
                  'invalid_sample': sorted(invalid_symbols)[:10],
                  'wrong_date_sample': sorted(wrong_date_symbols)[:10],
                  'schema_exact': True,
                  'blockers': blockers,
              }
              return report, canonical

          date_reports = []
          canonical_rows = []
          download_failures = []
          with ThreadPoolExecutor(max_workers=4) as pool:
              futures = {pool.submit(download, day): day for day in shard_dates}
              for future in as_completed(futures):
                  day = futures[future]
                  try:
                      _, content = future.result()
                      report, rows = audit_one(day, content)
                      date_reports.append(report)
                      canonical_rows.extend(rows)
                  except Exception as exc:
                      expected_n = len(expected_by_date[day])
                      download_failures.append({'date': day, 'error': f'{type(exc).__name__}: {exc}'})
                      date_reports.append({
                          'date': day,
                          'expected_n': expected_n,
                          'observed_formal_n': 0,
                          'matched_n': 0,
                          'missing_n': expected_n,
                          'extra_n': 0,
                          'duplicate_n': 0,
                          'invalid_n': 0,
                          'wrong_date_n': 0,
                          'schema_exact': False,
                          'blockers': ['PUBLIC_ARCHIVE_DOWNLOAD_FAILED'],
                      })
          date_reports.sort(key=lambda x: x['date'])
          canonical_rows.sort(key=lambda x: (x[1], x[0]))
          h = hashlib.sha256()
          for symbol, day, value in canonical_rows:
              h.update(f'{symbol},{day},{value}\n'.encode('utf-8'))

          blockers = sorted({b for report in date_reports for b in report.get('blockers',[])})
          expected_rows = sum(int(r['expected_n']) for r in date_reports)
          matched_rows = sum(int(r['matched_n']) for r in date_reports)
          missing_rows = sum(int(r['missing_n']) for r in date_reports)
          extra_rows = sum(int(r['extra_n']) for r in date_reports)
          duplicate_rows = sum(int(r['duplicate_n']) for r in date_reports)
          invalid_rows = sum(int(r['invalid_n']) for r in date_reports)
          wrong_date_rows = sum(int(r.get('wrong_date_n',0)) for r in date_reports)
          report = {
              'artifact': 'GP12_MAIN_NET_FLOW_PUBLIC_ARCHIVE_FORMAL844_SHARD_V1',
              'version': '1.0',
              'shard_index': SHARD_INDEX,
              'shard_count': SHARD_COUNT,
              'formal_window': [FORMAL_START, FORMAL_END],
              'source_repo': SOURCE_REPO,
              'source_commit': SOURCE_COMMIT,
              'date_n': len(shard_dates),
              'first_date': shard_dates[0] if shard_dates else None,
              'last_date': shard_dates[-1] if shard_dates else None,
              'expected_rows': expected_rows,
              'matched_rows': matched_rows,
              'missing_rows': missing_rows,
              'extra_rows': extra_rows,
              'duplicate_rows': duplicate_rows,
              'invalid_rows': invalid_rows,
              'wrong_date_rows': wrong_date_rows,
              'download_failure_n': len(download_failures),
              'download_failure_sample': download_failures[:20],
              'candidate_rows_hashed': len(canonical_rows),
              'candidate_shard_sha256': h.hexdigest(),
              'failed_date_n': sum(bool(r.get('blockers')) for r in date_reports),
              'failed_date_sample': [r for r in date_reports if r.get('blockers')][:20],
              'blockers': blockers,
              'shard_pass': not blockers and matched_rows == expected_rows,
              'binding_allowed': False,
              'model_freeze_allowed': False,
              'oos_metrics_allowed': False,
          }
          out = Path(f'out/shard-{SHARD_INDEX}/GP12_MAIN_NET_FLOW_PUBLIC_ARCHIVE_FORMAL844_SHARD_{SHARD_INDEX}.json')
          out.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if report['shard_pass'] is not True:
              raise RuntimeError('FORMAL844_SHARD_BLOCKED: ' + ','.join(blockers))
          print(f'PASS_PUBLIC_ARCHIVE_FORMAL844_SHARD_{SHARD_INDEX}')
          PY
      - name: Upload shard audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-main-net-flow-public-archive-formal844-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: audit-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install calibration runtime
        run: pip install -q pandas pyarrow requests
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: gp12-main-net-flow-public-archive-formal844-shard-*
          path: out/shards
          merge-multiple: true
      - name: Aggregate Formal844 audit and calibrate semantics
        run: |
          mkdir -p out/full
          python - <<'PY'
          import hashlib, io, json
          from decimal import Decimal
          from pathlib import Path
          import pandas as pd
          import requests

          SOURCE_REPO = 'Jessica-Zhangyj/dlquant'
          SOURCE_COMMIT = '6b245fa09cb628f3bcb812f0662bfef520e65fb4'
          reports = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(Path('out/shards').glob('GP12_MAIN_NET_FLOW_PUBLIC_ARCHIVE_FORMAL844_SHARD_*.json'))]
          blockers = []
          if len(reports) != 8:
              blockers.append('PUBLIC_ARCHIVE_SHARD_REPORT_COVERAGE_INCOMPLETE')
          if any(r.get('shard_pass') is not True for r in reports):
              blockers.append('PUBLIC_ARCHIVE_SHARD_AUDIT_FAILURE')
          for name in ('missing_rows','extra_rows','duplicate_rows','invalid_rows','wrong_date_rows','download_failure_n'):
              if sum(int(r.get(name,0)) for r in reports) != 0:
                  blockers.append('PUBLIC_ARCHIVE_' + name.upper())
          expected_rows = sum(int(r.get('expected_rows',0)) for r in reports)
          matched_rows = sum(int(r.get('matched_rows',0)) for r in reports)
          if expected_rows != 1_011_607 or matched_rows != 1_011_607:
              blockers.append('PUBLIC_ARCHIVE_FORMAL_ROW_COVERAGE_MISMATCH')
          date_n = sum(int(r.get('date_n',0)) for r in reports)
          if date_n != 1426:
              blockers.append('PUBLIC_ARCHIVE_FORMAL_DATE_COVERAGE_MISMATCH')

          combined = hashlib.sha256()
          for r in sorted(reports, key=lambda x: int(x['shard_index'])):
              combined.update(f"{r['shard_index']}:{r['candidate_shard_sha256']}\n".encode('utf-8'))

          # Independent public Tushare-derived snapshot calibration on 2026-05-21.
          day = '20260521'
          public_url = f'https://raw.githubusercontent.com/{SOURCE_REPO}/{SOURCE_COMMIT}/data/moneyflow/{day}.csv'
          pr = requests.get(public_url, timeout=60)
          pr.raise_for_status()
          source = pd.read_csv(io.BytesIO(pr.content), dtype={'ts_code':str,'trade_date':str})
          src = source[(source['ts_code'] == '000001.SZ') & (source['trade_date'].astype(str) == day)]
          if len(src) != 1:
              blockers.append('PUBLIC_ARCHIVE_CALIBRATION_SOURCE_ROW_MISMATCH')
              calibration = {'source_row_n': len(src)}
          else:
              sr = requests.get('https://raw.githubusercontent.com/henrylin99/screener-offline-data/main/data.parquet', timeout=60)
              sr.raise_for_status()
              snap = pd.read_parquet(io.BytesIO(sr.content), columns=['ts_code','trade_date','buy_lg_amount','sell_lg_amount','buy_elg_amount','sell_elg_amount'])
              ref = snap[(snap['ts_code'].astype(str) == '000001.SZ') & (snap['trade_date'].astype(str) == day)]
              if len(ref) != 1:
                  blockers.append('PUBLIC_ARCHIVE_CALIBRATION_REFERENCE_ROW_MISMATCH')
                  calibration = {'source_row_n': 1, 'reference_row_n': len(ref)}
              else:
                  fields = ['buy_lg_amount','sell_lg_amount','buy_elg_amount','sell_elg_amount']
                  src_values = {f: Decimal(str(src.iloc[0][f])) for f in fields}
                  ref_values = {f: Decimal(str(ref.iloc[0][f])) for f in fields}
                  field_diffs = {f: format(src_values[f] - ref_values[f], 'f') for f in fields}
                  source_candidate = (src_values['buy_lg_amount'] + src_values['buy_elg_amount'] - src_values['sell_lg_amount'] - src_values['sell_elg_amount']) * Decimal('10000')
                  ref_candidate = (ref_values['buy_lg_amount'] + ref_values['buy_elg_amount'] - ref_values['sell_lg_amount'] - ref_values['sell_elg_amount']) * Decimal('10000')
                  exact = all(src_values[f] == ref_values[f] for f in fields) and source_candidate == ref_candidate
                  calibration = {
                      'date': '2026-05-21',
                      'symbol': '000001.SZ',
                      'source_fields': {f: format(src_values[f], 'f') for f in fields},
                      'reference_fields': {f: format(ref_values[f], 'f') for f in fields},
                      'field_diffs': field_diffs,
                      'source_main_net_flow_cny': format(source_candidate, 'f'),
                      'reference_main_net_flow_cny': format(ref_candidate, 'f'),
                      'exact': exact,
                  }
                  if not exact:
                      blockers.append('PUBLIC_ARCHIVE_TUSHARE_SEMANTIC_CALIBRATION_MISMATCH')

          blockers = sorted(set(blockers))
          audit = {
              'artifact': 'GP12_MAIN_NET_FLOW_PUBLIC_ARCHIVE_FORMAL844_PROBE_V1',
              'version': '1.0',
              'formal_window': ['2020-06-01','2026-04-17'],
              'formal_symbol_n': 844,
              'formal_unique_trade_date_n': date_n,
              'expected_trade_rows': expected_rows,
              'matched_trade_rows': matched_rows,
              'missing_rows': sum(int(r.get('missing_rows',0)) for r in reports),
              'extra_rows': sum(int(r.get('extra_rows',0)) for r in reports),
              'duplicate_rows': sum(int(r.get('duplicate_rows',0)) for r in reports),
              'invalid_rows': sum(int(r.get('invalid_rows',0)) for r in reports),
              'wrong_date_rows': sum(int(r.get('wrong_date_rows',0)) for r in reports),
              'download_failure_n': sum(int(r.get('download_failure_n',0)) for r in reports),
              'source_repo': SOURCE_REPO,
              'source_commit': SOURCE_COMMIT,
              'source_schema': 'TUSHARE_MONEYFLOW_20_COLUMNS',
              'semantic_definition': 'large_plus_extra_large_active_buy_minus_sell',
              'source_amount_unit': 'wan_cny',
              'candidate_unit': 'cny',
              'candidate_combined_shard_digest': combined.hexdigest(),
              'semantic_calibration': calibration,
              'date_coverage_probe_run_id': 35176014214,
              'date_coverage_probe_artifact_id': 10479200081,
              'date_coverage_probe_zip_sha256': '6290f6c9d47c50bd4e4b52ef02ad6c67f2fa08475064f219d978f9f05625b1c3',
              'raw_source_run_id': 34192233633,
              'raw_panel_sha256': 'bc72238d046378cf3b6fa61723e86fb43f1c491ac3da86d76932e3185f60e1eb',
              'scope_sha256': '9e64e111c5eeff1f43fcce6e920d7e5590aa5bb14268c482bbdfe1a936affef8',
              'pit_scope': 'AFTER_CLOSE_NO_LOOKAHEAD_POLICY',
              'same_session_main_net_flow_usable_before_close': False,
              'historical_provider_publication_timestamp_proven': False,
              'candidate_source_row_audit_pass': not blockers,
              'blockers': blockers,
              'binding_allowed': False,
              'model_freeze_allowed': False,
              'oos_metrics_allowed': False,
          }
          Path('out/full/GP12_MAIN_NET_FLOW_PUBLIC_ARCHIVE_FORMAL844_PROBE_V1.json').write_text(
              json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(audit, ensure_ascii=False, indent=2))
          if blockers:
              raise RuntimeError('FORMAL844_PUBLIC_ARCHIVE_PROBE_BLOCKED: ' + ','.join(blockers))
          print('PASS_PUBLIC_ARCHIVE_FORMAL844_EXACT_ROW_AUDIT')
          PY
      - name: Upload aggregate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-main-net-flow-public-archive-formal844-probe-v1
          path: out/full/
          if-no-files-found: error
          retention-days: 30
