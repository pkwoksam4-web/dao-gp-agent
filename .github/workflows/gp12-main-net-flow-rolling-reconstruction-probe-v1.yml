name: GP12 Main Net Flow Rolling Reconstruction Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-rolling-reconstruction-probe-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install -q requests
      - name: Discover current archive test contract
        run: |
          python - <<'PY'
          import html, re
          import requests
          from urllib.parse import urljoin

          doc_url = 'https://www.mushuju.com/trend.html'
          r = requests.get(doc_url, timeout=30)
          print('DOC_HTTP', r.status_code, r.url, 'LEN', len(r.text))
          r.raise_for_status()
          text = html.unescape(r.text)
          hrefs = re.findall(r'href=["\']([^"\']+)["\']', text, flags=re.I)
          api_links = []
          for href in hrefs:
              absolute = urljoin(doc_url, href)
              if 'chagubang.com' in absolute or 'jdzldx' in absolute or 'get' in absolute.lower() and 'zijin' in absolute.lower():
                  api_links.append(absolute)
          print('API_LINKS')
          for link in api_links:
              print(link)
          for pattern in (r'https?://[^\s"\'<>]+', r'from=[^\s&"\'<>]+'):
              print('PATTERN', pattern)
              for value in re.findall(pattern, text, flags=re.I):
                  if 'chagubang' in value or 'jdzldx' in value or value.startswith('from='):
                      print(value[:1000])
          if not api_links:
              raise RuntimeError('no current test-link contract found in documentation HTML')
          PY
