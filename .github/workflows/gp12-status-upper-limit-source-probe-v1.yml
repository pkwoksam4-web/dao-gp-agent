name: GP12 Status Upper Limit Source Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-status-upper-limit-source-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Eastmoney historical limit-up pool
        run: |
          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          from pathlib import Path

          dates = ['20200601','20200824','20210104','20220104','20230103','20240102','20250102','20260417']
          base = 'https://push2ex.eastmoney.com/getTopicZTPool'
          out = []
          headers = {'User-Agent':'Mozilla/5.0','Referer':'https://quote.eastmoney.com/'}
          for date in dates:
              params = {
                  'ut':'7eea3edcaed734bea9cbfc24409ed989',
                  'dpt':'wz.ztzt',
                  'Pageindex':'0',
                  'pagesize':'10000',
                  'sort':'fbt:asc',
                  'date':date,
                  '_':str(int(time.time()*1000)),
              }
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers=headers)
              rec = {'date':date,'url_base':base}
              try:
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      raw = resp.read()
                      rec['http_status'] = resp.status
                  data = json.loads(raw.decode('utf-8'))
                  rec['rc'] = data.get('rc')
                  payload = data.get('data')
                  rec['data_is_none'] = payload is None
                  if isinstance(payload, dict):
                      pool = payload.get('pool') or []
                      rec['pool_n'] = len(pool)
                      rec['total'] = payload.get('tc')
                      rec['sample_codes'] = [str(x.get('c')) for x in pool[:10]]
                      rec['sample_names'] = [str(x.get('n')) for x in pool[:10]]
                  else:
                      rec['pool_n'] = 0
                  print(json.dumps(rec, ensure_ascii=False))
              except Exception as exc:
                  rec['error'] = type(exc).__name__ + ': ' + str(exc)
                  print(json.dumps(rec, ensure_ascii=False))
              out.append(rec)
              time.sleep(1.0)

          result = {
              'artifact':'GP12_STATUS_UPPER_LIMIT_SOURCE_PROBE_V1',
              'provider':'Eastmoney',
              'endpoint':base,
              'semantic_candidate':'post-close historical limit-up pool membership',
              'formal_window':['2020-06-01','2026-04-17'],
              'probes':out,
              'historical_gp_v11_source_recovered':False,
              'formal_binding_allowed':False,
              'model_freeze_allowed':False,
              'oos_metrics_allowed':False,
          }
          Path('artifact_gp12_status_upper_limit_source_probe_v1').mkdir(exist_ok=True)
          Path('artifact_gp12_status_upper_limit_source_probe_v1/GP12_STATUS_UPPER_LIMIT_SOURCE_PROBE_V1.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          # Capability probe is useful even if some dates fail; never claim formal binding here.
          PY
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-status-upper-limit-source-probe-v1
          path: artifact_gp12_status_upper_limit_source_probe_v1/
          if-no-files-found: error
          retention-days: 30
