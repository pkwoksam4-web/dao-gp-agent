name: GP12 Turnover PIT Admission V482

on:
  push:
    branches: [gp/baostock-fullraw-crosscheck-v482]
    paths:
      - 'scripts/test_gp12_turnover_pit_admission_v482.py'
      - 'scripts/gp12_turnover_pit_admission_v482.py'
      - '.github/workflows/gp12-turnover-pit-admission-v482.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  turnover-pit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run turnover PIT admission unit tests
        run: |
          cd scripts
          python -m unittest -v test_gp12_turnover_pit_admission_v482.py
