name: GP V4.82 Intraday Minute Materialization Spike

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - '.github/workflows/intraday-minute-materialization-spike-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-fixed-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parquet reader
        run: python -m pip install --disable-pip-version-check --quiet pyarrow pandas
      - name: Download exact fixed-snapshot minute parquet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/intraday-spike
          URL='https://huggingface.co/datasets/neigezhu/china-a-share-1min-ohlcv/resolve/f311a5f11569e9d541386982d15f2214d9970b8a/data/stock_1m/SZ/002002.parquet?download=true'
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 900 \
            --dump-header out/intraday-spike/http_headers.txt \
            --output out/intraday-spike/002002.parquet "$URL"
          test -s out/intraday-spike/002002.parquet
          sha256sum out/intraday-spike/002002.parquet | tee out/intraday-spike/sha256.txt
          wc -c out/intraday-spike/002002.parquet | tee out/intraday-spike/bytes.txt
      - name: Inspect parquet and session boundaries without resampling assumptions
        run: |
          python - <<'PY'
          import hashlib, json
          from collections import Counter
          from datetime import time
          from pathlib import Path
          import pyarrow.parquet as pq
          import pandas as pd

          p = Path('out/intraday-spike/002002.parquet')
          pf = pq.ParquetFile(p)
          table = pq.read_table(p, columns=['symbol','timestamp','open','high','low','close','volume','turnover'])
          df = table.to_pandas().sort_values('timestamp').reset_index(drop=True)
          ts = pd.to_datetime(df['timestamp'])
          df['trade_date'] = ts.dt.date
          df['trade_time'] = ts.dt.time

          morning = df[(df['trade_time'] >= time(9,30)) & (df['trade_time'] <= time(11,30))]
          afternoon = df[(df['trade_time'] >= time(13,0)) & (df['trade_time'] <= time(15,0))]
          outside = df[~df.index.isin(morning.index) & ~df.index.isin(afternoon.index)]

          day_counts = df.groupby('trade_date').size()
          morning_counts = morning.groupby('trade_date').size()
          afternoon_counts = afternoon.groupby('trade_date').size()

          boundary_times = {'09:30:00','11:30:00','13:00:00','15:00:00'}
          first_date = df['trade_date'].iloc[0]
          last_date = df['trade_date'].iloc[-1]
          boundary = df[(df['trade_date'].isin([first_date,last_date])) & (df['trade_time'].astype(str).isin(boundary_times))]

          meta = {
              'status': 'PILOT_NOT_FORMAL',
              'dataset': 'neigezhu/china-a-share-1min-ohlcv',
              'snapshot_commit': 'f311a5f11569e9d541386982d15f2214d9970b8a',
              'canonical_path': 'data/stock_1m/SZ/002002.parquet',
              'symbol': '002002.SZ',
              'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
              'bytes': p.stat().st_size,
              'rows': len(df),
              'row_groups': pf.metadata.num_row_groups,
              'schema': [{'name': f.name, 'type': str(f.type)} for f in pf.schema_arrow],
              'timestamp_min': str(ts.min()),
              'timestamp_max': str(ts.max()),
              'trading_dates': int(day_counts.size),
              'day_row_count_distribution': {str(k): int(v) for k,v in sorted(Counter(day_counts.tolist()).items())},
              'morning_row_count_distribution': {str(k): int(v) for k,v in sorted(Counter(morning_counts.tolist()).items())},
              'afternoon_row_count_distribution': {str(k): int(v) for k,v in sorted(Counter(afternoon_counts.tolist()).items())},
              'outside_regular_session_rows': int(len(outside)),
              'first_date': str(first_date),
              'last_date': str(last_date),
              'first_date_times_head': [str(x) for x in df[df.trade_date==first_date].trade_time.head(10).tolist()],
              'first_date_times_tail': [str(x) for x in df[df.trade_date==first_date].trade_time.tail(10).tolist()],
              'boundary_rows_first_last_date': boundary[['trade_date','timestamp','open','high','low','close','volume','turnover']].astype(str).to_dict(orient='records'),
              'minute_bytes_materialized': True,
              'resampling_15m_validated': False,
              'resampling_60m_validated': False,
              'factor_formula_recovered': False,
              'formal_admission': False,
              'oos_metrics_allowed': False,
          }
          out = Path('out/intraday-spike/INSPECT_002002_F311A5F_V482.json')
          out.write_text(json.dumps(meta, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          PY
      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-intraday-minute-materialization-spike-v482
          path: |
            out/intraday-spike/INSPECT_002002_F311A5F_V482.json
            out/intraday-spike/http_headers.txt
            out/intraday-spike/sha256.txt
            out/intraday-spike/bytes.txt
          if-no-files-found: error
          retention-days: 30
