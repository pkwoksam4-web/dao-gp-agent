name: GP12 Readiness Turnover V4.82

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v482
    paths:
      - 'scripts/test_gp12_turnover_readiness_integration_v482.py'
      - 'scripts/gp12_turnover_readiness_integration_v482.py'
      - 'scripts/gp12_pit_readiness_integration_v482.py'
      - 'scripts/gp12_intraday_readiness_integration_v482.py'
      - 'scripts/gp12_formal_input_readiness_v1.py'
      - 'data/GP12_FORMAL_INPUT_EVIDENCE_V1.json'
      - 'data/GP12_INTRADAY_FORMAL847_BINDING_V1.json'
      - 'data/GP12_PIT_ADJUSTED_CLOSE_BINDING_V1.json'
      - 'data/GP12_AMOUNT_TURNOVER_BINDING_V1.json'
      - '.github/workflows/gp12-readiness-turnover-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run GP12 turnover readiness integration contracts
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v \
            test_gp12_turnover_readiness_integration_v482.py \
            test_gp12_pit_readiness_integration_v482.py \
            test_gp12_intraday_integration_v482.py \
            test_gp12_formal_input_readiness_v1.py \
            test_gp12_formal_input_readiness_production_v1.py \
            test_gp12_candidate_v1.py \
            test_model_freeze_recovery_v482.py \
            test_oos_admission_v482.py

  materialize-checkpoint:
    needs: integration-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize turnover readiness checkpoint
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p artifact
          python scripts/gp12_turnover_readiness_integration_v482.py \
            --parameters data/GP12_CANDIDATE_PARAMETERS_V1.json \
            --factors data/GP12_CANDIDATE_FACTORS_V1.json \
            --upstream-evidence data/GP12_FORMAL_INPUT_EVIDENCE_V1.json \
            --intraday-binding data/GP12_INTRADAY_FORMAL847_BINDING_V1.json \
            --pit-binding data/GP12_PIT_ADJUSTED_CLOSE_BINDING_V1.json \
            --turnover-binding data/GP12_AMOUNT_TURNOVER_BINDING_V1.json \
            --out artifact/GP12_FORMAL_INPUT_READINESS_INTRADAY_PIT_TURNOVER_V482.json
      - uses: actions/upload-artifact@v4
        with:
          name: gp12-formal-input-readiness-intraday-pit-turnover-v482
          path: artifact/GP12_FORMAL_INPUT_READINESS_INTRADAY_PIT_TURNOVER_V482.json
