name: GP12 Status Full Panel Materialize V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-status-full-panel-materialize-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q pandas pyarrow

      - name: Download full Sohu reference panel
        uses: actions/download-artifact@v4
        with:
          name: gp12-sohu-reference-full-v1
          path: reference
          run-id: 35064830592
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Download pinned PIT-ST final lifecycle overlay
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-final-audit
          path: pitst_final
          run-id: 33977325822
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Download pinned PIT-ST basic metadata
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-merged
          path: pitst_meta
          run-id: 33971534669
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Download canonical high-limit overlap truth
        uses: actions/download-artifact@v4
        with:
          name: gp12-status-upper-limit-truth-canonical-v1
          path: truth
          run-id: 35060927372
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Materialize and gate full status panel
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          import gp12_status_full_panel_v1 as status_panel

          REF_SHA='39f4df606abd4629ab28fac1d7444e73dfdeb3bb36c6764673f378463bd08c7e'
          OVERLAY_SHA='6ed8ffd09215bccb90f716af26d44f7f590ffd5d455c20841307484a63aaa490'
          TRUTH_SHA='d11b415b74d44d63d1aa927e8652f395dd039c28f6e1b4c24964e53759405308'
          SPECIAL_NO_LIMIT={
              ('000670.SZ','2022-08-22'),
              ('000792.SZ','2021-08-10'),
              ('000995.SZ','2020-12-16'),
              ('001267.SZ','2021-11-17'),
              ('001289.SZ','2022-01-24'),
              ('600190.SH','2025-06-30'),
              ('600200.SH','2025-12-09'),
              ('600387.SH','2025-06-16'),
              ('600462.SH','2025-06-24'),
          }

          def unique(root,name):
              hits=list(Path(root).rglob(name)); assert len(hits)==1,(root,name,hits); return hits[0]

          ref_path=unique('reference','SOHU_REFERENCE_FULL_V1.parquet')
          assert hashlib.sha256(ref_path.read_bytes()).hexdigest()==REF_SHA
          reference=pd.read_parquet(ref_path)
          assert len(reference)==1_011_607 and reference['symbol'].nunique()==844

          pit_csv=unique('pitst_final','PIT_ST_FORMAL_OVERLAY_V480.csv')
          assert hashlib.sha256(pit_csv.read_bytes()).hexdigest()==OVERLAY_SHA
          lifecycle=pd.read_csv(pit_csv,dtype={'symbol':str,'date':str})
          assert len(lifecycle)==1_021_953 and lifecycle['symbol'].nunique()==847

          audit=json.loads(unique('pitst_meta','PIT_ST_AUDIT_MERGED_V480.json').read_text(encoding='utf-8'))
          basics={}
          for item in audit['audits']:
              rows=(item.get('basic') or {}).get('rows') or []
              if len(rows)==1:
                  basics[str(item['symbol']).upper()]=rows[0]
          assert len(basics)==847
          ipo_map={s:str(v.get('ipoDate') or '')[:10] for s,v in basics.items()}

          panel, panel_audit=status_panel.build_status_panel(
              lifecycle,
              reference,
              ipo_map,
              SPECIAL_NO_LIMIT,
          )
          assert panel_audit['status']=='PASS_FULL_STATUS_PANEL'
          assert panel_audit['lifecycle_rows']==1_021_953
          assert panel_audit['symbols']==847
          assert panel_audit['tradable_rows']==1_011_607
          assert panel_audit['nontradable_rows']==10_346
          assert panel_audit['special_no_limit_dates_n']==9
          assert not panel.duplicated(['symbol','date']).any()
          assert not panel.loc[~panel['tradable'],'upper_limit'].any()

          truth_path=unique('truth','HF_HIGH_LIMIT_FORMAL844_OVERLAP_CANONICAL.parquet')
          assert hashlib.sha256(truth_path.read_bytes()).hexdigest()==TRUTH_SHA
          truth=pd.read_parquet(truth_path)
          truth['symbol']=truth['code'].astype(str).str.upper(); truth['date']=truth['date'].astype(str).str[:10]
          truth['close']=pd.to_numeric(truth['close'],errors='raise')
          truth['high_limit']=pd.to_numeric(truth['high_limit'],errors='raise')
          truth['truth_upper_limit']=(truth['high_limit']<99999.0) & ((truth['close']-truth['high_limit']).abs()<0.0051)
          overlap=truth[['symbol','date','truth_upper_limit']].merge(
              panel[['symbol','date','upper_limit']],on=['symbol','date'],how='left',validate='one_to_one'
          )
          assert len(overlap)==896_827
          assert overlap['upper_limit'].notna().all()
          mismatch=overlap[overlap['truth_upper_limit'].astype(bool)!=overlap['upper_limit'].astype(bool)]
          assert len(mismatch)==0,len(mismatch)

          out=Path('artifact_gp12_status_full_panel_v1'); out.mkdir(exist_ok=True)
          panel_path=out/'GP12_STATUS_FULL_PANEL_V1.parquet'
          panel.to_parquet(panel_path,index=False)
          panel_sha=hashlib.sha256(panel_path.read_bytes()).hexdigest()
          panel_audit.update({
              'panel_sha256':panel_sha,
              'source_reference_panel_sha256':REF_SHA,
              'source_pit_st_overlay_sha256':OVERLAY_SHA,
              'hf_overlap_truth_sha256':TRUTH_SHA,
              'hf_overlap_rows':896_827,
              'hf_overlap_boolean_mismatch_n':0,
              'explicit_special_no_limit_dates':sorted([list(x) for x in SPECIAL_NO_LIMIT]),
              'pit_scope':'SESSION_CLOSE_NO_LOOKAHEAD_POLICY',
              'same_session_status_usable_before_close':False,
              'historical_provider_publication_timestamp_proven':False,
          })
          audit_path=out/'GP12_STATUS_FULL_PANEL_AUDIT_V1.json'
          audit_path.write_text(json.dumps(panel_audit,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          audit_sha=hashlib.sha256(audit_path.read_bytes()).hexdigest()
          print(json.dumps({**panel_audit,'audit_sha256':audit_sha},ensure_ascii=False,indent=2))
          PY

      - name: Upload full status panel
        uses: actions/upload-artifact@v4
        with:
          name: gp12-status-full-panel-v1
          path: artifact_gp12_status_full_panel_v1/
          if-no-files-found: error
          retention-days: 90
