name: GP V4.82 Special Ex-right

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/sample50_validate.py'
      - 'scripts/test_special_exright_v482.py'
      - '.github/workflows/special-exright-v482.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V4.82 special ex-right tests
        run: |
          cd scripts
          python -m unittest -v test_special_exright_v482.py
