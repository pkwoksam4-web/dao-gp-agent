name: GP V4.82 Special Ex-right

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/sample50_validate.py'
      - 'scripts/special_exright_closure_v482.py'
      - 'scripts/test_special_exright_v482.py'
      - 'scripts/test_special_exright_closure_v482.py'
      - 'data/SPECIAL_EXRIGHT_REFERENCE_V482.json'
      - '.github/workflows/special-exright-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V4.82 special ex-right tests
        run: |
          cd scripts
          python -m unittest -v test_special_exright_v482.py test_special_exright_closure_v482.py
