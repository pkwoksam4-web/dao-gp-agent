name: GP Delisted F10 probe V481

on:
  push:
    branches:
      - gp/delisted-f10-probe-v481
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-unresolved-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe gzip-aware PageAjax and full per-security report history
        run: python scripts/probe_f10_unresolved_history_v481.py
      - name: Verify probe remains fail-closed and non-Formal
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('artifact_f10_unresolved_history_v481/F10_UNRESOLVED_HISTORY_PROBE_V481.json')
          if not p.exists(): raise SystemExit('unresolved-history probe report missing')
          x=json.load(open(p,encoding='utf-8'))
          assert x['target_n']==7
          assert x['formal_promotion'] is False
          assert x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False
          assert x['oos_metrics_allowed'] is False
          print(json.dumps({'target_n':x['target_n'],'resolved_n':x['resolved_n'],'unresolved_n':x['unresolved_n']},ensure_ascii=False,indent=2))
          PY
      - name: Upload unresolved-history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-f10-unresolved-history-v481
          path: artifact_f10_unresolved_history_v481/
          if-no-files-found: error
          retention-days: 30
