name: GP Delisted F10 probe V481

on:
  push:
    branches:
      - gp/delisted-f10-probe-v481
  workflow_dispatch:

permissions:
  contents: read

jobs:
  term-parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V4.81 missing-event term parser tests
        run: |
          cd scripts
          python -m unittest -v test_missing_event_terms_v481.py

  supplemental-evidence:
    needs: term-parser-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize raw supplemental evidence for final 6 dates
        run: python scripts/materialize_supplemental_missing_events_v481.py
      - name: Verify supplemental evidence remains non-Formal
        run: |
          python - <<'PY'
          import json
          p='artifact_supplemental_missing_events_v481/SUPPLEMENTAL_MISSING_EVENT_EVIDENCE_V481.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['target_n']==6
          assert x['positive_n']==6
          assert x['unresolved_n']==0
          assert x['formal_promotion'] is False
          assert x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False
          assert x['oos_metrics_allowed'] is False
          print(json.dumps({'target_n':x['target_n'],'positive_n':x['positive_n'],'unresolved_n':x['unresolved_n']},ensure_ascii=False,indent=2))
          PY
      - name: Upload supplemental missing-event evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-supplemental-missing-event-v481
          path: artifact_supplemental_missing_events_v481/
          if-no-files-found: error
          retention-days: 30
