name: Repository lineage scan

on:
  push:
    branches:
      - gp-lineage-20260913-b
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Scan GH Archive for deleted repository IDs and account lineage
        shell: bash
        run: |
          set +e
          mkdir -p probe11/gharchive
          scan_one() {
            date="$1"; hour="$2"
            base="probe11/gharchive/${date}-${hour}"
            curl -L --retry 2 --connect-timeout 12 --max-time 150 -sS "https://data.gharchive.org/${date}-${hour}.json.gz" 2>"${base}.err" \
              | gzip -dc 2>>"${base}.err" \
              | grep -E '1296046921|1317931511|"id":300349603|"login":"leo-quant-research"|"name":"leo-quant-research/|315634734|"login":"zjzesheng"|"name":"zjzesheng/' > "${base}.hits"
            test -s "${base}.hits" || rm -f "${base}.hits"
          }
          export -f scan_one
          python - <<'PY' > probe11/dates.txt
          import datetime as dt
          d=dt.date(2026,8,16); end=dt.date(2026,9,13)
          while d<=end:
              print(d.isoformat()); d+=dt.timedelta(days=1)
          PY
          while read -r d; do
            for h in $(seq 0 23); do printf '%s\t%s\n' "$d" "$h"; done
          done < probe11/dates.txt | xargs -P 32 -n 2 bash -c 'scan_one "$0" "$1"'

      - name: Parse events
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('probe11')
          events=[]
          target_repo_ids={1296046921,1317931511}
          target_actor_ids={300349603,315634734}
          for p in sorted((root/'gharchive').glob('*.hits')):
              for line in p.read_text('utf-8',errors='replace').splitlines():
                  try: x=json.loads(line)
                  except Exception: continue
                  repo=x.get('repo') or {}; actor=x.get('actor') or {}; pay=x.get('payload') or {}
                  name=str(repo.get('name',''))
                  if not (repo.get('id') in target_repo_ids or actor.get('id') in target_actor_ids or actor.get('login') in {'leo-quant-research','zjzesheng'} or name.startswith('leo-quant-research/') or name.startswith('zjzesheng/')):
                      continue
                  e={'file':p.name,'event_id':x.get('id'),'type':x.get('type'),'created_at':x.get('created_at'),'public':x.get('public'),'actor_id':actor.get('id'),'actor':actor.get('login'),'repo_id':repo.get('id'),'repo_name':repo.get('name')}
                  for k in ['ref','ref_type','before','head','action','size','distinct_size','repository_id','push_id','master_branch','description','pusher_type']:
                      if k in pay: e[k]=pay.get(k)
                  if isinstance(pay.get('forkee'),dict):
                      f=pay['forkee']; e['forkee_id']=f.get('id'); e['forkee_full_name']=f.get('full_name'); e['forkee_owner']=(f.get('owner') or {}).get('login')
                  if isinstance(pay.get('release'),dict): e['release_tag']=pay['release'].get('tag_name')
                  events.append(e)
          events.sort(key=lambda x:(x.get('created_at') or '',x.get('event_id') or ''))
          out={'events':events,'hit_count':len(events),'repo_ids':sorted({e.get('repo_id') for e in events if e.get('repo_id') is not None}),'repo_names':sorted({e.get('repo_name') for e in events if e.get('repo_name')}),'event_types':{}}
          for e in events: out['event_types'][e['type']]=out['event_types'].get(e['type'],0)+1
          (root/'events.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps({'hit_count':out['hit_count'],'repo_ids':out['repo_ids'],'repo_names':out['repo_names'],'event_types':out['event_types']},ensure_ascii=False))
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leo-repo-lineage-20260816-20260913
          path: probe11/
          retention-days: 30
