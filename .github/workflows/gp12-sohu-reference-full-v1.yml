name: GP12 Sohu Reference Full V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/gp12_sohu_reference_v1.py'
      - 'scripts/gp12_sohu_reference_panel_v1.py'
      - '.github/workflows/gp12-sohu-reference-full-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q pandas pyarrow

      - name: Download pinned Sohu raw panel
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-full-raw-v482-reaudit
          path: raw
          run-id: 34192233633
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Verify pinned raw identity
        run: |
          RAW="$(find raw -name SOHU_RAW_FULL_V482.parquet -type f | head -1)"
          test -n "$RAW"
          python - "$RAW" <<'PY'
          import hashlib, sys
          p=sys.argv[1]
          h=hashlib.sha256(open(p,'rb').read()).hexdigest()
          assert h=='bc72238d046378cf3b6fa61723e86fb43f1c491ac3da86d76932e3185f60e1eb',h
          print(h)
          PY

      - name: Materialize reference shard
        env:
          PYTHONPATH: scripts
        run: |
          RAW="$(find raw -name SOHU_RAW_FULL_V482.parquet -type f | head -1)"
          python scripts/gp12_sohu_reference_panel_v1.py shard \
            --raw "$RAW" \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --out-dir artifact_sohu_reference_shard_${{ matrix.shard }} \
            --workers 2 \
            --timeout 20 \
            --retries 3 \
            --delay 0.03

      - name: Gate shard
        run: |
          python - <<'PY'
          import glob,json
          hits=glob.glob('artifact_sohu_reference_shard_*/SOHU_REFERENCE_SHARD_*_AUDIT_V1.json')
          assert len(hits)==1,hits
          x=json.load(open(hits[0],encoding='utf-8'))
          assert x['status']=='PASS_SHARD_REFERENCE',x
          assert x['shard_count']==8,x
          assert x['reference_rows']==x['expected_rows'],x
          assert x['close_mismatch_n']==0,x
          assert x['formal_binding_allowed'] is False,x
          assert x['historical_gp_v11_source_recovered'] is False,x
          assert x['model_freeze_allowed'] is False,x
          assert x['oos_metrics_allowed'] is False,x
          print(json.dumps({k:x[k] for k in ('shard_index','symbols_selected','expected_rows','reference_rows','status')},indent=2))
          PY

      - name: Upload reference shard
        uses: actions/upload-artifact@v4
        with:
          name: gp12-sohu-reference-v1-shard-${{ matrix.shard }}
          path: artifact_sohu_reference_shard_${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: source-shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q pandas pyarrow

      - name: Download all reference shards
        uses: actions/download-artifact@v4
        with:
          pattern: gp12-sohu-reference-v1-shard-*
          path: shards
          merge-multiple: true

      - name: Download pinned Sohu raw panel
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-full-raw-v482-reaudit
          path: raw
          run-id: 34192233633
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Merge Formal844 reference panel
        env:
          PYTHONPATH: scripts
        run: |
          RAW="$(find raw -name SOHU_RAW_FULL_V482.parquet -type f | head -1)"
          python scripts/gp12_sohu_reference_panel_v1.py merge \
            --raw "$RAW" \
            --shards-root shards \
            --out-dir artifact_sohu_reference_full_v1 \
            --expected-shard-count 8

      - name: Gate exact Formal844 panel
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('artifact_sohu_reference_full_v1/SOHU_REFERENCE_FULL_AUDIT_V1.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['status']=='PASS_FULL_REFERENCE_PANEL',x
          assert x['shard_count']==8,x
          assert x['symbol_n']==844,x
          assert x['expected_rows']==1011607,x
          assert x['reference_rows']==1011607,x
          assert x['duplicate_symbol_dates']==0,x
          assert x['missing_rows']==0,x
          assert x['extra_rows']==0,x
          assert x['close_mismatch_n']==0,x
          assert x['formal_binding_allowed'] is False,x
          assert x['historical_gp_v11_source_recovered'] is False,x
          assert x['model_freeze_allowed'] is False,x
          assert x['oos_metrics_allowed'] is False,x
          panel=Path('artifact_sohu_reference_full_v1/SOHU_REFERENCE_FULL_V1.parquet')
          print(json.dumps(x,ensure_ascii=False,indent=2))
          print('panel_sha256='+hashlib.sha256(panel.read_bytes()).hexdigest())
          print('audit_sha256='+hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - name: Upload full reference panel
        uses: actions/upload-artifact@v4
        with:
          name: gp12-sohu-reference-full-v1
          path: artifact_sohu_reference_full_v1/
          if-no-files-found: error
          retention-days: 30
