name: GP12 Main Net Flow MaiRui Single-Day Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-mairui-single-day-probe-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install -q requests
      - name: Diagnose public demo and formal-window availability
        run: |
          python - <<'PY'
          import json, math, re, time
          import requests

          SYMBOL = '000001'
          SINGLE_DATES = ['20200601', '20240102', '20260417', '20260821', '20260915']
          REQUIRED = ('zmbtdcje', 'zmbddcje', 'zmstdcje', 'zmsddcje')
          HEADERS = {'User-Agent': 'Mozilla/5.0 GP12-CANDIDATE-PROBE/1.0'}

          doc = requests.get('https://www.mairuiapi.com/hsdata', headers=HEADERS, timeout=30)
          doc.raise_for_status()
          match = re.search(r'LICENCE-[A-Z0-9-]{12,}', doc.text)
          if not match:
              raise RuntimeError('public MaiRui demo certificate not found in official documentation')
          licence = match.group(0)

          def redact(url):
              return url.replace(licence, '<PUBLIC_DEMO>')

          def parse_payload(label, r):
              item = {
                  'label': label,
                  'http_status': r.status_code,
                  'url': redact(r.url),
                  'body_head': r.text[:500],
              }
              if r.status_code != 200:
                  item['data_present'] = False
                  return item
              try:
                  payload = r.json()
              except Exception as exc:
                  item['json_error'] = f'{type(exc).__name__}: {exc}'
                  item['data_present'] = False
                  return item
              if not isinstance(payload, list):
                  item['payload_type'] = type(payload).__name__
                  item['data_present'] = False
                  return item
              item['raw_row_n'] = len(payload)
              item['data_present'] = bool(payload)
              if not payload:
                  return item
              dates = sorted({str(row.get('t', ''))[:10] for row in payload if isinstance(row, dict)})
              item['dates'] = dates[:20]
              mains = []
              fields_ok = True
              for idx, row in enumerate(payload):
                  if not isinstance(row, dict):
                      fields_ok = False
                      continue
                  missing = [k for k in REQUIRED if row.get(k) is None]
                  if missing:
                      fields_ok = False
                      item.setdefault('missing_fields', []).append({'row': idx, 'missing': missing})
                      continue
                  vals = {k: float(row[k]) for k in REQUIRED}
                  if not all(math.isfinite(v) and v >= 0 for v in vals.values()):
                      fields_ok = False
                      continue
                  mains.append(vals['zmbtdcje'] + vals['zmbddcje'] - vals['zmstdcje'] - vals['zmsddcje'])
              item['required_fields_present'] = fields_ok and bool(mains)
              if mains:
                  item['main_net_flow_cny_first'] = mains[0]
                  item['main_net_flow_min'] = min(mains)
                  item['main_net_flow_max'] = max(mains)
              return item

          single = {}
          for day in SINGLE_DATES:
              url = f'https://api.mairuiapi.com/hsstock/history/transaction/{day}/{SYMBOL}/{licence}'
              try:
                  r = requests.get(url, headers=HEADERS, timeout=30)
                  result = parse_payload(f'single_{day}', r)
              except Exception as exc:
                  result = {'label': f'single_{day}', 'error': f'{type(exc).__name__}: {exc}'}
              single[day] = result
              print('SINGLE', json.dumps(result, ensure_ascii=False))
              time.sleep(0.3)

          ranges = {}
          for st, et in [('20260821','20260821'), ('20260417','20260417'), ('20200601','20200601')]:
              url = f'https://api.mairuiapi.com/hsstock/history/transaction/{SYMBOL}/{licence}'
              try:
                  r = requests.get(url, params={'st': st, 'et': et}, headers=HEADERS, timeout=30)
                  result = parse_payload(f'range_{st}_{et}', r)
              except Exception as exc:
                  result = {'label': f'range_{st}_{et}', 'error': f'{type(exc).__name__}: {exc}'}
              ranges[st] = result
              print('RANGE', json.dumps(result, ensure_ascii=False))
              time.sleep(0.3)

          blockers = []
          demo_single = single.get('20260821') or {}
          demo_range = ranges.get('20260821') or {}
          demo_usable = bool(demo_single.get('data_present') or demo_range.get('data_present'))
          if not demo_usable:
              blockers.append('MAIRUI_PUBLIC_DEMO_UNUSABLE')

          for day in ('20200601', '20260417'):
              s = single.get(day) or {}
              q = ranges.get(day) or {}
              if not (s.get('data_present') or q.get('data_present')):
                  blockers.append(f'MAIRUI_FORMAL_ANCHOR_UNAVAILABLE_{day}')
              if not (s.get('required_fields_present') or q.get('required_fields_present')):
                  blockers.append(f'MAIRUI_REQUIRED_FIELDS_UNAVAILABLE_{day}')

          summary = {
              'artifact': 'GP12_MAIN_NET_FLOW_MAIRUI_DIAGNOSTIC_V2',
              'symbol': '000001.SZ',
              'formal_window': ['2020-06-01', '2026-04-17'],
              'single_day': single,
              'range_one_day': ranges,
              'public_demo_usable': demo_usable,
              'blockers': blockers,
              'binding_allowed': False,
              'model_freeze_allowed': False,
              'oos_metrics_allowed': False,
          }
          print('===SUMMARY===')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          if blockers:
              raise RuntimeError('PROBE_BLOCKED: ' + ','.join(blockers))
          print('PASS_MAIRUI_AVAILABILITY_DIAGNOSTIC')
          PY
