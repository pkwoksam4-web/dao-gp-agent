          assert intraday_formal_symbols_sha256 == '9e64e111c5eeff1f43fcce6e920d7e5590aa5bb14268c482bbdfe1a936affef8'
          assert intraday_inventory_audit['formal847_inventory_intersection']['matched_symbols'] == 847
          assert intraday_inventory_audit['formal847_inventory_intersection']['missing_symbols'] == 0
