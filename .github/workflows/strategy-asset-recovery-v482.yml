          assert intraday_inventory_audit['formal_847_15m_coverage_verified'] is False
          assert intraday_inventory_audit['formal_847_60m_coverage_verified'] is False

          expected_factors = [
              ('Market Regime', 8),
              ('Market Breadth/Diffusion', 4),
              ('Sector RS', 10),
              ('Sector Slope x R2', 7),
              ('Sector Breadth', 8),
              ('Position', 12),
              ('Multi-Momentum', 10),
              ('Trend Quality', 8),
