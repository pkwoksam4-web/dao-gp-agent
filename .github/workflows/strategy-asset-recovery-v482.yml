name: GP V4.82 Strategy Asset Recovery

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - 'scripts/strategy_asset_recovery_v482.py'
      - 'scripts/test_strategy_asset_recovery_v482.py'
      - 'scripts/test_strategy_factor_recovery_matrix_v482.py'
      - 'scripts/test_gp12_candidate_historical_crosswalk_v482.py'
      - 'scripts/test_strategy_policy_recovery_matrix_v482.py'
      - 'scripts/test_strategy_intraday_source_recovery_v482.py'
      - 'scripts/test_strategy_intraday_inventory_binding_v482.py'
      - 'data/GP_V11_STRATEGY_RECOVERY_EVIDENCE_V482.json'
      - 'data/GP_V11_FACTOR_RECOVERY_MATRIX_V482.json'
      - 'data/GP12_CANDIDATE_HISTORICAL_CROSSWALK_V482.json'
      - 'data/GP_V11_DECISION_POLICY_RECOVERY_MATRIX_V482.json'
      - 'data/GP_V11_INTRADAY_SOURCE_RECOVERY_V482.json'
      - 'data/GP_V11_INTRADAY_MINUTE_PILOT_VERIFY_V482.json'
      - 'data/INTRADAY_FORMAL847_INVENTORY_AUDIT_V482.json'
      - 'data/FORMAL847_NEIGEZHU_INVENTORY_ROWS_V482.csv'
      - 'data/FORMAL847_SYMBOLS_V482.txt'
      - '.github/workflows/strategy-asset-recovery-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strategy recovery contract tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v \
            test_strategy_asset_recovery_v482.py \
            test_strategy_factor_recovery_matrix_v482.py \
            test_gp12_candidate_historical_crosswalk_v482.py \
            test_strategy_policy_recovery_matrix_v482.py \
            test_strategy_intraday_source_recovery_v482.py \
            test_strategy_intraday_inventory_binding_v482.py
      - name: Upstream recovery, calendar, admission and Formal regressions
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v \
            test_model_freeze_recovery_v482.py \
            test_oos_calendar_v482.py \
            test_oos_admission_v482.py \
            test_formal_readiness_v482.py \
            test_formal_readiness_finalize_v482.py

  production-recovery:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download OOS-calendar-bound recovery checkpoint
        uses: actions/download-artifact@v4
        with:
          name: gp-oos-calendar-v482
          path: input/oos-calendar
          run-id: 34209105455
          github-token: ${{ secrets.GITHUB_TOKEN }}
