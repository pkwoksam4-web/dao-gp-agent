name: GP V4.82 Strategy Asset Recovery

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - 'scripts/strategy_asset_recovery_v482.py'
      - 'scripts/test_strategy_asset_recovery_v482.py'
      - 'scripts/test_strategy_factor_recovery_matrix_v482.py'
      - 'scripts/test_gp12_candidate_historical_crosswalk_v482.py'
      - 'data/GP_V11_STRATEGY_RECOVERY_EVIDENCE_V482.json'
      - 'data/GP_V11_FACTOR_RECOVERY_MATRIX_V482.json'
      - 'data/GP12_CANDIDATE_HISTORICAL_CROSSWALK_V482.json'
      - '.github/workflows/strategy-asset-recovery-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strategy recovery contract tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v \
            test_strategy_asset_recovery_v482.py \
            test_strategy_factor_recovery_matrix_v482.py \
            test_gp12_candidate_historical_crosswalk_v482.py
      - name: Upstream recovery, calendar, admission and Formal regressions
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v \
            test_model_freeze_recovery_v482.py \
            test_oos_calendar_v482.py \
            test_oos_admission_v482.py \
            test_formal_readiness_v482.py \
            test_formal_readiness_finalize_v482.py

  production-recovery:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download OOS-calendar-bound recovery checkpoint
        uses: actions/download-artifact@v4
        with:
          name: gp-oos-calendar-v482
          path: input/oos-calendar
          run-id: 34209105455
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Evaluate production strategy recovery evidence
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p out/strategy-recovery
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import strategy_asset_recovery_v482 as mod

          checkpoint_path = Path('input/oos-calendar/MODEL_ASSET_RECOVERY_CHECKPOINT_V482_OOS_CALENDAR.json')
          evidence_path = Path('data/GP_V11_STRATEGY_RECOVERY_EVIDENCE_V482.json')
          matrix_path = Path('data/GP_V11_FACTOR_RECOVERY_MATRIX_V482.json')
          checkpoint = json.loads(checkpoint_path.read_text(encoding='utf-8'))
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          matrix_bytes = matrix_path.read_bytes()
          matrix = json.loads(matrix_bytes.decode('utf-8'))
          matrix_sha256 = hashlib.sha256(matrix_bytes).hexdigest()

          expected_factors = [
              ('Market Regime', 8),
              ('Market Breadth/Diffusion', 4),
              ('Sector RS', 10),
              ('Sector Slope x R2', 7),
              ('Sector Breadth', 8),
              ('Position', 12),
              ('Multi-Momentum', 10),
              ('Trend Quality', 8),
              ('Efficiency Ratio', 7),
              ('Drawdown Recovery', 8),
              ('Price/Fund Efficiency', 10),
              ('Intraday Confirmation', 8),
          ]
          assert matrix['artifact'] == 'GP_V11_FACTOR_RECOVERY_MATRIX_V482'
          assert matrix['version'] == 'V4.82'
          assert matrix['factor_library_version'] == 'V1.0'
          assert [(x['name'], x['weight_pct']) for x in matrix['factors']] == expected_factors
          assert sum(x['weight_pct'] for x in matrix['factors']) == 100
          assert matrix['authoritative_weight_vector_recovered'] is True
          assert matrix['complete_factor_definitions_recovered'] is False
          assert matrix['full_strategy_source_recovered'] is False
          assert matrix['model_freeze_allowed'] is False
          assert matrix['oos_metrics_allowed'] is False

          out = mod.evaluate_strategy_recovery(checkpoint, evidence)
          expected = [
              'FACTOR_DEFINITION_MISSING',
              'PARAMETER_SET_MISSING',
              'STRATEGY_CODE_MISSING',
          ]
          assert out['status'] == 'STRATEGY_ASSETS_INCOMPLETE_V482', out
          assert out['blockers'] == expected, out['blockers']
          assert out['daily_base_code_recovered'] is True
          assert len(out['recovered_assets']) == 1
          assert out['recovered_assets'][0]['scope'] == 'DAILY_BASE_ONLY'
          assert out['recovered_assets'][0]['complete_12_factor_strategy'] is False
          assert out['strategy_code_recovered'] is False
          assert out['parameter_set_recovered'] is False
          assert out['factor_definition_recovered'] is False
          assert out['model_freeze_allowed'] is False
          assert out['oos_metrics_allowed'] is False
          assert all(x['freeze_eligible'] is False for x in out['candidate_clues'])
          assert len(out['missing_required_fields']) == 10

          out['factor_recovery_matrix_sha256'] = matrix_sha256
          out['factor_library_version'] = matrix['factor_library_version']
          out['authoritative_weight_vector_recovered'] = matrix['authoritative_weight_vector_recovered']
          out['complete_factor_definitions_recovered'] = matrix['complete_factor_definitions_recovered']
          out['full_strategy_source_recovered'] = matrix['full_strategy_source_recovered']

          target = Path('out/strategy-recovery/STRATEGY_ASSET_RECOVERY_CHECKPOINT_V482.json')
          target.write_text(json.dumps(out, ensure_ascii=False, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          Path('out/strategy-recovery/GP_V11_STRATEGY_RECOVERY_EVIDENCE_V482.json').write_text(
              json.dumps(evidence, ensure_ascii=False, sort_keys=True, indent=2) + '\n',
              encoding='utf-8',
          )
          Path('out/strategy-recovery/GP_V11_FACTOR_RECOVERY_MATRIX_V482.json').write_bytes(matrix_bytes)
          print(json.dumps({
              'status': out['status'],
              'daily_base_code_recovered': out['daily_base_code_recovered'],
              'authoritative_weight_vector_recovered': out['authoritative_weight_vector_recovered'],
              'complete_factor_definitions_recovered': out['complete_factor_definitions_recovered'],
              'full_strategy_source_recovered': out['full_strategy_source_recovered'],
              'factor_recovery_matrix_sha256': out['factor_recovery_matrix_sha256'],
              'strategy_code_recovered': out['strategy_code_recovered'],
              'parameter_set_recovered': out['parameter_set_recovered'],
              'factor_definition_recovered': out['factor_definition_recovered'],
              'evidence_sha256': out['evidence_sha256'],
              'remaining_blockers': out['blockers'],
              'missing_required_fields': out['missing_required_fields'],
              'model_freeze_allowed': out['model_freeze_allowed'],
              'oos_metrics_allowed': out['oos_metrics_allowed'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload strategy recovery checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: gp-strategy-asset-recovery-v482
          path: out/strategy-recovery/
          if-no-files-found: error
          retention-days: 30
