name: DAO2 A Paywalled Sample Precheck V1

on:
  workflow_dispatch:
  push:
    branches:
      - gp/dao2-a-main-net-flow
    paths:
      - .github/workflows/dao2-a-paywalled-sample-precheck-v1.yml

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    steps:
      - name: Install parquet reader
        run: python -m pip install --quiet pandas pyarrow requests

      - name: Retrieve public sample and exact-match Jessica
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json, re, zipfile
          from decimal import Decimal, InvalidOperation
          from urllib.parse import quote, unquote
          import pandas as pd
          import requests

          share_url = "https://pan.baidu.com/s/154fXqZgOaiCKXkyBjT95QA?pwd=hhc5"
          surl_full = "154fXqZgOaiCKXkyBjT95QA"
          surl_short = surl_full[1:]
          pwd = "hhc5"
          zip_name = "moneyflow_sample.zip"
          parquet_name = "moneyflow__sample_50rows.parquet"
          jessica_commit = "6b245fa09cb628f3bcb812f0662bfef520e65fb4"
          jessica_base = f"https://raw.githubusercontent.com/Jessica-Zhangyj/dlquant/{jessica_commit}/data/moneyflow"

          required = [
              "ts_code", "trade_date",
              "buy_lg_amount", "buy_elg_amount",
              "sell_lg_amount", "sell_elg_amount",
          ]
          preferred = [
              "buy_sm_amount", "buy_md_amount",
              "sell_sm_amount", "sell_md_amount",
              "net_mf_amount",
          ]
          compare_fields = required + preferred

          sess = requests.Session()
          sess.trust_env = False
          ua = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/120.0.0.0 Safari/537.36"
          )
          sess.headers.update({
              "User-Agent": ua,
              "Accept": "application/json, text/javascript, */*; q=0.01",
          })

          out = {
              "artifact": "DAO2_A_PAYWALLED_SAMPLE_PRECHECK_V1",
              "provider": "tushare.indevs.in",
              "product": "Tushare moneyflow 完整历史数据",
              "price_cny": 50,
              "sample_share_url": share_url,
              "sample_zip_filename": zip_name,
              "sample_parquet_filename": parquet_name,
              "login_used": False,
              "private_credentials_used": False,
              "jessica_repository": "Jessica-Zhangyj/dlquant",
              "jessica_commit": jessica_commit,
              "compare_fields": compare_fields,
          }

          def fail(msg):
              raise RuntimeError(msg)

          try:
              init_url = f"https://pan.baidu.com/share/init?surl={surl_short}"
              sess.get(init_url, timeout=30)

              vr = sess.post(
                  "https://pan.baidu.com/share/verify",
                  params={"surl": surl_short},
                  data={"pwd": pwd, "vcode": "", "vcode_str": ""},
                  headers={"Referer": init_url, "Origin": "https://pan.baidu.com"},
                  timeout=30,
              )
              vr.raise_for_status()
              vj = vr.json()
              out["verify_errno"] = vj.get("errno")
              if vj.get("errno") != 0:
                  fail(f"share/verify failed: errno={vj.get('errno')}")
              randsk_raw = str(vj.get("randsk") or "")
              sekey = unquote(randsk_raw)
              if not sekey:
                  fail("share/verify did not return randsk/sekey")

              share_page = f"https://pan.baidu.com/s/{surl_full}"
              page = sess.get(share_page, headers={"Referer": init_url}, timeout=30)
              page.raise_for_status()
              html = page.text

              # shareid/uk can be embedded in the page; public shorturlinfo is a fallback.
              sid_m = re.search(r"shareid\s*[:=]\s*['\"]?(\d+)['\"]?", html)
              uk_m = re.search(r"share_uk\s*[:=]\s*['\"]?(\d+)['\"]?", html)
              shareid = sid_m.group(1) if sid_m else ""
              uk = uk_m.group(1) if uk_m else ""
              if not shareid or not uk:
                  ir = sess.get(
                      f"https://pan.baidu.com/api/shorturlinfo?shorturl={surl_full}"
                      "&web=5&app_id=250528&channel=chunlei&clienttype=5",
                      timeout=30,
                  )
                  ij = ir.json()
                  longurl = str(ij.get("longurl") or "")
                  sm = re.search(r"(?:^|&)shareid=(\d+)", longurl)
                  um = re.search(r"(?:^|&)uk=(\d+)", longurl)
                  shareid = shareid or (sm.group(1) if sm else "")
                  uk = uk or (um.group(1) if um else "")
              if not shareid or not uk:
                  fail("could not determine public shareid/uk")

              # Current public-share signing API.
              tr = sess.get(
                  "https://pan.baidu.com/share/tplconfig",
                  params={"surl": surl_full, "fields": "sign,timestamp", "view_mode": 1},
                  headers={"Referer": share_page},
                  timeout=30,
              )
              tr.raise_for_status()
              tj = tr.json()
              out["tplconfig_errno"] = tj.get("errno")
              if tj.get("errno") != 0:
                  fail(f"share/tplconfig failed: errno={tj.get('errno')}")
              sign = str((tj.get("data") or {}).get("sign") or "")
              timestamp = str((tj.get("data") or {}).get("timestamp") or "")
              if not sign or not timestamp:
                  fail("tplconfig missing sign/timestamp")

              # Root file list via verified public share.
              lr = sess.get(
                  "https://pan.baidu.com/share/list",
                  params={
                      "app_id": 250528,
                      "channel": "chunlei",
                      "clienttype": 0,
                      "web": 1,
                      "page": 1,
                      "num": 1000,
                      "order": "time",
                      "desc": 1,
                      "showempty": 0,
                      "root": 1,
                      "sekey": sekey,
                      "uk": uk,
                      "shareid": shareid,
                  },
                  headers={"Referer": share_page},
                  timeout=30,
              )
              lr.raise_for_status()
              lj = lr.json()
              out["list_errno"] = lj.get("errno")
              if lj.get("errno") != 0:
                  fail(f"share/list failed: errno={lj.get('errno')}")
              items = lj.get("list") or []
              zips = [x for x in items if isinstance(x, dict) and x.get("server_filename") == zip_name]
              if len(zips) != 1:
                  fail(f"expected exactly one {zip_name}, got {len(zips)}")
              item = zips[0]
              fs_id = int(item["fs_id"])
              out["public_sample_file"] = {
                  "server_filename": item.get("server_filename"),
                  "path": item.get("path"),
                  "size": item.get("size"),
                  "fs_id": fs_id,
                  "md5": item.get("md5"),
                  "shareid": shareid,
                  "uk": uk,
              }

              # Current anonymous public-share download request.
              payload = {
                  "product": "share",
                  "encrypt": "0",
                  "uk": str(uk),
                  "primaryid": str(shareid),
                  "fid_list": json.dumps([fs_id]),
                  "extra": json.dumps({"sekey": sekey}),
                  "type": "batch",
              }
              params = {
                  "sign": sign,
                  "timestamp": timestamp,
                  "channel": "chunlei",
                  "web": "1",
                  "app_id": "250528",
                  "clienttype": "0",
                  "bdstoken": "",
                  "logid": "",
              }
              dr = sess.post(
                  "https://pan.baidu.com/api/sharedownload",
                  params=params,
                  data=payload,
                  headers={
                      "Referer": share_page,
                      "Origin": "https://pan.baidu.com",
                      "X-Requested-With": "XMLHttpRequest",
                  },
                  timeout=30,
              )
              dr.raise_for_status()
              dj = dr.json()
              out["sharedownload_errno"] = dj.get("errno")
              if dj.get("errno") == -20:
                  out["captcha_required"] = True
                  fail("public sample download requires Baidu CAPTCHA")
              if dj.get("errno") != 0:
                  fail(f"api/sharedownload failed: errno={dj.get('errno')} msg={dj.get('show_msg')}")
              dlink = dj.get("dlink")
              if not isinstance(dlink, str) or not dlink:
                  # Older shape fallback.
                  dl = dj.get("list") or []
                  if dl and isinstance(dl[0], dict):
                      dlink = dl[0].get("dlink")
              if not isinstance(dlink, str) or not dlink:
                  fail(f"api/sharedownload returned no dlink keys={sorted(dj.keys())}")

              # Baidu CDN enforces User-Agent policy on dlinks. Try only normal
              # documented/public client UAs; no login or private credential.
              zip_bytes = None
              attempts = []
              for dua in (ua, "pan.baidu.com", "LogStatistic", "netdisk;P2SP;2.2.60.26"):
                  dh = {
                      "User-Agent": dua,
                      "Referer": share_page,
                      "Range": "bytes=0-",
                  }
                  zr = requests.get(dlink, headers=dh, stream=False, timeout=60, allow_redirects=True)
                  attempts.append({
                      "user_agent": dua,
                      "status": zr.status_code,
                      "bytes": len(zr.content),
                      "final_host": requests.utils.urlparse(zr.url).hostname,
                      "body_prefix": (
                          zr.content[:160].decode("utf-8", errors="replace")
                          if zr.status_code != 200 else None
                      ),
                  })
                  if zr.status_code == 200 and zr.content.startswith(b"PK"):
                      zip_bytes = zr.content
                      break
              out["sample_download_attempts"] = attempts
              if zip_bytes is None:
                  fail("sample zip dlink returned no downloadable ZIP under public-client UAs")
              out["sample_download_http_status"] = 200
              out["sample_download_bytes"] = len(zip_bytes)
              open(zip_name, "wb").write(zip_bytes)
              out["sample_zip_sha256"] = hashlib.sha256(zip_bytes).hexdigest()

              with zipfile.ZipFile(io.BytesIO(zip_bytes), "r") as zf:
                  names = zf.namelist()
                  out["sample_zip_members"] = names
                  candidates = [n for n in names if n.endswith(parquet_name)]
                  if len(candidates) != 1:
                      fail(f"expected one {parquet_name} in zip; got {candidates}")
                  parquet_bytes = zf.read(candidates[0])
              open(parquet_name, "wb").write(parquet_bytes)
              out["sample_parquet_sha256"] = hashlib.sha256(parquet_bytes).hexdigest()
              out["sample_parquet_bytes"] = len(parquet_bytes)

              df = pd.read_parquet(io.BytesIO(parquet_bytes))
              out["sample_row_count"] = int(len(df))
              out["sample_columns"] = [str(c) for c in df.columns]
              missing_cols = [c for c in compare_fields if c not in df.columns]
              out["missing_compare_fields"] = missing_cols
              if missing_cols:
                  fail(f"sample missing compare fields: {missing_cols}")

              # Normalize identifiers.
              df = df.copy()
              df["ts_code"] = df["ts_code"].astype(str)
              df["trade_date"] = df["trade_date"].astype(str).str.replace(".0", "", regex=False).str.zfill(8)
              dates = sorted(set(df["trade_date"].tolist()))
              out["sample_trade_dates"] = dates
              out["sample_unique_years"] = sorted(set(d[:4] for d in dates))
              out["sample_unique_dates"] = len(dates)

              def dec(v):
                  if pd.isna(v):
                      return None
                  s = str(v).strip()
                  if s == "":
                      return None
                  try:
                      return Decimal(s)
                  except InvalidOperation:
                      fail(f"non-decimal numeric value: {s}")

              jessica_by_key = {}
              source_files = []
              missing_jessica_dates = []
              for d in dates:
                  url = f"{jessica_base}/{d}.csv"
                  rr = requests.get(url, timeout=30)
                  if rr.status_code != 200:
                      missing_jessica_dates.append({"trade_date": d, "http_status": rr.status_code})
                      continue
                  raw = rr.content
                  source_files.append({
                      "trade_date": d,
                      "url": url,
                      "bytes": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                  })
                  jd = pd.read_csv(io.BytesIO(raw), dtype={"ts_code": str, "trade_date": str})
                  jd["trade_date"] = jd["trade_date"].astype(str).str.replace(".0", "", regex=False).str.zfill(8)
                  for _, row in jd.iterrows():
                      jessica_by_key[(str(row["ts_code"]), str(row["trade_date"]))] = row

              mismatch = []
              absent = []
              matched = 0
              for _, row in df.iterrows():
                  key = (str(row["ts_code"]), str(row["trade_date"]))
                  jr = jessica_by_key.get(key)
                  if jr is None:
                      absent.append({"ts_code": key[0], "trade_date": key[1]})
                      continue
                  diffs = {}
                  for c in compare_fields:
                      if c in ("ts_code", "trade_date"):
                          a, b = str(row[c]), str(jr[c])
                          if a != b:
                              diffs[c] = {"sample": a, "jessica": b}
                      else:
                          a, b = dec(row[c]), dec(jr[c])
                          if a != b:
                              diffs[c] = {
                                  "sample": None if a is None else str(a),
                                  "jessica": None if b is None else str(b),
                              }
                  if diffs:
                      mismatch.append({
                          "ts_code": key[0], "trade_date": key[1], "diffs": diffs
                      })
                  else:
                      matched += 1

              overlap_count = matched + len(mismatch)
              out["jessica_source_files"] = source_files
              out["jessica_missing_dates"] = missing_jessica_dates
              out["overlap_rows"] = overlap_count
              out["exact_match_rows"] = matched
              out["mismatch_rows"] = len(mismatch)
              out["sample_rows_absent_from_jessica"] = absent
              out["mismatch_examples"] = mismatch[:10]
              out["exact_match_rate"] = (
                  str(Decimal(matched) / Decimal(overlap_count))
                  if overlap_count else None
              )
              out["sample_exact_match_pass"] = (
                  overlap_count > 0 and len(mismatch) == 0
              )
              out["purchase_candidate_validated"] = bool(out["sample_exact_match_pass"])
              out["status"] = (
                  "PURCHASE_CANDIDATE_VALIDATED"
                  if out["purchase_candidate_validated"]
                  else "PUBLIC_SAMPLE_RETRIEVED_IDENTITY_NOT_PASSED"
              )
          except Exception as e:
              out["status"] = "PRECHECK_EXCEPTION"
              out["error"] = f"{type(e).__name__}: {e}"

          canon = json.dumps(out, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          out["content_sha256_without_hash_field"] = hashlib.sha256(canon.encode()).hexdigest()
          with open("dao2_a_paywalled_sample_precheck_v1.json","w",encoding="utf-8") as f:
              json.dump(out,f,ensure_ascii=False,indent=2,sort_keys=True); f.write("\n")
          print(json.dumps({
              "status": out.get("status"),
              "verify_errno": out.get("verify_errno"),
              "tplconfig_errno": out.get("tplconfig_errno"),
              "list_errno": out.get("list_errno"),
              "sharedownload_errno": out.get("sharedownload_errno"),
              "captcha_required": out.get("captcha_required", False),
              "sample_download_bytes": out.get("sample_download_bytes"),
              "sample_row_count": out.get("sample_row_count"),
              "sample_unique_years": out.get("sample_unique_years"),
              "sample_unique_dates": out.get("sample_unique_dates"),
              "overlap_rows": out.get("overlap_rows"),
              "exact_match_rows": out.get("exact_match_rows"),
              "mismatch_rows": out.get("mismatch_rows"),
              "purchase_candidate_validated": out.get("purchase_candidate_validated"),
              "sample_zip_sha256": out.get("sample_zip_sha256"),
              "sample_parquet_sha256": out.get("sample_parquet_sha256"),
              "error": out.get("error"),
          }, ensure_ascii=False))
          PY

      - name: Upload precheck evidence
        uses: actions/upload-artifact@v4
        with:
          name: dao2-a-paywalled-sample-precheck-v1
          path: |
            dao2_a_paywalled_sample_precheck_v1.json
            moneyflow_sample.zip
            moneyflow__sample_50rows.parquet
          if-no-files-found: warn
          retention-days: 30
