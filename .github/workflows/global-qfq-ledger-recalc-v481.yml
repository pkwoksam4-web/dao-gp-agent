name: GP Global QFQ ledger recalc V481

on:
  push:
    branches:
      - gp/global-qfq-ledger-recalc-v481
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V4.81 global-ledger recalc unit tests
        run: |
          cd scripts
          python -m unittest -v test_recalc_global_qfq_from_ledger_v481.py
