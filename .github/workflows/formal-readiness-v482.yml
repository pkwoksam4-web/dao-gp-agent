name: GP V4.82 Formal Readiness

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/formal_readiness_v482.py'
      - 'scripts/test_formal_readiness_v482.py'
      - '.github/workflows/formal-readiness-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Formal readiness unit tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_formal_readiness_v482.py
