name: GP12 Turnover Residual Source Debug

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-baostock-002087-debug.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe runtime
        run: pip install -q baostock pandas pyarrow
      - name: Download pinned Sohu RAW evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-full-raw-v482-reaudit
          path: upstream/raw
          run-id: 34192233633
          github-token: ${{ github.token }}
          repository: pkwoksam4-web/dao-gp-agent
      - name: Infer residual turnover denominators
        run: |
          python - <<'PY'
          import json, math
          import baostock as bs
          import pandas as pd

          panel_path='upstream/raw/SOHU_RAW_FULL_V482.parquet'
          full=pd.read_parquet(panel_path)
          print('SOHU_COLUMNS',list(full.columns))
          target_symbols=['300216.SZ','002604.SZ']
          wanted=['symbol','date']+[c for c in ['open','high','low','close','volume','amount'] if c in full.columns]
          target=full[full['symbol'].isin(target_symbols)][wanted].copy()
          print('SOHU_TARGET_ROWS')
          print(target.to_json(orient='records',date_format='iso',force_ascii=False))

          targets={
              '300216.SZ':('sz.300216',291684518,297447027),
              '002604.SZ':('sz.002604',512281847,453618223),
          }
          lg=bs.login()
          print('LOGIN',lg.error_code,lg.error_msg)
          try:
              for symbol,(code,denom_a,denom_b) in targets.items():
                  rs=bs.query_history_k_data_plus(
                      code,
                      'date,code,volume,amount,turn,tradestatus',
                      start_date='2020-06-01',
                      end_date='2020-09-30',
                      frequency='d',
                      adjustflag='3',
                  )
                  rows=[]
                  while rs.next():
                      r=dict(zip(rs.fields,rs.get_row_data()))
                      if r.get('tradestatus')!='1':
                          continue
                      vol=float(r['volume']) if r.get('volume') else float('nan')
                      amount=float(r['amount']) if r.get('amount') else float('nan')
                      turn_pct=float(r['turn']) if r.get('turn') else float('nan')
                      implied=vol/(turn_pct/100.0) if math.isfinite(turn_pct) and turn_pct>0 else None
                      row={
                          'date':r['date'],
                          'volume':vol,
                          'amount':amount,
                          'turn_pct':turn_pct,
                          'implied_shares':implied,
                          'ratio_using_denom_a':vol/denom_a if math.isfinite(vol) and denom_a>0 else None,
                          'ratio_using_denom_b':vol/denom_b if math.isfinite(vol) and denom_b>0 else None,
                      }
                      if implied is not None:
                          row['rel_err_denom_a']=abs(implied-denom_a)/denom_a
                          row['rel_err_denom_b']=abs(implied-denom_b)/denom_b
                      rows.append(row)
                  print('BAOSTOCK',symbol,'QUERY',rs.error_code,rs.error_msg,'ROWS',len(rows))
                  print(json.dumps(rows,ensure_ascii=False,indent=2))
          finally:
              bs.logout()
          PY
