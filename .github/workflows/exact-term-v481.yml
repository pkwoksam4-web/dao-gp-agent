name: GP Exact Term V481

on:
  push:
    branches:
      - gp/exact-term-v481
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V4.81 exact-term resolver tests
        run: |
          cd scripts
          python -m unittest -v test_cninfo_exact_term_v481.py test_cninfo_effective_terms_v481.py

  probe-cninfo-controls:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe four CNINFO exact-term controls
        run: python scripts/probe_cninfo_exact_term_controls_v481.py
      - name: Upload CNINFO control evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-cninfo-exact-term-controls-v481
          path: artifact_cninfo_exact_term_controls_v481/
          if-no-files-found: error
          retention-days: 30

  collect-standard-87-index:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official V4.81 847 missing-event closure checkpoint
        uses: actions/download-artifact@v4
        with:
          name: gp-global-qfq-missing-event-closure-v481
          path: closure847
          run-id: 34078398130
          github-token: ${{ github.token }}
      - name: Collect CNINFO implementation-announcement index for standard 87
        run: |
          python scripts/collect_cninfo_exact_term_indices_v481.py \
            --closure-dir closure847 \
            --out-dir artifact_cninfo_standard87_index_v481 \
            --workers 3
      - name: Upload standard-87 CNINFO index evidence before completeness guard
        uses: actions/upload-artifact@v4
        with:
          name: gp-cninfo-standard87-index-v481
          path: artifact_cninfo_standard87_index_v481/
          if-no-files-found: error
          retention-days: 30
      - name: Verify census scope and remain non-Formal
        run: |
          python - <<'PY'
          import json
          p='artifact_cninfo_standard87_index_v481/CNINFO_STANDARD_EXACT_TERM_INDEX_V481.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['scope_symbol_n']==87
          assert len(x['records'])==87
          assert len({r['symbol'] for r in x['records']})==87
          assert x['formal_promotion'] is False
          assert x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False
          assert x['oos_metrics_allowed'] is False
          print(json.dumps({k:x[k] for k in ['scope_symbol_n','query_ok_n','query_error_n','event_date_n','matched_event_n','symbols_all_events_matched_n','status_counts']},ensure_ascii=False,indent=2))
          PY
