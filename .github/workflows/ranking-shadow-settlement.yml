name: Ranking Shadow Settlement

on:
  workflow_run:
    workflows: ["Live PIT Manifest Ingest"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - "scripts/ranking_shadow_settlement.py"
      - ".github/workflows/ranking-shadow-settlement.yml"

permissions:
  contents: read

jobs:
  settle:
    # Hard-disabled while PR #27 and owner authorization are unresolved.
    # Re-enable only after the full authoritative preflight is bound and passes.
    if: ${{ false }}
    environment: pit-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Enforce owner authorization kill switch
        shell: bash
        env:
          PIT_WRITE_AUTHORIZATION: ${{ vars.PIT_WRITE_AUTHORIZATION }}
        run: |
          test "$PIT_WRITE_AUTHORIZATION" = "APPROVED" || {
            echo "::error::PIT production writes are not authorized"
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Run ranking Shadow settlement
        env:
          NEON_DATABASE_URL: ${{ secrets.PIT_WRITER_DATABASE_URL }}
        run: python scripts/ranking_shadow_settlement.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-shadow-settlement-${{ github.run_id }}
          path: artifacts/ranking-settlement-report.json
          if-no-files-found: warn
          retention-days: 30
