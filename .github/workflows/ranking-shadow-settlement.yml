name: Ranking Shadow Settlement

on:
  workflow_run:
    workflows: ["Live PIT Manifest Ingest"]
    types: [completed]
  workflow_dispatch:
  push:
    paths:
      - "scripts/ranking_shadow_settlement.py"
      - ".github/workflows/ranking-shadow-settlement.yml"

permissions:
  contents: read

jobs:
  settle:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - run: python scripts/ranking_shadow_settlement.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-shadow-settlement-${{ github.run_id }}
          path: artifacts/ranking-settlement-report.json
          if-no-files-found: warn
          retention-days: 30
