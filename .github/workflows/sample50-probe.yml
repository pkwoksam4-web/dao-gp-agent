name: Sample50 corporate-action probe

on:
  workflow_dispatch:
  push:
    branches:
      - sample50-batch-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 300592 sources
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          OUT = "artifact"
          os.makedirs(OUT, exist_ok=True)
          UA = "Mozilla/5.0"

          def save_bytes(name, body):
              path = os.path.join(OUT, name)
              with open(path, "wb") as f:
                  f.write(body)
              return hashlib.sha256(body).hexdigest()

          def fetch(name, url, params=None, headers=None):
              if params:
                  url = url + ("&" if "?" in url else "?") + urllib.parse.urlencode(params)
              req_headers = {"User-Agent": UA}
              if headers:
                  req_headers.update(headers)
              meta = {"url": url, "status": None, "content_type": None, "error": None}
              body = b""
              try:
                  req = urllib.request.Request(url, headers=req_headers)
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      meta["status"] = int(resp.status)
                      meta["content_type"] = resp.headers.get("Content-Type")
              except Exception as e:
                  meta["error"] = f"{type(e).__name__}: {e}"
                  if hasattr(e, "code"):
                      meta["status"] = int(e.code)
                  try:
                      body = e.read()
                  except Exception:
                      pass
              meta["bytes"] = len(body)
              meta["sha256"] = save_bytes(name, body)
              return meta, body

          summary = {
              "probe": "SAMPLE50_SOURCE_SEMANTICS_300592",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "symbol": "300592.SZ",
              "sources": {},
          }

          # 1) Corporate actions: Eastmoney datacenter.
          div_params = {
              "reportName": "RPT_SHAREBONUS_DET",
              "columns": "ALL",
              "filter": '(SECURITY_CODE="300592")',
              "pageNumber": "1",
              "pageSize": "200",
              "sortColumns": "EX_DIVIDEND_DATE",
              "sortTypes": "-1",
              "source": "WEB",
              "client": "WEB",
          }
          div_meta, div_body = fetch(
              "eastmoney_sharebonus_300592.json",
              "https://datacenter-web.eastmoney.com/api/data/v1/get",
              div_params,
              {"Referer": "https://data.eastmoney.com/"},
          )
          summary["sources"]["eastmoney_sharebonus"] = div_meta
          try:
              d = json.loads(div_body.decode("utf-8"))
              rows = ((d.get("result") or {}).get("data") or [])
              summary["eastmoney_sharebonus_rows"] = len(rows)
              summary["eastmoney_sharebonus_keys"] = sorted(rows[0].keys()) if rows else []
              summary["eastmoney_2024_05_21"] = [
                  r for r in rows if str(r.get("EX_DIVIDEND_DATE") or "").startswith("2024-05-21")
              ]
          except Exception as e:
              summary["eastmoney_sharebonus_parse_error"] = f"{type(e).__name__}: {e}"

          # 2) Eastmoney RAW control (known push2his may block cloud runners).
          k_params = {
              "secid": "0.300592",
              "fields1": "f1,f2,f3,f4,f5,f6",
              "fields2": "f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61",
              "klt": "101",
              "fqt": "0",
              "beg": "20240501",
              "end": "20240531",
              "ut": "fa5fd1943c7b386f172d6893dbfba10b",
          }
          k_meta, k_body = fetch(
              "eastmoney_raw_300592_202405.json",
              "https://push2his.eastmoney.com/api/qt/stock/kline/get",
              k_params,
              {"Referer": "https://quote.eastmoney.com/"},
          )
          summary["sources"]["eastmoney_raw"] = k_meta

          # 3) Sina unadjusted daily OHLC candidate for P_prev.
          sina_raw_meta, sina_raw_body = fetch(
              "sina_raw_300592.json",
              "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData",
              {"symbol": "sz300592", "scale": "240", "ma": "no", "datalen": "2000"},
              {"Referer": "https://finance.sina.com.cn/"},
          )
          summary["sources"]["sina_raw"] = sina_raw_meta
          try:
              raw_text = sina_raw_body.decode("utf-8", errors="replace").strip()
              if raw_text.startswith("var") and "=" in raw_text:
                  raw_text = raw_text.split("=", 1)[1].rstrip(";\n ")
              raw_rows = json.loads(raw_text)
              summary["sina_raw_rows"] = len(raw_rows) if isinstance(raw_rows, list) else None
              summary["sina_raw_around_event"] = [
                  r for r in (raw_rows if isinstance(raw_rows, list) else [])
                  if str(r.get("day") or "").startswith(("2024-05-20", "2024-05-21", "2024-05-22"))
              ]
          except Exception as e:
              summary["sina_raw_parse_error"] = f"{type(e).__name__}: {e}"

          # 4) Tencent forward-adjusted daily OHLC candidate for independent validation.
          tx_meta, tx_body = fetch(
              "tencent_qfq_300592.json",
              "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get",
              {"param": "sz300592,day,,,2000,qfq"},
              {"Referer": "https://gu.qq.com/"},
          )
          summary["sources"]["tencent_qfq"] = tx_meta
          try:
              tx = json.loads(tx_body.decode("utf-8", errors="replace"))
              stock = ((tx.get("data") or {}).get("sz300592") or {})
              rows = stock.get("qfqday") or stock.get("day") or []
              summary["tencent_qfq_rows"] = len(rows)
              summary["tencent_qfq_around_event"] = [
                  r for r in rows if r and str(r[0]).startswith(("2024-05-20", "2024-05-21", "2024-05-22"))
              ]
              summary["tencent_keys"] = sorted(stock.keys())
          except Exception as e:
              summary["tencent_qfq_parse_error"] = f"{type(e).__name__}: {e}"

          # 5) Sina divisor evidence, already independently validated in V4.76.
          sina_meta, sina_body = fetch(
              "sina_qfq_300592.js",
              "https://finance.sina.com.cn/realstock/company/sz300592/qfq.js",
              headers={"Referer": "https://finance.sina.com.cn/"},
          )
          summary["sources"]["sina_qfq"] = sina_meta
          try:
              text = sina_body.decode("utf-8", errors="replace")
              summary["sina_qfq_prefix"] = text[:120]
          except Exception as e:
              summary["sina_qfq_parse_error"] = f"{type(e).__name__}: {e}"

          with open(os.path.join(OUT, "summary.json"), "w", encoding="utf-8") as f:
              json.dump(summary, f, ensure_ascii=False, indent=2, sort_keys=True)

          print(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True))
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample50-source-probe-300592
          path: artifact/
          if-no-files-found: error
