name: Sample50 Eastmoney field probe

on:
  workflow_dispatch:
  push:
    branches: [sample50-probe]
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Eastmoney corporate-action and raw-price endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import hashlib, json, pathlib, urllib.parse, urllib.request, traceback
          from datetime import datetime, timezone

          OUT = pathlib.Path('artifact')
          UA = 'Mozilla/5.0'

          def fetch_json(name, base, params, referer):
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': UA, 'Referer': referer})
              record = {'name': name, 'url': url, 'timestamp_utc': datetime.now(timezone.utc).isoformat()}
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read()
                      record.update({'http_status': r.status, 'content_type': r.headers.get('Content-Type'), 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest()})
                  (OUT / f'{name}.raw').write_bytes(body)
                  data = json.loads(body.decode('utf-8-sig'))
                  (OUT / f'{name}.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
                  result = data.get('result') if isinstance(data, dict) else None
                  rows = result.get('data') if isinstance(result, dict) else None
                  record['success'] = bool(data.get('success', True)) if isinstance(data, dict) else False
                  record['message'] = data.get('message') if isinstance(data, dict) else None
                  record['row_count'] = len(rows) if isinstance(rows, list) else 0
                  record['row_keys'] = sorted({k for row in (rows or []) if isinstance(row, dict) for k in row})
                  record['sample_rows'] = (rows or [])[:3]
              except Exception as e:
                  record.update({'success': False, 'error_type': type(e).__name__, 'error': str(e), 'traceback': traceback.format_exc()})
              return record

          summary = {'symbol': '300592.SZ', 'probe_version': 'SAMPLE50_FIELD_PROBE_V1', 'results': []}

          summary['results'].append(fetch_json(
              'sharebonus_300592',
              'https://datacenter-web.eastmoney.com/api/data/v1/get',
              {
                  'reportName': 'RPT_SHAREBONUS_DET', 'columns': 'ALL',
                  'filter': '(SECURITY_CODE="300592")', 'pageNumber': '1', 'pageSize': '100',
                  'sortColumns': 'EX_DIVIDEND_DATE', 'sortTypes': '-1', 'source': 'WEB', 'client': 'WEB'
              },
              'https://data.eastmoney.com/yjfp/detail/300592.html'
          ))

          summary['results'].append(fetch_json(
              'rights_300592',
              'https://datacenter-web.eastmoney.com/api/data/v1/get',
              {
                  'reportName': 'RPT_IPO_ALLOTMENT', 'columns': 'ALL',
                  'filter': '(SECURITY_CODE="300592")', 'pageNumber': '1', 'pageSize': '100',
                  'sortColumns': 'EQUITY_RECORD_DATE', 'sortTypes': '-1', 'source': 'WEB', 'client': 'WEB'
              },
              'https://data.eastmoney.com/xg/pg/'
          ))

          summary['results'].append(fetch_json(
              'raw_kline_300592',
              'https://push2his.eastmoney.com/api/qt/stock/kline/get',
              {
                  'secid': '0.300592', 'klt': '101', 'fqt': '0',
                  'beg': '20240515', 'end': '20250720', 'lmt': '1000',
                  'fields1': 'f1,f2,f3,f4,f5,f6',
                  'fields2': 'f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61'
              },
              'https://quote.eastmoney.com/sz300592.html'
          ))

          (OUT / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample50-eastmoney-probe
          path: artifact/
          if-no-files-found: error
