name: GP12 Main Net Flow Tinyshare Secret Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-tinyshare-secret-probe-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TINYSHARE_TOKEN: ${{ secrets.TINYSHARE_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check credential gate
        shell: bash
        run: |
          if [ -z "$TINYSHARE_TOKEN" ]; then
            echo "TINYSHARE_SECRET_STATUS=MISSING"
            exit 2
          fi
          echo "TINYSHARE_SECRET_STATUS=PRESENT"
      - name: Install Tinyshare client
        run: pip install -q tinyshare pandas
      - name: Query 16 exact residual keys
        run: |
          python - <<'PY'
          import json, os
          import tinyshare as ts

          targets = [
            ("600306.SH","20200608"), ("600898.SH","20201104"),
            ("603996.SH","20210224"), ("002618.SZ","20210923"),
            ("000020.SZ","20210924"), ("000157.SZ","20210924"),
            ("000592.SZ","20210924"), ("000753.SZ","20210924"),
            ("002684.SZ","20211125"), ("600112.SH","20220506"),
            ("000564.SZ","20230320"), ("001337.SZ","20230320"),
            ("002118.SZ","20230522"), ("002157.SZ","20230522"),
            ("002503.SZ","20230522"), ("002504.SZ","20230522"),
          ]
          ts.set_token(os.environ["TINYSHARE_TOKEN"])
          pro = ts.pro_api()
          out = []
          fields = "ts_code,trade_date,buy_lg_amount,sell_lg_amount,buy_elg_amount,sell_elg_amount"
          for code, day in targets:
              df = pro.moneyflow(ts_code=code, trade_date=day, fields=fields)
              if df is None or df.empty:
                  out.append({"ts_code": code, "trade_date": day, "status": "MISSING"})
                  continue
              row = df.iloc[0]
              vals = {k: float(row[k]) for k in ("buy_lg_amount","sell_lg_amount","buy_elg_amount","sell_elg_amount")}
              main = (vals["buy_lg_amount"] + vals["buy_elg_amount"] - vals["sell_lg_amount"] - vals["sell_elg_amount"]) * 10000.0
              out.append({"ts_code": code, "trade_date": day, "status": "FOUND",
                          **vals, "main_net_flow_cny": main})
          found = sum(x["status"] == "FOUND" for x in out)
          print("RESULT=" + json.dumps(out, ensure_ascii=False, separators=(",",":")))
          print(f"FOUND_N={found}")
          if found != len(targets):
              raise RuntimeError(f"EXACT_RESIDUAL_RECOVERY_INCOMPLETE:{found}/{len(targets)}")
          print("PASS_TINYSHARE_EXACT_RESIDUAL_RECOVERY_16_OF_16")
          PY
