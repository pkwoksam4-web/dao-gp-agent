name: PIT Gap Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/pit_gap_recovery.py"
      - ".github/workflows/pit-gap-recovery.yml"
      - "recovery/manifests/2026-09-25-core13-pit-gap-recovery.json"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Validate secret
        shell: bash
        run: |
          test -n "${NEON_DATABASE_URL:-}" || { echo "::error::NEON_DATABASE_URL missing"; exit 1; }
      - name: Apply non-live PIT gap recovery
        run: python scripts/pit_gap_recovery.py
      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-gap-recovery-${{ github.run_id }}
          path: artifacts/pit-gap-recovery-report.json
          if-no-files-found: warn
          retention-days: 30
