name: GP12 BaoStock Turnover V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/gp12_baostock_turnover_v1.py'
      - 'scripts/test_gp12_baostock_turnover_v1.py'
      - 'data/GP12_CANDIDATE_TURNOVER_RESIDUAL_DENOMINATORS_V1.json'
      - '.github/workflows/gp12-baostock-turnover-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: BaoStock turnover candidate contract tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_gp12_baostock_turnover_v1.py

  turnover-shards:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BaoStock audit runtime
        run: pip install -q baostock pandas pyarrow
      - name: Download pinned Sohu RAW date and amount evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-full-raw-v482-reaudit
          path: upstream/raw
          run-id: 34192233633
          github-token: ${{ github.token }}
      - name: Verify pinned RAW amount/date evidence and residual binding
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import gp12_baostock_turnover_v1 as turnover

          audit = Path('upstream/raw/SOHU_RAW_FULL_AUDIT_V482.json')
          panel = Path('upstream/raw/SOHU_RAW_FULL_V482.parquet')
          binding_path = Path('data/GP12_CANDIDATE_TURNOVER_RESIDUAL_DENOMINATORS_V1.json')
          assert audit.exists(), audit
          assert panel.exists(), panel
          assert binding_path.exists(), binding_path
          x = json.loads(audit.read_text(encoding='utf-8'))
          assert x['artifact'] == 'SOHU_RAW_FULL_V482'
          assert x['version'] == 'V4.82'
          assert x['status'] == 'PASS_FULL_RAW_V482'
          assert x['symbol_n'] == 847
          assert x['raw_rows'] == 1011607
          assert x['expected_trade_rows'] == 1011607
          assert x['duplicate_symbol_dates'] == 0
          assert x['missing_trade_dates_n'] == 0
          assert x['extra_trade_dates_n'] == 0
          assert x['bad_amount_rows'] == 0
          assert x['zero_trade_symbols'] == ['600074.SH','600485.SH','600677.SH']
          assert x['global_reaudit_pass'] is True
          assert x['formal_admission'] is False
          assert x['oos_metrics_allowed'] is False
          binding = json.loads(binding_path.read_text(encoding='utf-8'))
          index = turnover.validate_residual_denominator_binding(binding)
          assert set(index) == {'300216.SZ','002604.SZ'}
          assert index['300216.SZ']['floating_shares'] == 291684518
          assert index['002604.SZ']['floating_shares'] == 512281847
          print('residual_binding_sha256', turnover._canonical_json_sha256(binding))
          PY
      - name: Audit and materialize BaoStock turnover shard
        id: audit
        continue-on-error: true
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p out/turnover-${{ matrix.shard }}
          python scripts/gp12_baostock_turnover_v1.py shard \
            --scope data/pit_st_scope_v480.txt \
            --raw-parquet upstream/raw/SOHU_RAW_FULL_V482.parquet \
            --residual-denominators data/GP12_CANDIDATE_TURNOVER_RESIDUAL_DENOMINATORS_V1.json \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --out out/turnover-${{ matrix.shard }}/BAOSTOCK_TURNOVER_SHARD_${{ matrix.shard }}.json \
            --data-out out/turnover-${{ matrix.shard }}/BAOSTOCK_TURNOVER_SHARD_${{ matrix.shard }}.csv
      - name: Upload BaoStock turnover shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-baostock-turnover-shard-${{ matrix.shard }}
          path: out/turnover-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 30

  turnover-aggregate:
    needs: turnover-shards
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all BaoStock turnover shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: gp12-baostock-turnover-shard-*
          path: out/shards
          merge-multiple: true
      - name: Aggregate exact Formal844 turnover audit and panel
        id: aggregate
        continue-on-error: true
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p out/full
          python scripts/gp12_baostock_turnover_v1.py aggregate \
            --shard-dir out/shards \
            --out out/full/GP12_BAOSTOCK_TURNOVER_FULL_AUDIT_V1.json \
            --data-out out/full/GP12_BAOSTOCK_TURNOVER_PANEL_V1.csv
      - name: Assert full turnover gate
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          audit = Path('out/full/GP12_BAOSTOCK_TURNOVER_FULL_AUDIT_V1.json')
          panel = Path('out/full/GP12_BAOSTOCK_TURNOVER_PANEL_V1.csv')
          assert audit.exists(), audit
          assert panel.exists(), panel
          x = json.loads(audit.read_text(encoding='utf-8'))
          assert x['artifact'] == 'GP12_BAOSTOCK_TURNOVER_FULL_AUDIT_V1'
          assert x['version'] == '1.0'
          assert x['formal_window'] == ['2020-06-01','2026-04-17']
          assert x['universe_n'] == 847
          assert x['formal_symbol_n'] == 844
          assert x['na_symbols'] == ['600074.SH','600485.SH','600677.SH']
          assert x['pass_n'] == 844
          assert x['fail_n'] == 0
          assert x['expected_trade_rows'] == 1011607
          assert x['observed_turnover_rows'] == 1011607
          assert x['materialized_rows'] == 1011607
          assert x['provider_status_override_n'] == 5
          assert x['provider_status_override_symbol_n'] == 5
          assert x['turnover_precision_reconstruction_n'] > 0
          assert x['turnover_precision_reconstruction_symbol_n'] == 2
          assert {r['symbol'] for r in x['turnover_precision_reconstructions']} == {'300216.SZ','002604.SZ'}
          assert x['residual_denominator_binding_artifact'] == 'GP12_CANDIDATE_TURNOVER_RESIDUAL_DENOMINATORS_V1'
          assert re.fullmatch(r'[0-9a-f]{64}', x['residual_denominator_binding_sha256'])
          assert x['panel_complete'] is True
          assert x['turnover_ratio_candidate_pit_verified'] is True
          p = x['provider']
          assert p['provider'] == 'BaoStock'
          assert p['field'] == 'turn'
          assert p['source_unit'] == 'percent'
          assert p['candidate_unit'] == 'decimal_ratio'
          assert p['frequency'] == 'd'
          assert p['adjustflag'] == '3'
          assert p['origin'] == 'NEW_RECONSTRUCTION_CANDIDATE'
          assert p['status'] == 'CANDIDATE_ONLY_UNAPPROVED'
          assert p['historical_gp_v11_source_recovered'] is False
          assert p['historical_provider_publication_timestamp_proven'] is False
          assert x['same_session_turnover_usable_before_close'] is False
          assert x['historical_provider_publication_timestamp_proven'] is False
          assert x['historical_gp_v11_source_recovered'] is False
          assert x['model_freeze_allowed'] is False
          assert x['oos_metrics_allowed'] is False
          assert x['blockers'] == []
          assert re.fullmatch(r'[0-9a-f]{64}', x['panel_csv_sha256'])
          print(json.dumps({
              'formal_symbol_n': x['formal_symbol_n'],
              'pass_n': x['pass_n'],
              'fail_n': x['fail_n'],
              'expected_trade_rows': x['expected_trade_rows'],
              'observed_turnover_rows': x['observed_turnover_rows'],
              'materialized_rows': x['materialized_rows'],
              'provider_status_override_n': x['provider_status_override_n'],
              'turnover_precision_reconstruction_n': x['turnover_precision_reconstruction_n'],
              'residual_denominator_binding_sha256': x['residual_denominator_binding_sha256'],
              'panel_csv_sha256': x['panel_csv_sha256'],
              'turnover_ratio_candidate_pit_verified': x['turnover_ratio_candidate_pit_verified'],
              'blockers': x['blockers'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload full BaoStock turnover audit and panel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-baostock-turnover-full-v1
          path: out/full/
          if-no-files-found: error
          retention-days: 30
