name: GP12 BaoStock Turnover V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/gp12_baostock_turnover_v1.py'
      - 'scripts/test_gp12_baostock_turnover_v1.py'
      - '.github/workflows/gp12-baostock-turnover-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: BaoStock turnover candidate contract tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_gp12_baostock_turnover_v1.py
