name: Core13 2026-09-29 Non-Live Recovery

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/core13_nonlive_0929_recovery.py"
      - "recovery/manifests/2026-09-30-core13-20260929-nonlive.json"
      - ".github/workflows/core13-0929-nonlive-recovery.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - name: Validate secret
        shell: bash
        run: |
          test -n "${NEON_DATABASE_URL:-}" || { echo "::error::NEON_DATABASE_URL missing"; exit 1; }
      - name: Apply guarded 2026-09-29 Core13 non-live recovery
        run: python scripts/core13_nonlive_0929_recovery.py
      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core13-0929-nonlive-recovery-${{ github.run_id }}
          path: artifacts/core13-0929-nonlive-recovery.json
          if-no-files-found: warn
          retention-days: 30
