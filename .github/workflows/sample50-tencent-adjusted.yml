name: Sample50 Tencent adjusted OHLC collector

on:
  workflow_dispatch:
  push:
    branches: [sample50-probe]

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Fetch Tencent QFQ adjusted OHLC for frozen Sample50
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          python - <<'PY'
          import hashlib, json, pathlib, time, traceback, urllib.parse, urllib.request
          from datetime import datetime, timezone

          OUT = pathlib.Path('artifact')
          SYMBOLS = [
              '600737.SH','002646.SZ','300465.SZ','002003.SZ','688200.SH','688125.SH','601162.SH','605068.SH','300152.SZ','002236.SZ',
              '300827.SZ','600232.SH','300633.SZ','002318.SZ','600249.SH','300561.SZ','300246.SZ','603323.SH','300687.SZ','600386.SH',
              '300775.SZ','002016.SZ','002627.SZ','600629.SH','002938.SZ','603583.SH','603901.SH','002662.SZ','600594.SH','300434.SZ',
              '601225.SH','600592.SH','603170.SH','002001.SZ','300565.SZ','002693.SZ','600131.SH','300864.SZ','603123.SH','002230.SZ',
              '002069.SZ','688277.SH','301327.SZ','002158.SZ','688455.SH','002658.SZ','601890.SH','605365.SH','600641.SH','600377.SH'
          ]
          WINDOWS = [
              ('2020-06-01','2020-12-31'),
              ('2021-01-01','2021-12-31'),
              ('2022-01-01','2022-12-31'),
              ('2023-01-01','2023-12-31'),
              ('2024-01-01','2024-12-31'),
              ('2025-01-01','2025-12-31'),
              ('2026-01-01','2026-04-17')
          ]
          UA='Mozilla/5.0'

          def tsymbol(sym):
              code, ex = sym.split('.')
              return ('sh' if ex == 'SH' else 'sz') + code

          def fetch(url, retries=3):
              last=None
              for attempt in range(1,retries+1):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Referer':'https://gu.qq.com/'})
                      with urllib.request.urlopen(req,timeout=25) as r:
                          b=r.read()
                          return {'ok':True,'status':r.status,'content_type':r.headers.get('Content-Type'),'body':b,'attempt':attempt}
                  except Exception as e:
                      last={'ok':False,'error_type':type(e).__name__,'error':str(e),'traceback':traceback.format_exc(),'body':b'','attempt':attempt}
                      time.sleep(0.5*attempt)
              return last

          manifest={
              'artifact':'SAMPLE50_TENCENT_QFQ_ADJUSTED_V1',
              'created_at_utc':datetime.now(timezone.utc).isoformat(),
              'formal_window':['2020-06-01','2026-04-17'],
              'sample_n':50,
              'provider':'Tencent ifzq fqkline qfq',
              'symbols':[]
          }

          for idx,sym in enumerate(SYMBOLS,1):
              ts=tsymbol(sym)
              sdir=OUT/sym
              sdir.mkdir(parents=True,exist_ok=True)
              all_rows={}
              windows=[]
              for wi,(start,end) in enumerate(WINDOWS,1):
                  param=f'{ts},day,{start},{end},2000,qfq'
                  url='https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?'+urllib.parse.urlencode({'param':param})
                  got=fetch(url)
                  body=got.pop('body',b'')
                  (sdir/f'{wi:02d}_{start}_{end}.json').write_bytes(body)
                  rec=dict(got)
                  rec.update({'start':start,'end':end,'url':url,'bytes':len(body),'sha256':hashlib.sha256(body).hexdigest()})
                  if got.get('ok'):
                      try:
                          d=json.loads(body.decode('utf-8-sig'))
                          data=d.get('data',{}).get(ts,{}) if isinstance(d,dict) else {}
                          rows=data.get('qfqday') or data.get('day') or []
                          rec['parse_ok']=True
                          rec['row_count']=len(rows)
                          for row in rows:
                              if isinstance(row,list) and len(row)>=5:
                                  date=row[0]
                                  if '2020-06-01' <= date <= '2026-04-17':
                                      all_rows[date]=row
                      except Exception as e:
                          rec.update({'parse_ok':False,'parse_error':str(e)})
                  windows.append(rec)
                  time.sleep(0.12)
              ordered=[all_rows[d] for d in sorted(all_rows)]
              (sdir/'normalized.json').write_text(json.dumps(ordered,ensure_ascii=False,indent=2),encoding='utf-8')
              manifest['symbols'].append({
                  'sample_order':idx,'symbol':sym,'provider_symbol':ts,'windows':windows,
                  'normalized_row_count':len(ordered),
                  'first_date':ordered[0][0] if ordered else None,
                  'last_date':ordered[-1][0] if ordered else None,
                  'duplicate_dates_removed':sum((w.get('row_count',0) for w in windows))-len(ordered)
              })
              print(f'[{idx:02d}/50] {sym} rows={len(ordered)}',flush=True)

          manifest['summary']={
              'symbols_with_rows':sum(1 for s in manifest['symbols'] if s['normalized_row_count']>0),
              'all_windows_transport_ok':sum(1 for s in manifest['symbols'] if all(w.get('ok') for w in s['windows'])),
              'all_windows_parse_ok':sum(1 for s in manifest['symbols'] if all(w.get('parse_ok') for w in s['windows'])),
              'rows_total':sum(s['normalized_row_count'] for s in manifest['symbols'])
          }
          (OUT/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(manifest['summary'],ensure_ascii=False,indent=2))
          PY

      - name: Upload Tencent adjusted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sample50-tencent-qfq-adjusted
          path: artifact/
          if-no-files-found: error
          retention-days: 90
