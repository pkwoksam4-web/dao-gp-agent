name: GP12 Candidate Input Readiness V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/gp12_candidate_input_readiness_v1.py'
      - 'scripts/test_gp12_candidate_input_readiness_v1.py'
      - 'scripts/test_gp12_main_net_flow_readiness_requirement_v1.py'
      - 'scripts/test_gp12_status_partial_binding_v1.py'
      - 'scripts/test_gp12_market_breadth_binding_v1.py'
      - 'data/GP12_CANDIDATE_AMOUNT_TURNOVER_BINDING_V1.json'
      - 'data/GP12_MAIN_NET_FLOW_SOURCE_REQUIREMENT_V1.json'
      - 'data/GP12_CANDIDATE_STATUS_PARTIAL_BINDING_V1.json'
      - 'data/GP12_CANDIDATE_MARKET_BREADTH_BINDING_V1.json'
      - '.github/workflows/gp12-candidate-input-readiness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Candidate input readiness contract tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v \
            test_gp12_candidate_input_readiness_v1.py \
            test_gp12_main_net_flow_readiness_requirement_v1.py \
            test_gp12_status_partial_binding_v1.py \
            test_gp12_market_breadth_binding_v1.py

  checkpoint:
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned candidate benchmark validation
        uses: actions/download-artifact@v4
        with:
          name: gp12-candidate-benchmark-000985-v1
          path: benchmark
          run-id: 34940789265
          github-token: ${{ github.token }}
      - name: Build candidate input readiness checkpoint
        env:
          PYTHONPATH: scripts
        run: |
          mkdir -p artifact_gp12_candidate_input_readiness_v1
          python scripts/gp12_candidate_input_readiness_v1.py \
            --parameters data/GP12_CANDIDATE_PARAMETERS_V1.json \
            --factors data/GP12_CANDIDATE_FACTORS_V1.json \
            --base-evidence data/GP12_FORMAL_INPUT_EVIDENCE_V1.json \
            --intraday-binding data/GP12_INTRADAY_FORMAL847_BINDING_V1.json \
            --pit-binding data/GP12_PIT_ADJUSTED_CLOSE_BINDING_V1.json \
            --benchmark-validation benchmark/GP12_CANDIDATE_BENCHMARK_VALIDATION_V1.json \
            --amount-turnover-binding data/GP12_CANDIDATE_AMOUNT_TURNOVER_BINDING_V1.json \
            --main-net-flow-requirement data/GP12_MAIN_NET_FLOW_SOURCE_REQUIREMENT_V1.json \
            --status-partial-binding data/GP12_CANDIDATE_STATUS_PARTIAL_BINDING_V1.json \
            --out artifact_gp12_candidate_input_readiness_v1/GP12_CANDIDATE_INPUT_READINESS_V1.json
      - name: Assert verified closures and remaining blockers
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifact_gp12_candidate_input_readiness_v1/GP12_CANDIDATE_INPUT_READINESS_V1.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['artifact']=='GP12_CANDIDATE_INPUT_READINESS_V1'
          assert x['asset_hashes']['factor_definition_sha256']=='b52f394fb13417e6f0323f7175a50a7d950dba8af09f63a97e739c6a4c70160e'
          assert x['asset_hashes']['parameter_sha256']=='22f054d0068c2c1d7bed3c17e586eca1b22d7b3888547de36e6e754578ceb204'
          assert x['amount_turnover_binding_artifact']=='GP12_CANDIDATE_AMOUNT_TURNOVER_BINDING_V1'
          assert x['amount_turnover_binding_sha256']=='47b83c11b7190f4bb8f3bc69900f75fd682362ed5e20d6cbb3b9c4d7bdbe4998'
          assert x['main_net_flow_requirement_artifact']=='GP12_MAIN_NET_FLOW_SOURCE_REQUIREMENT_V1'
          assert x['main_net_flow_requirement_sha256']=='13577a123a506750d1070c91c96bb603aa727fb9f7826a5cb449efe39963fed3'
          assert x['status_partial_binding_artifact']=='GP12_CANDIDATE_STATUS_PARTIAL_BINDING_V1'
          assert x['status_partial_binding_sha256']=='e565742e9baaa37de5563aa9c51ff2a4a6b9166c1f1579945b865f69d909cb10'
          assert x['status_semantic_state']=={
              'is_st':'BOUND_PIT_VERIFIED',
              'tradable':'BOUND_PIT_VERIFIED',
              'upper_limit':'UNBOUND',
          }
          assert x['validated_families']==['amount_turnover','intraday_15m','intraday_60m','market_calendar','stock_adjusted_close']
          assert x['feature_families']['amount_turnover']['formal_feature_ready'] is True
          assert x['feature_families']['amount_turnover']['binding_state']=='BOUND_VERIFIED_ARTIFACT'
          assert x['feature_families']['amount_turnover']['pit_state']=='PIT_VERIFIED'
          assert x['feature_families']['amount_turnover']['blockers']==[]
          assert 'TURNOVER_RATIO_UNBOUND' not in x['blockers']
          assert x['feature_families']['main_net_flow']['formal_feature_ready'] is False
          assert x['feature_families']['main_net_flow']['binding_state']=='UNBOUND'
          assert x['feature_families']['main_net_flow']['pit_state']=='PIT_UNVERIFIED'
          assert x['feature_families']['main_net_flow']['blockers']==[
              'MAIN_NET_FLOW_UNBOUND',
              'TUSHARE_CREDENTIAL_REQUIRED',
              'MAIN_NET_FLOW_PANEL_NOT_MATERIALIZED',
          ]
          assert x['feature_families']['status']['formal_feature_ready'] is False
          assert x['feature_families']['status']['binding_state']=='BOUND_STRUCTURAL_ONLY'
          assert x['feature_families']['status']['pit_state']=='PIT_PARTIAL'
          assert x['feature_families']['status']['source_artifact']=='GP12_CANDIDATE_STATUS_PARTIAL_BINDING_V1'
          assert x['feature_families']['status']['source_sha256']=='e565742e9baaa37de5563aa9c51ff2a4a6b9166c1f1579945b865f69d909cb10'
          assert x['feature_families']['status']['blockers']==['STATUS_UPPER_LIMIT_UNBOUND']
          assert 'MAIN_NET_FLOW_UNBOUND' in x['blockers']
          assert 'TUSHARE_CREDENTIAL_REQUIRED' in x['blockers']
          assert 'MAIN_NET_FLOW_PANEL_NOT_MATERIALIZED' in x['blockers']
          assert 'STATUS_SEMANTICS_INCOMPLETE' not in x['blockers']
          assert 'STATUS_UPPER_LIMIT_UNBOUND' in x['blockers']
          assert x['ready_factor_ids']==['F6','F7','F8','F9','F10','F12']
          assert x['blocked_factor_ids']==['F1','F2','F3','F4','F5','F11']
          assert x['next_priority_family']=='main_net_flow'
          assert x['next_priority_blocker']=='MAIN_NET_FLOW_UNBOUND'
          assert x['candidate_benchmark_reference_validated'] is True
          assert x['benchmark_feature_binding_allowed'] is False
          assert x['market_adjusted_close_substitution_allowed'] is False
          assert x['historical_benchmark_recovered'] is False
          assert x['historical_strategy_recovered'] is False
          assert x['candidate_scoring_ready'] is False
          assert x['model_freeze_allowed'] is False
          assert x['oos_metrics_allowed'] is False
          assert x['adoption_blockers']==['NEW_STRATEGY_ADOPTION_REQUIRED']
          print(json.dumps({
              'validated_families': x['validated_families'],
              'ready_factor_ids': x['ready_factor_ids'],
              'blocked_factor_ids': x['blocked_factor_ids'],
              'status_semantic_state': x['status_semantic_state'],
              'blockers': x['blockers'],
              'next_priority_family': x['next_priority_family'],
              'main_net_flow_requirement_sha256': x['main_net_flow_requirement_sha256'],
              'status_partial_binding_sha256': x['status_partial_binding_sha256'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload candidate readiness checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-candidate-input-readiness-v1
          path: artifact_gp12_candidate_input_readiness_v1/
          if-no-files-found: error
          retention-days: 30
