name: GP12 Upper Limit Truth Crosscheck V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/gp12_upper_limit_rule_v1.py'
      - '.github/workflows/gp12-upper-limit-truth-crosscheck-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q pandas pyarrow

      - name: Download canonical partial high-limit truth
        uses: actions/download-artifact@v4
        with:
          name: gp12-status-upper-limit-truth-canonical-v1
          path: truth
          run-id: 35060927372
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Download pinned PIT-ST merged evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-merged
          path: pitst
          run-id: 33971534669
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Crosscheck rules without special-date overrides
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import pandas as pd
          import gp12_upper_limit_rule_v1 as rule

          CANON_SHA='d11b415b74d44d63d1aa927e8652f395dd039c28f6e1b4c24964e53759405308'
          def unique(root,name):
              hits=list(Path(root).rglob(name)); assert len(hits)==1,(root,name,hits); return hits[0]

          truth_path=unique('truth','HF_HIGH_LIMIT_FORMAL844_OVERLAP_CANONICAL.parquet')
          assert hashlib.sha256(truth_path.read_bytes()).hexdigest()==CANON_SHA
          truth=pd.read_parquet(truth_path)
          truth['symbol']=truth['code'].astype(str).str.upper()
          truth['date']=truth['date'].astype(str).str[:10]
          for c in ('close','prev_close','high_limit'): truth[c]=pd.to_numeric(truth[c],errors='raise')
          assert len(truth)==896827 and truth['symbol'].nunique()==698

          audit=json.loads(unique('pitst','PIT_ST_AUDIT_MERGED_V480.json').read_text(encoding='utf-8'))
          basics={}
          for a in audit['audits']:
              rows=(a.get('basic') or {}).get('rows') or []
              if len(rows)==1: basics[str(a['symbol']).upper()]=rows[0]
          assert len(basics)==847,len(basics)
          ipo_map={s:str(b.get('ipoDate') or '')[:10] for s,b in basics.items()}

          pit=pd.read_csv(unique('pitst','PIT_ST_DAILY_MERGED_V480.csv'),dtype={'symbol':str,'date':str})
          pit['symbol']=pit['symbol'].str.upper(); pit['date']=pit['date'].str[:10]
          pit['tradestatus']=pd.to_numeric(pit['tradestatus'],errors='raise').astype(int)
          pit['isST']=pd.to_numeric(pit['isST'],errors='raise').astype(int)
          assert not pit.duplicated(['symbol','date']).any()
          pit['ipo_date']=pit['symbol'].map(ipo_map)
          traded=pit[(pit['tradestatus']==1) & (pit['date']>=pit['ipo_date'])].sort_values(['symbol','date']).copy()
          traded['listing_trade_rank']=traded.groupby('symbol').cumcount()+1
          rank=traded[['symbol','date','listing_trade_rank']]

          frame=truth.merge(pit[['symbol','date','tradestatus','isST','ipo_date']],on=['symbol','date'],how='left',validate='one_to-one')
          frame=frame.merge(rank,on=['symbol','date'],how='left',validate='one-to-one')
          assert frame['isST'].notna().all(),int(frame['isST'].isna().sum())
          pcts=[]
          for r in frame[['symbol','date','isST','ipo_date','listing_trade_rank']].itertuples(index=False):
              rank_value=None if pd.isna(r.listing_trade_rank) else int(r.listing_trade_rank)
              pcts.append(rule.limit_percent(r.symbol,r.date,bool(r.isST),ipo_date=r.ipo_date,listing_trade_rank=rank_value))
          frame['candidate_pct']=pcts
          frame['truth_no_limit']=frame['high_limit']>=999999.0
          frame['candidate_no_limit']=frame['candidate_pct'].isna()
          frame['candidate_limit']=[None if pd.isna(p) else rule.limit_price_cny(ref,p) for ref,p in zip(frame['prev_close'],frame['candidate_pct'])]
          frame['truth_upper_limit']=(~frame['truth_no_limit']) & ((frame['close']-frame['high_limit']).abs()<0.0051)
          frame['candidate_upper_limit']=[False if pd.isna(p) else rule.is_upper_limit(c,ref,p) for c,ref,p in zip(frame['close'],frame['prev_close'],frame['candidate_pct'])]
          finite_candidate=pd.to_numeric(frame['candidate_limit'],errors='coerce')
          frame['price_match']=(frame['truth_no_limit'] & frame['candidate_no_limit']) | ((~frame['truth_no_limit']) & (~frame['candidate_no_limit']) & ((finite_candidate-frame['high_limit']).abs()<0.0051))
          frame['boolean_match']=frame['truth_upper_limit']==frame['candidate_upper_limit']

          no_limit_mismatch=frame[frame['truth_no_limit']!=frame['candidate_no_limit']].copy()
          price_mismatch=frame[~frame['price_match']].copy()
          bool_mismatch=frame[~frame['boolean_match']].copy()
          summary={
              'artifact':'GP12_UPPER_LIMIT_TRUTH_CROSSCHECK_V1','status':'PROBE_ONLY_NOT_BINDING',
              'canonical_truth_sha256':CANON_SHA,'rows':int(len(frame)),'symbols':int(frame['symbol'].nunique()),
              'truth_no_limit_n':int(frame['truth_no_limit'].sum()),'candidate_no_limit_n':int(frame['candidate_no_limit'].sum()),
              'no_limit_mismatch_n':int(len(no_limit_mismatch)),
              'truth_no_limit_candidate_limited_n':int((frame['truth_no_limit'] & ~frame['candidate_no_limit']).sum()),
              'truth_limited_candidate_no_limit_n':int((~frame['truth_no_limit'] & frame['candidate_no_limit']).sum()),
              'price_match_n':int(frame['price_match'].sum()),'price_mismatch_n':int(len(price_mismatch)),
              'boolean_match_n':int(frame['boolean_match'].sum()),'boolean_mismatch_n':int(len(bool_mismatch)),
              'formal_binding_allowed':False,'historical_gp_v11_source_recovered':False,
              'model_freeze_allowed':False,'oos_metrics_allowed':False,
          }
          cols=['symbol','date','name','market','exchange','ipo_date','listing_trade_rank','isST','close','prev_close','high_limit','truth_no_limit','candidate_no_limit','candidate_pct','candidate_limit','truth_upper_limit','candidate_upper_limit']
          out=Path('artifact_gp12_upper_limit_truth_crosscheck_v1'); out.mkdir(exist_ok=True)
          no_limit_mismatch[cols].sort_values(['symbol','date']).to_csv(out/'NO_LIMIT_MISMATCH.csv',index=False)
          price_mismatch[cols].sort_values(['symbol','date']).head(50000).to_csv(out/'PRICE_MISMATCH.csv',index=False)
          bool_mismatch[cols].sort_values(['symbol','date']).to_csv(out/'BOOLEAN_MISMATCH.csv',index=False)
          (out/'GP12_UPPER_LIMIT_TRUTH_CROSSCHECK_V1.json').write_text(json.dumps(summary,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY

      - name: Upload truth crosscheck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-upper-limit-truth-crosscheck-v1
          path: artifact_gp12_upper_limit_truth_crosscheck_v1/
          if-no-files-found: error
          retention-days: 30
