name: GP V4.82 Final Effective Terms

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/cninfo_effective_terms_final_v482.py'
      - 'scripts/test_cninfo_effective_terms_final_v482.py'
      - '.github/workflows/final-effective-terms-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Final effective-term parser tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_cninfo_effective_terms_final_v482.py
