name: DAO2 C FFD Direct Binding Test V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-ffd-direct-binding-test-v1.yml'
      - 'scripts/test_dao2_c_ffd_direct_binding_v1.py'
      - 'data/dao2/modules/C_SECTOR_FFD_801020_BINDING_AUDIT_V1.json'
      - 'data/dao2/modules/C_SECTOR_FFD_PUBLIC_HISTORY_CONTRACT_EVIDENCE_V1.json'
      - 'data/dao2/modules/C_SECTOR_FFD_801020_DIRECT_OHLC_EVIDENCE_V1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run FFD direct binding tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest -v scripts/test_dao2_c_ffd_direct_binding_v1.py
