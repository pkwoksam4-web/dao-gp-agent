name: GP V4.82 Eastmoney RAW Probe

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/eastmoney_raw_v482.py'
      - 'scripts/test_eastmoney_raw_v482.py'
      - '.github/workflows/eastmoney-raw-probe-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: pip install -q requests
      - name: Eastmoney RAW unit tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_eastmoney_raw_v482.py

  probe:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependency
        run: pip install -q requests
      - name: Probe stratified RAW histories
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/eastmoney_raw_v482.py \
            --symbol 000001.SZ \
            --symbol 000004.SZ \
            --symbol 002002.SZ \
            --symbol 002359.SZ \
            --symbol 300104.SZ \
            --symbol 600074.SH \
            --symbol 600614.SH \
            --symbol 600634.SH \
            --out-dir artifact_eastmoney_raw_probe_v482
      - name: Upload Eastmoney probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-eastmoney-raw-probe-v482
          path: artifact_eastmoney_raw_probe_v482/
          if-no-files-found: warn
          retention-days: 30
      - name: Report probe coverage without premature formal admission
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('artifact_eastmoney_raw_probe_v482/EASTMONEY_RAW_PROBE_V482.json')
          if not p.exists():
              raise SystemExit('probe summary missing')
          x=json.load(p.open(encoding='utf-8'))
          print(json.dumps({
              'symbols_requested':x['symbols_requested'],
              'symbols_fetched':x['symbols_fetched'],
              'nonempty_pass':x['nonempty_pass'],
              'errors':x['errors'],
              'audits':[{k:a.get(k) for k in ('symbol','rows','first_date','last_date','status')} for a in x['audits']],
              'error_details':x['error_details'],
              'formal_admission':x['formal_admission'],
          },ensure_ascii=False,indent=2))
          PY
