name: GP12 Main Net Flow Residual Zero Proof V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-residual-zero-proof-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas pyarrow requests
      - name: Download pinned Formal RAW evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-full-raw-v482-reaudit
          path: upstream/raw
          run-id: 34192233633
          github-token: ${{ github.token }}
      - name: Build strict zero-proof and unresolved residual evidence
        run: |
          python - <<'PY'
          import csv, hashlib, io, json
          from pathlib import Path
          import pandas as pd
          import requests

          RAW = Path('upstream/raw/SOHU_RAW_FULL_V482.parquet')
          RAW_SHA = 'bc72238d046378cf3b6fa61723e86fb43f1c491ac3da86d76932e3185f60e1eb'
          SOURCE_REPO = 'Jessica-Zhangyj/dlquant'
          SOURCE_COMMIT = '6b245fa09cb628f3bcb812f0662bfef520e65fb4'
          LARGE_ORDER_MIN_CNY = 200_000.0
          RULE_SOURCE = 'https://tushare.pro/document/2?doc_id=170'
          assert hashlib.sha256(RAW.read_bytes()).hexdigest() == RAW_SHA

          residuals = [
            ('600306.SH','2020-06-08'),('600306.SH','2020-06-09'),('600306.SH','2020-06-10'),
            ('600145.SH','2020-07-02'),('600145.SH','2020-07-03'),('600145.SH','2020-07-06'),
            ('600069.SH','2020-07-10'),('600069.SH','2020-07-14'),('600069.SH','2020-07-15'),
            ('600145.SH','2020-07-16'),('600069.SH','2020-07-20'),('600069.SH','2020-07-21'),('600069.SH','2020-07-22'),
            ('600898.SH','2020-11-04'),
            ('600086.SH','2021-01-25'),('600086.SH','2021-01-27'),('600086.SH','2021-01-28'),('600086.SH','2021-01-29'),
            ('600086.SH','2021-02-04'),('600247.SH','2021-02-22'),('603996.SH','2021-02-24'),
            ('600701.SH','2021-03-15'),('600701.SH','2021-03-16'),('600701.SH','2021-03-19'),
            ('600891.SH','2021-03-23'),('600701.SH','2021-03-24'),('600891.SH','2021-03-24'),('600891.SH','2021-03-25'),('600701.SH','2021-03-26'),
            ('002618.SZ','2021-09-23'),('000020.SZ','2021-09-24'),('000157.SZ','2021-09-24'),('000592.SZ','2021-09-24'),('000753.SZ','2021-09-24'),
            ('002684.SZ','2021-11-25'),('600112.SH','2022-05-06'),
            ('000564.SZ','2023-03-20'),('001337.SZ','2023-03-20'),
            ('002118.SZ','2023-05-22'),('002157.SZ','2023-05-22'),('002503.SZ','2023-05-22'),('002504.SZ','2023-05-22'),
          ]
          assert len(residuals) == 42 and len(set(residuals)) == 42

          df = pd.read_parquet(RAW, columns=['symbol','date','open','high','low','close','volume','amount','source'])
          df['date'] = pd.to_datetime(df['date']).dt.strftime('%Y-%m-%d')
          idx = {(str(r.symbol), str(r.date)): r for r in df.itertuples(index=False)}
          zero_proven = []
          unresolved = []
          for symbol, day in residuals:
              r = idx[(symbol, day)]
              item = {
                'symbol':symbol,'date':day,'open':float(r.open),'high':float(r.high),'low':float(r.low),'close':float(r.close),
                'volume_shares':float(r.volume),'total_turnover_cny':float(r.amount),'raw_source':str(r.source),
              }
              if float(r.amount) < LARGE_ORDER_MIN_CNY:
                  item.update({
                    'inference':'MAIN_NET_FLOW_CNY_EXACT_ZERO_BY_TOTAL_TURNOVER_BOUND',
                    'main_net_flow_cny':0.0,
                    'proof':f'total_turnover_cny < {LARGE_ORDER_MIN_CNY:.0f}; no >=20万 large or >=100万 extra-large order can exist',
                  })
                  zero_proven.append(item)
              else:
                  item.update({'inference':'UNRESOLVED_REQUIRES_RAW_MONEYFLOW_ROW'})
                  unresolved.append(item)

          assert len(zero_proven) == 24, len(zero_proven)
          assert len(unresolved) == 18, len(unresolved)
          assert all(x['total_turnover_cny'] < LARGE_ORDER_MIN_CNY for x in zero_proven)
          assert all(x['total_turnover_cny'] >= LARGE_ORDER_MIN_CNY for x in unresolved)

          # Inspect the sole source-extra row against the authoritative Formal RAW axis.
          extra_symbol, extra_day = '603133.SH', '2022-11-09'
          raw_extra_n = int(((df.symbol == extra_symbol) & (df.date == extra_day)).sum())
          compact = extra_day.replace('-','')
          base = f'https://raw.githubusercontent.com/{SOURCE_REPO}/{SOURCE_COMMIT}/data'
          def get_row(kind):
              url = f'{base}/{kind}/{compact}.csv'
              r = requests.get(url, timeout=60)
              r.raise_for_status()
              rows = list(csv.DictReader(io.StringIO(r.text.lstrip('\ufeff'))))
              hits = [row for row in rows if str(row.get('ts_code','')).strip().upper() == extra_symbol]
              return {'url':url,'row_n':len(hits),'rows':hits[:3]}
          extra = {
            'symbol':extra_symbol,'date':extra_day,
            'formal_raw_row_n':raw_extra_n,
            'moneyflow_source':get_row('moneyflow'),
            'daily_open_source':get_row('daily_open'),
            'formal_axis_action':'EXCLUDE_SOURCE_EXTRA_UNLESS_FORMAL_RAW_AXIS_CONTAINS_SYMBOL_DATE',
          }
          assert raw_extra_n == 0
          assert extra['moneyflow_source']['row_n'] == 1

          report = {
            'artifact':'GP12_MAIN_NET_FLOW_RESIDUAL_ZERO_PROOF_V1',
            'version':'1.0',
            'formal_window':['2020-06-01','2026-04-17'],
            'residual_missing_input_n':42,
            'large_order_min_cny':LARGE_ORDER_MIN_CNY,
            'classification_rule_source':RULE_SOURCE,
            'classification_rule':'small<50000; medium=50000..200000; large=200000..1000000; extra-large>=1000000; active buy/sell order statistics',
            'raw_sha256':RAW_SHA,
            'zero_proven_n':len(zero_proven),
            'zero_proven':zero_proven,
            'unresolved_n':len(unresolved),
            'unresolved':unresolved,
            'sole_source_extra':extra,
            'candidate_binding_allowed':False,
            'model_freeze_allowed':False,
            'oos_metrics_allowed':False,
          }
          Path('GP12_MAIN_NET_FLOW_RESIDUAL_ZERO_PROOF_V1.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({
            'zero_proven_n':len(zero_proven),
            'zero_keys':[(x['symbol'],x['date'],x['total_turnover_cny']) for x in zero_proven],
            'unresolved_n':len(unresolved),
            'unresolved_keys':[(x['symbol'],x['date'],x['total_turnover_cny']) for x in unresolved],
            'sole_source_extra':extra,
          }, ensure_ascii=False, indent=2))
          print('PASS_RESIDUAL_ZERO_PROOF_24_OF_42')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gp12-main-net-flow-residual-zero-proof-v1
          path: GP12_MAIN_NET_FLOW_RESIDUAL_ZERO_PROOF_V1.json
          if-no-files-found: error
          retention-days: 30
