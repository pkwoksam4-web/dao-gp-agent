name: GP V4.82 Materialize Remaining Recovered PDFs

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/materialize_remaining_recovered_v482.py'
      - 'scripts/test_materialize_remaining_recovered_v482.py'
      - '.github/workflows/materialize-remaining-recovered-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recovered PDF materializer tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_materialize_remaining_recovered_v482.py
