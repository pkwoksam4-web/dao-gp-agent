name: DAO2 C 301 Gap Ledger V1

on:
  workflow_dispatch:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - .github/workflows/dao2-c-301-gap-ledger-v1.yml
      - scripts/dao2_c_301_gap_ledger_v1.py

permissions:
  contents: write
  actions: read

jobs:
  build-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gp/dao2-c-sector-pit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Download frozen Wind evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10674701717/zip" \
            -o /tmp/dao2-c-wind.zip
          test -s /tmp/dao2-c-wind.zip

      - name: Build and validate 301-gap ledger
        run: |
          python scripts/dao2_c_301_gap_ledger_v1.py \
            --artifact-zip /tmp/dao2-c-wind.zip \
            --repo-root .

      - name: Commit deterministic ledger outputs
        run: |
          git config user.name "dao2-c-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            data/dao2/modules/C_301_GAP_LEDGER_V1.json \
            data/dao2/modules/C_301_GAP_VENDOR_SCOPE_V1.csv \
            data/dao2/modules/C_SECTOR_WIND_DERIVED_CLOSE_EVIDENCE_V1.json \
            data/dao2/modules/C_SECTOR_SERIES_CHECKPOINT_V1.json \
            data/dao2/modules/C_SECTOR_PIT_STATE_V1.json
          # JSON evidence/checkpoints must remain whitespace-clean. The CSV uses the
          # csv module's standards-compliant CRLF record terminator, so do not treat
          # its carriage return as semantic trailing whitespace.
          git diff --cached --check -- '*.json'
          git diff --cached --quiet && { echo "No ledger changes to commit"; exit 0; }
          git commit -m "evidence(dao2-c): freeze 301 sector gap ledger"
          git push origin HEAD:gp/dao2-c-sector-pit
