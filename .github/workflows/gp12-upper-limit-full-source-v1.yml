name: GP12 Upper Limit Full Source V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/gp12_upper_limit_full_v1.py'
      - 'scripts/gp12_upper_limit_rule_v1.py'
      - 'data/GP12_STATUS_SPECIAL_NO_LIMIT_EVIDENCE_V1.json'
      - '.github/workflows/gp12-upper-limit-full-source-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q pandas pyarrow

      - name: Download exact Formal844 Sohu reference panel
        uses: actions/download-artifact@v4
        with:
          name: gp12-sohu-reference-full-v1
          path: reference
          run-id: 35064830592
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Download pinned PIT-ST merged evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-merged
          path: pitst
          run-id: 33971534669
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Download canonical partial high-limit truth
        uses: actions/download-artifact@v4
        with:
          name: gp12-status-upper-limit-truth-canonical-v1
          path: truth
          run-id: 35060927372
          repository: pkwoksam4-web/dao-gp-agent
          github-token: ${{ github.token }}

      - name: Materialize full upper-limit panel and crosscheck canonical truth
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          import gp12_upper_limit_full_v1 as full

          REF_SHA='39f4df606abd4629ab28fac1d7444e73dfdeb3bb36c6764673f378463bd08c7e'
          TRUTH_SHA='d11b415b74d44d63d1aa927e8652f395dd039c28f6e1b4c24964e53759405308'
          EXPECTED_ROWS=1011607
          EXPECTED_SYMBOLS=844
          EXPECTED_TRUTH_ROWS=896827
          EXPECTED_TRUTH_SYMBOLS=698

          def unique(root,name):
              hits=list(Path(root).rglob(name))
              assert len(hits)==1,(root,name,hits)
              return hits[0]

          ref_path=unique('reference','SOHU_REFERENCE_FULL_V1.parquet')
          ref_audit_path=unique('reference','SOHU_REFERENCE_FULL_AUDIT_V1.json')
          assert hashlib.sha256(ref_path.read_bytes()).hexdigest()==REF_SHA
          ref_audit=json.loads(ref_audit_path.read_text(encoding='utf-8'))
          assert ref_audit['status']=='PASS_FULL_REFERENCE_PANEL',ref_audit
          assert ref_audit['reference_rows']==EXPECTED_ROWS,ref_audit
          assert ref_audit['symbol_n']==EXPECTED_SYMBOLS,ref_audit
          assert ref_audit['missing_rows']==0 and ref_audit['extra_rows']==0 and ref_audit['close_mismatch_n']==0,ref_audit
          reference=pd.read_parquet(ref_path)

          pit_audit=json.loads(unique('pitst','PIT_ST_AUDIT_MERGED_V480.json').read_text(encoding='utf-8'))
          basics={}
          for item in pit_audit['audits']:
              rows=(item.get('basic') or {}).get('rows') or []
              if len(rows)==1:
                  basics[str(item['symbol']).upper()]=str(rows[0].get('ipoDate') or '')[:10]
          assert len(basics)==847,len(basics)
          assert all(basics.values()),'missing authoritative ipoDate'

          pit=pd.read_csv(unique('pitst','PIT_ST_DAILY_MERGED_V480.csv'),dtype={'symbol':str,'date':str})
          assert {'symbol','date','isST'}.issubset(pit.columns),pit.columns.tolist()

          special_path=Path('data/GP12_STATUS_SPECIAL_NO_LIMIT_EVIDENCE_V1.json')
          special_sha=hashlib.sha256(special_path.read_bytes()).hexdigest()
          special_doc=json.loads(special_path.read_text(encoding='utf-8'))
          assert special_doc['artifact']=='GP12_STATUS_SPECIAL_NO_LIMIT_EVIDENCE_V1'
          assert special_doc['entry_count']==9==len(special_doc['entries'])
          special_keys=set()
          for entry in special_doc['entries']:
              assert entry['no_price_limit'] is True,entry
              key=(str(entry['symbol']).upper(),str(entry['date'])[:10])
              assert key not in special_keys,key
              special_keys.add(key)

          panel,audit=full.materialize_upper_limit_panel(reference,pit,basics,special_keys=special_keys)
          assert audit['status']=='PASS_UPPER_LIMIT_PANEL',audit
          assert audit['rows']==EXPECTED_ROWS,audit
          assert audit['symbol_n']==EXPECTED_SYMBOLS,audit
          assert audit['duplicate_symbol_dates']==0,audit
          assert audit['missing_status_rows']==0,audit
          assert audit['special_no_limit_rows']==9,audit
          assert len(panel)==EXPECTED_ROWS
          assert panel['symbol'].nunique()==EXPECTED_SYMBOLS
          assert not panel.duplicated(['symbol','date']).any()

          truth_path=unique('truth','HF_HIGH_LIMIT_FORMAL844_OVERLAP_CANONICAL.parquet')
          assert hashlib.sha256(truth_path.read_bytes()).hexdigest()==TRUTH_SHA
          truth=pd.read_parquet(truth_path)
          truth['symbol']=truth['code'].astype(str).str.upper()
          truth['date']=truth['date'].astype(str).str[:10]
          truth['truth_close']=pd.to_numeric(truth['close'],errors='raise')
          truth['high_limit']=pd.to_numeric(truth['high_limit'],errors='raise')
          assert len(truth)==EXPECTED_TRUTH_ROWS and truth['symbol'].nunique()==EXPECTED_TRUTH_SYMBOLS

          candidate=panel[['symbol','date','close','limit_pct_percent','limit_price_cny','upper_limit','special_no_limit']].rename(columns={'close':'candidate_close'})
          check=truth[['symbol','date','truth_close','high_limit']].merge(candidate,on=['symbol','date'],how='left',validate='one_to_one')
          assert len(check)==EXPECTED_TRUTH_ROWS
          assert check['candidate_close'].notna().all(),int(check['candidate_close'].isna().sum())
          check['close_match']=(check['truth_close']-check['candidate_close']).abs()<0.0051
          check['truth_no_limit']=(check['high_limit']>=999999.0) | check['special_no_limit'].fillna(False)
          check['candidate_no_limit']=check['limit_pct_percent'].isna()
          finite_limit=pd.to_numeric(check['limit_price_cny'],errors='coerce')
          check['price_match']=(check['truth_no_limit'] & check['candidate_no_limit']) | ((~check['truth_no_limit']) & (~check['candidate_no_limit']) & ((finite_limit-check['high_limit']).abs()<0.0051))
          check['truth_upper_limit']=(~check['truth_no_limit']) & ((check['truth_close']-check['high_limit']).abs()<0.0051)
          check['boolean_match']=check['truth_upper_limit']==check['upper_limit'].astype(bool)

          close_mismatch=check[~check['close_match']]
          no_limit_mismatch=check[check['truth_no_limit']!=check['candidate_no_limit']]
          price_mismatch=check[~check['price_match']]
          boolean_mismatch=check[~check['boolean_match']]

          audit.update({
              'artifact':'GP12_UPPER_LIMIT_FULL_SOURCE_V1',
              'status':'PASS_FULL_UPPER_LIMIT_SOURCE_CANDIDATE',
              'reference_panel_run_id':35064830592,
              'reference_panel_sha256':REF_SHA,
              'special_evidence_sha256':special_sha,
              'canonical_truth_sha256':TRUTH_SHA,
              'truth_overlap_rows':int(len(check)),
              'truth_overlap_symbols':int(check['symbol'].nunique()),
              'truth_close_mismatch_n':int(len(close_mismatch)),
              'truth_no_limit_mismatch_n':int(len(no_limit_mismatch)),
              'truth_price_mismatch_n':int(len(price_mismatch)),
              'truth_boolean_mismatch_n':int(len(boolean_mismatch)),
              'historical_gp_v11_source_recovered':False,
              'formal_binding_allowed':False,
              'model_freeze_allowed':False,
              'oos_metrics_allowed':False,
          })

          assert audit['truth_overlap_rows']==EXPECTED_TRUTH_ROWS,audit
          assert audit['truth_overlap_symbols']==EXPECTED_TRUTH_SYMBOLS,audit
          assert audit['truth_close_mismatch_n']==0,audit
          assert audit['truth_no_limit_mismatch_n']==0,audit
          assert audit['truth_price_mismatch_n']==0,audit
          assert audit['truth_boolean_mismatch_n']==0,audit

          out=Path('artifact_gp12_upper_limit_full_source_v1'); out.mkdir(exist_ok=True)
          panel.to_parquet(out/'GP12_UPPER_LIMIT_FULL_V1.parquet',index=False,compression='zstd')
          (out/'GP12_UPPER_LIMIT_FULL_AUDIT_V1.json').write_text(json.dumps(audit,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          close_mismatch.to_csv(out/'TRUTH_CLOSE_MISMATCH.csv',index=False)
          no_limit_mismatch.to_csv(out/'TRUTH_NO_LIMIT_MISMATCH.csv',index=False)
          price_mismatch.to_csv(out/'TRUTH_PRICE_MISMATCH.csv',index=False)
          boolean_mismatch.to_csv(out/'TRUTH_BOOLEAN_MISMATCH.csv',index=False)
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          print('panel_sha256='+hashlib.sha256((out/'GP12_UPPER_LIMIT_FULL_V1.parquet').read_bytes()).hexdigest())
          print('audit_sha256='+hashlib.sha256((out/'GP12_UPPER_LIMIT_FULL_AUDIT_V1.json').read_bytes()).hexdigest())
          PY

      - name: Upload full upper-limit source candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp12-upper-limit-full-source-v1
          path: artifact_gp12_upper_limit_full_source_v1/
          if-no-files-found: error
          retention-days: 30
