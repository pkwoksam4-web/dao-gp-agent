name: Cancel superseded Formal847 scaleout

on:
  push:
    branches:
      - gp/strategy-asset-recovery-v482
    paths:
      - '.github/workflows/cancel-old-formal847-scaleout-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cancel-old:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel superseded run 34445844375
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/34445844375/cancel
          echo 'cancel requested for superseded run 34445844375'
