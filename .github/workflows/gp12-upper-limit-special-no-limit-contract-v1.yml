name: GP12 Upper Limit Special No Limit Contract V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/test_gp12_upper_limit_special_no_limit_v1.py'
      - 'scripts/gp12_upper_limit_special_no_limit_v1.py'
      - 'data/GP12_STATUS_SPECIAL_NO_LIMIT_EVIDENCE_V1.json'
      - '.github/workflows/gp12-upper-limit-special-no-limit-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run special no-limit contract
        env:
          PYTHONPATH: scripts
        run: python -m unittest -v scripts/test_gp12_upper_limit_special_no_limit_v1.py
