name: DAO2 C Derived Close Migration Audit V1
on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-derived-close-migration-audit-v1.yml'
      - 'scripts/dao2_sector_pit_verify_v1.py'
      - 'scripts/test_dao2_sector_pit_verify_v1.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen 42,783-row Series base
        uses: actions/download-artifact@v4
        with:
          name: dao2-c-sector-series-exact-v1
          path: series-base
          run-id: 35575797301
          github-token: ${{ github.token }}
      - name: Download Wind reconstruction evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10674701717/zip" \
            -o /tmp/wind-derived.zip
          test -s /tmp/wind-derived.zip
      - name: Materialize and verify 43,081-row governed candidate
        env:
          PYTHONPATH: scripts
        run: |
          python - <<'PY'
          import csv, gzip, hashlib, io, json, zipfile
          from pathlib import Path
          from dao2_sector_pit_verify_v1 import validate_series

          OUT=Path('artifact_derived_migration'); OUT.mkdir(exist_ok=True)
          LEDGER=Path('data/dao2/modules/C_301_GAP_LEDGER_V1.json')
          ledger=json.loads(LEDGER.read_text(encoding='utf-8'))
          cols=ledger['row_schema']
          gaps=[dict(zip(cols,row)) for row in ledger['rows']]
          assert len(gaps)==301
          derived_gap_keys={(str(g['sector_code']),str(g['trade_date']).replace('-','')) for g in gaps if g['gap_class']=='DERIVED_CLOSE_EVIDENCE_ONLY'}
          direct_gap_keys={(str(g['sector_code']),str(g['trade_date']).replace('-','')) for g in gaps if g['gap_class']=='DIRECT_RAW_REQUIRED'}
          assert len(derived_gap_keys)==298
          assert direct_gap_keys=={
              ('801020.SI','20210806'),
              ('801020.SI','20211008'),
              ('801020.SI','20211022'),
          }

          with gzip.open('series-base/sector_close_formal.csv.gz','rt',encoding='utf-8',newline='') as f:
              base=list(csv.DictReader(f))
          assert len(base)==42783
          base_keys={(str(r['industry_code']),str(r['trade_date']).replace('-','')) for r in base}
          assert len(base_keys)==42783
          expected_keys=base_keys | derived_gap_keys | direct_gap_keys
          assert len(expected_keys)==43084

          with zipfile.ZipFile('/tmp/wind-derived.zip') as z:
              recon_bytes=z.read('wind_two_sided_reconstruction.csv')
              source_bytes=z.read('source/industry_returns.csv')
          assert hashlib.sha256(recon_bytes).hexdigest()=='0667a268a025355366012a65db36752d609df3b3cdea194f910b82f2599ff4b1'
          assert hashlib.sha256(source_bytes).hexdigest()=='97410eb4acf16fd14b16b0a60f4bbe45b3da071f078fdb5dea7c3044120f1786'
          recon=list(csv.DictReader(io.StringIO(recon_bytes.decode('utf-8-sig'))))
          assert len(recon)==298
          recon_keys={(str(r['industry_code']),str(r['trade_date']).replace('-','')) for r in recon}
          assert recon_keys==derived_gap_keys

          derived=[]
          for r in recon:
              td=str(r['trade_date']).replace('-','')
              prev=str(r['prev_trade_date']).replace('-','')
              nxt=str(r['next_trade_date']).replace('-','')
              prev_close=float(r['prev_accepted_close'])
              same_ret=float(r['wind_target_return'])
              next_close=float(r['next_accepted_close'])
              next_ret=float(r['wind_next_return'])
              forward=round(prev_close*(1.0+same_ret),2)
              backward=round(next_close/(1.0+next_ret),2)
              candidate=round(float(r['candidate_close_2dp']),2)
              assert forward==backward==candidate, (r['industry_code'],td,forward,backward,candidate)
              assert prev<td<nxt
              derived.append({
                  'industry_code':str(r['industry_code']),
                  'trade_date':td,
                  'close':f'{candidate:.2f}',
                  'source_provider':'WIND_ASWSINDEXEOD_DERIVED_CLOSE',
                  'source_trade_date':td,
                  'fill_method':'NONE',
                  'provenance_type':'DERIVED_CLOSE',
                  'derivation_method':'PREV_ACCEPTED_CLOSE_X_SAME_DAY_WIND_RETURN',
                  'derivation_source_repository':'z15114664687-dot/fund-holdings',
                  'derivation_source_commit':'92864a330e5bad393315cb6664fe626370e9c92d',
                  'derivation_source_blob_sha':'45550d4d621ba0e6be39dc3e39b150576784b83c',
                  'derivation_source_sha256':'97410eb4acf16fd14b16b0a60f4bbe45b3da071f078fdb5dea7c3044120f1786',
                  'previous_anchor_trade_date':prev,
                  'same_day_return_trade_date':td,
                  'production_uses_future_data':'false',
                  'next_day_anchor_usage':'AUDIT_ONLY_NOT_VALUE_PRODUCTION',
                  'two_sided_unique_2dp':'true',
              })

          combined=base+derived
          result=validate_series(combined,expected_keys)
          assert len(combined)==43081
          assert result['rows']==43081
          assert result['observed_keys']==43081
          assert result['missing_required_keys']==3
          assert result['derived_close_rows_admitted']==298
          assert result['derived_close_rows_rejected']==0
          assert result['derived_close_admitted'] is True
          assert result['errors']==['missing_required_sector_dates:3'], result['errors']
          missing={(x['industry_code'],x['trade_date']) for x in result['missing_required_key_sample']}
          assert missing==direct_gap_keys, missing

          fields=[]
          for row in combined:
              for k in row:
                  if k not in fields: fields.append(k)
          csv_buf=io.StringIO(newline='')
          w=csv.DictWriter(csv_buf,fieldnames=fields,extrasaction='ignore')
          w.writeheader(); w.writerows(combined)
          raw=csv_buf.getvalue().encode('utf-8')
          with gzip.open(OUT/'sector_close_formal_43081.csv.gz','wb',mtime=0) as gz:
              gz.write(raw)
          combined_sha=hashlib.sha256((OUT/'sector_close_formal_43081.csv.gz').read_bytes()).hexdigest()

          audit={
              'artifact':'DAO2_C_DERIVED_CLOSE_MIGRATION_AUDIT_V1',
              'version':'1.0',
              'status':'PASS_LIMITED_MIGRATION_298_SERIES_STILL_BLOCKED_3',
              'frozen_base_rows':42783,
              'governed_derived_rows':298,
              'combined_observed_keys':43081,
              'required_keys':43084,
              'missing_required_keys':3,
              'remaining_direct_gaps':[{'industry_code':c,'trade_date':d} for c,d in sorted(direct_gap_keys)],
              'verifier':result,
              'source_evidence':{
                  'artifact_id':10674701717,
                  'artifact_digest':'sha256:cc498f5785fe092e53ceb11968253fa5049e204ad2cbed04f07c2594db8e5103',
                  'reconstruction_member':'wind_two_sided_reconstruction.csv',
                  'reconstruction_member_sha256':'0667a268a025355366012a65db36752d609df3b3cdea194f910b82f2599ff4b1',
                  'same_day_return_member':'source/industry_returns.csv',
                  'same_day_return_sha256':'97410eb4acf16fd14b16b0a60f4bbe45b3da071f078fdb5dea7c3044120f1786'
              },
              'production_future_data_used':False,
              'next_day_anchor_usage':'AUDIT_ONLY_NOT_VALUE_PRODUCTION',
              'combined_gzip_sha256':combined_sha,
              'series_blocker_closed':False,
              'breadth_derivation_allowed':False,
          }
          (OUT/'result.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dao2-c-derived-close-migration-audit-v1
          path: artifact_derived_migration/
          if-no-files-found: error
          retention-days: 30
