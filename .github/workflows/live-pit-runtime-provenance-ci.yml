name: Live PIT Runtime Provenance CI

on:
  pull_request:
    paths:
      - "scripts/live_pit_ingest.py"
      - "tests/test_live_pit_ingest_provenance.py"
      - "db/migrations/20261028_market_bars_persisted_at.sql"
      - ".github/workflows/live-pit-runtime-provenance-ci.yml"

permissions:
  contents: read

jobs:
  runtime-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_live_pit_ingest_provenance
      - name: Compile runtime ingest module
        run: python -m py_compile scripts/live_pit_ingest.py
