name: External asset organization probe

on:
  push:
    branches:
      - gp/external-asset-probe-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query public organization trace
        run: |
          mkdir -p probe3
          curl -L --max-time 30 -A 'dao-gp-agent-provenance-probe/1.2' 'https://api.github.com/orgs/zjzesheng' -o probe3/org.json
          curl -L --max-time 30 -A 'dao-gp-agent-provenance-probe/1.2' 'https://api.github.com/orgs/zjzesheng/repos?type=all&per_page=100' -o probe3/repos.json
          curl -L --max-time 30 -A 'dao-gp-agent-provenance-probe/1.2' 'https://api.github.com/orgs/zjzesheng/members?filter=all&per_page=100' -o probe3/members.json
          curl -L --max-time 30 -A 'dao-gp-agent-provenance-probe/1.2' 'https://api.github.com/orgs/zjzesheng/events?per_page=100' -o probe3/events.json
          curl -L --max-time 30 -A 'dao-gp-agent-provenance-probe/1.2' 'https://api.github.com/search/repositories?q=org%3Azjzesheng&per_page=100' -o probe3/search_repos.json
          python - <<'PY'
          import json
          from pathlib import Path
          out = Path('probe3')
          summary = {}
          for p in sorted(out.glob('*.json')):
              text = p.read_text('utf-8', errors='replace')
              summary[p.name] = {'bytes': p.stat().st_size, 'head': text[:1000]}
          (out / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), 'utf-8')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-asset-org-probe-20260913
          path: probe3/
          retention-days: 30
