name: Shadow Contract Gates CI

on:
  push:
    branches:
      - "fix/shadow-settlement-contract-gates-v1"
    paths:
      - "scripts/shadow_contract_gates.py"
      - "scripts/generate_shadow_request.py"
      - "scripts/live_pit_ingest.py"
      - "scripts/ranking_shadow_settlement.py"
      - "tests/test_shadow_contract_gates.py"
      - ".github/workflows/*shadow*"
      - "evidence/agent_brain/prospective_quarantine_registry_v1.json"
  pull_request:
    paths:
      - "scripts/shadow_contract_gates.py"
      - "scripts/generate_shadow_request.py"
      - "scripts/live_pit_ingest.py"
      - "scripts/ranking_shadow_settlement.py"
      - "tests/test_shadow_contract_gates.py"
      - ".github/workflows/*shadow*"
      - "evidence/agent_brain/prospective_quarantine_registry_v1.json"

permissions:
  contents: read

jobs:
  fixture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v tests.test_shadow_contract_gates
      - name: Compile modified runtime modules
        run: python -m py_compile scripts/shadow_contract_gates.py scripts/generate_shadow_request.py scripts/live_pit_ingest.py scripts/ranking_shadow_settlement.py
