name: BTC Successor-B Mark Index Boundary Capture

on:
  push:
    branches:
      - btc-successor-b-okx-gap-20261009
    paths:
      - "runtime/btc_successor_b_mark_index_boundary/**"
      - ".github/workflows/btc-successor-b-mark-index-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify PIT boundary tests
        working-directory: runtime/btc_successor_b_mark_index_boundary
        run: python -m unittest -v test_boundary_capture.py
      - name: Capture fixed mark/index boundary archives
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/btc-successor-b-mark-index-boundary
          python runtime/btc_successor_b_mark_index_boundary/boundary_capture.py \
            --out artifacts/btc-successor-b-mark-index-boundary
          rc=$?
          printf '%s\n' "$rc" > artifacts/btc-successor-b-mark-index-boundary/collector_exit_code.txt
          exit 0
      - name: Upload boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-successor-b-mark-index-boundary-${{ github.run_id }}
          path: artifacts/btc-successor-b-mark-index-boundary/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
      - name: Propagate collector status
        if: always()
        shell: bash
        run: |
          test -f artifacts/btc-successor-b-mark-index-boundary/collector_exit_code.txt
          rc="$(cat artifacts/btc-successor-b-mark-index-boundary/collector_exit_code.txt)"
          exit "$rc"
