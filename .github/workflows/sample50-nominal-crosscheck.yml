name: GP Sample50 nominal factor crosscheck
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/sample50_probe.py'
      - 'scripts/sample50_validate.py'
      - 'scripts/run_sample50_nominal.py'
      - '.github/workflows/sample50-nominal-crosscheck.yml'
  pull_request:
    paths:
      - 'scripts/sample50_probe.py'
      - 'scripts/sample50_validate.py'
      - 'scripts/run_sample50_nominal.py'
      - '.github/workflows/sample50-nominal-crosscheck.yml'
permissions:
  contents: read
jobs:
  sample50:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen V3.67 Sample50 nominal event-factor crosscheck
        env:
          SAMPLE50_OUT: artifact_sample50
        run: python scripts/run_sample50_nominal.py
      - name: Upload Sample50 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-sample50-nominal-crosscheck-v478
          path: artifact_sample50/
          if-no-files-found: error
