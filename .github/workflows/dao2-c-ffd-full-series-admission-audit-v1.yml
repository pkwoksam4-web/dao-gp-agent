name: DAO2 C FFD Full Series Admission Audit V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - 'data/dao2/modules/C_SECTOR_FFD_801020_DIRECT_PATCH_V1.csv'
      - 'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_PATCH_V1.csv'
      - 'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json'
      - '.github/workflows/dao2-c-ffd-full-series-admission-audit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen 42,783-row Series base
        uses: actions/download-artifact@v4
        with:
          name: dao2-c-sector-series-exact-v1
          path: /tmp/series-base
          run-id: 35575797301
          github-token: ${{ github.token }}
      - name: Download PASS Membership required keys
        uses: actions/download-artifact@v4
        with:
          name: dao2-c-sector-backing-materialize-v1
          path: /tmp/membership-pass
          run-id: 35575433267
          github-token: ${{ github.token }}
      - name: Validate exact 43,084-key union with frozen verifier
        env:
          PYTHONPATH: scripts
        shell: bash
        run: |
          python - <<'PY'
          import csv, gzip, hashlib, json
          from pathlib import Path
          from dao2_sector_pit_verify_v1 import validate_series

          out=Path('artifact_ffd_full_series_admission')
          out.mkdir(exist_ok=True)
          base_path=Path('/tmp/series-base/sector_close_formal.csv.gz')
          req_path=Path('/tmp/membership-pass/membership_out/formal_required_sector_keys.csv.gz')
          patch3=Path('data/dao2/modules/C_SECTOR_FFD_801020_DIRECT_PATCH_V1.csv')
          patch298=Path('data/dao2/modules/C_SECTOR_FFD_298_DIRECT_PATCH_V1.csv')
          cp298=json.loads(Path('data/dao2/modules/C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json').read_text(encoding='utf-8'))
          cp3=json.loads(Path('data/dao2/modules/C_SECTOR_FFD_801020_BINDING_CHECKPOINT_V1.json').read_text(encoding='utf-8'))

          def read_csv(path):
              opener=gzip.open if str(path).endswith('.gz') else open
              with opener(path,'rt',encoding='utf-8-sig',newline='') as fh:
                  return list(csv.DictReader(fh))

          base=read_csv(base_path)
          req=read_csv(req_path)
          p3=read_csv(patch3)
          p298=read_csv(patch298)
          assert len(base)==42783,len(base)
          assert len(p3)==3,len(p3)
          assert len(p298)==298,len(p298)
          assert cp3['status']=='PASS_BINDING_PARTIAL_ADMISSION'
          assert cp298['status']=='PASS_BINDING_DIRECT_298_NOT_DERIVED'
          assert cp298['admission']['admitted_derived_rows']==0

          required={(str(r['industry_code']),str(r['trade_date']).replace('-','')) for r in req}
          assert len(required)==43084,len(required)
          base_keys={(str(r['industry_code']),str(r['trade_date']).replace('-','')) for r in base}
          p3_keys={(str(r['industry_code']),str(r['trade_date']).replace('-','')) for r in p3}
          p298_keys={(str(r['industry_code']),str(r['trade_date']).replace('-','')) for r in p298}
          assert len(base_keys)==42783
          assert len(p3_keys)==3 and len(p298_keys)==298
          assert not (base_keys & p3_keys)
          assert not (base_keys & p298_keys)
          assert not (p3_keys & p298_keys)
          union=base_keys|p3_keys|p298_keys
          assert union==required,(len(required-union),len(union-required))

          rows=[]
          for r in base:
              rows.append({
                  'industry_code':str(r['industry_code']),
                  'trade_date':str(r['trade_date']).replace('-',''),
                  'close':r['close'],
                  'source_provider':r['source_provider'],
                  'source_trade_date':str(r['source_trade_date']).replace('-',''),
                  'fill_method':r['fill_method'],
                  'provenance_type':r.get('provenance_type') or 'RAW_CLOSE',
              })
          for r in p3+p298:
              rows.append({
                  'industry_code':r['industry_code'],'trade_date':r['trade_date'],'close':r['close'],
                  'source_provider':r['source_provider'],'source_trade_date':r['source_trade_date'],
                  'fill_method':r['fill_method'],'provenance_type':r['provenance_type'],
              })

          verdict=validate_series(rows,required)
          assert verdict['status']=='PASS',verdict
          assert verdict['rows']==43084
          assert verdict['observed_keys']==43084
          assert verdict['missing_required_keys']==0
          assert verdict['full_coverage'] is True
          assert verdict['no_forward_fill_proven'] is True
          assert verdict['derived_close_rows_rejected']==0

          full_path=out/'sector_close_formal_ffd_bound.csv.gz'
          fields=['industry_code','trade_date','close','source_provider','source_trade_date','fill_method','provenance_type']
          with gzip.open(full_path,'wt',encoding='utf-8',newline='') as fh:
              w=csv.DictWriter(fh,fieldnames=fields);w.writeheader();w.writerows(sorted(rows,key=lambda x:(x['industry_code'],x['trade_date'])))
          full_sha=hashlib.sha256(full_path.read_bytes()).hexdigest()
          audit={
              'artifact':'DAO2_C_FFD_FULL_SERIES_ADMISSION_AUDIT_V1','version':'1.0','module_id':'C','component':'sector_series',
              'status':'PASS_SUBCOMPONENT',
              'inputs':{
                  'frozen_base_run_id':35575797301,'frozen_base_rows':42783,
                  'ffd_801020_direct_rows':3,'ffd_298_direct_rows':298,
                  'ffd_direct_rows_total':301,'derived_close_rows_admitted':0,
                  'required_membership_run_id':35575433267,'required_keys':43084,
              },
              'set_audit':{
                  'base_patch3_overlap':0,'base_patch298_overlap':0,'patch3_patch298_overlap':0,
                  'union_keys':len(union),'missing_keys':len(required-union),'extra_keys':len(union-required),
              },
              'frozen_verifier':verdict,
              'output':{'member':'sector_close_formal_ffd_bound.csv.gz','sha256':full_sha,'rows':43084},
              'governance':{
                  'contract_lowered':False,'verifier_modified_for_ffd':False,'derived_close_migrated':False,
                  'forward_fill':False,'synthetic':False,'same_day_direct':True,
                  'breadth_derivation_authorized_by_this_audit':False,
              }
          }
          (out/'C_SECTOR_FFD_FULL_SERIES_ADMISSION_AUDIT_V1.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':audit['status'],'rows':43084,'missing':0,'derived_admitted':0,'output_sha256':full_sha},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dao2-c-ffd-full-series-admission-audit-v1
          path: artifact_ffd_full_series_admission/
          if-no-files-found: error
          retention-days: 30
