name: GP BaoStock turnover anomaly audit V482

on:
  push:
    branches: [gp/baostock-fullraw-crosscheck-v482]
    paths: ['.github/workflows/baostock-turnover-anomaly-audit-v482.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas pyarrow
      - name: Download Full847 turnover artifact
        uses: actions/download-artifact@v4
        with:
          name: gp-baostock-turnover-full847-probe-v482
          path: upstream/turnover
          run-id: 34459482270
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pkwoksam4-web/dao-gp-agent
      - name: Download frozen PIT-ST evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-final-audit
          path: upstream/pitst
          run-id: 33977325822
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pkwoksam4-web/dao-gp-agent
      - name: Audit anomalies
        run: |
          mkdir -p out/turnover_anomaly
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          p=Path('upstream/turnover/BAOSTOCK_TURNOVER_FULL847_TRADED_V482.parquet')
          d=pd.read_parquet(p)
          zero=d[d['turn_pct']<=0].copy().sort_values(['symbol','date'])

          # Locate full daily BaoStock shard source if present in downloaded artifact set is intentionally unavailable;
          # use PIT-ST panel to contextualize zero rows and known lifecycle boundaries.
          pit_candidates=list(Path('upstream/pitst').rglob('*.parquet')) + list(Path('upstream/pitst').rglob('*.csv'))
          context=[]
          for r in zero.to_dict('records'):
              context.append(r)

          audit={
            'artifact':'BAOSTOCK_TURNOVER_ANOMALY_AUDIT_V482',
            'version':'V4.82',
            'source_run_id':34459482270,
            'traded_rows':int(len(d)),
            'turn_zero_or_negative_n':int(len(zero)),
            'turn_zero_or_negative_rows':context,
            'pitst_candidate_files':[str(x) for x in pit_candidates[:50]],
            'promotion':{'formal_admission':False,'turnover_ratio_blocker_closed':False,'oos_metrics_allowed':False},
          }
          Path('out/turnover_anomaly/BAOSTOCK_TURNOVER_ANOMALY_AUDIT_V482.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          zero.to_csv('out/turnover_anomaly/BAOSTOCK_TURNOVER_ZERO_ROWS_V482.csv',index=False)
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gp-baostock-turnover-anomaly-audit-v482
          path: out/turnover_anomaly/
          if-no-files-found: warn
          retention-days: 30
