name: DAO2 C SWSResearch 301-Gap Recovery V1
on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - 'scripts/dao2_c_swsresearch_gap_recovery_v1.py'
      - 'scripts/test_dao2_c_swsresearch_gap_recovery_v1.py'
      - '.github/workflows/dao2-c-swsresearch-gap-recovery-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas requests pytest
      - name: Unit contract tests
        run: pytest -q scripts/test_dao2_c_swsresearch_gap_recovery_v1.py
      - name: Download frozen 42,783-key Series base
        uses: actions/download-artifact@v4
        with:
          name: dao2-c-sector-series-exact-v1
          path: series-base
          run-id: 35575797301
          github-token: ${{ github.token }}
      - name: Probe all 301 missing keys from official SWSResearch history
        run: |
          python scripts/dao2_c_swsresearch_gap_recovery_v1.py \
            --gap-ledger data/dao2/modules/C_301_GAP_LEDGER_V1.json \
            --base-panel series-base/sector_close_formal.csv.gz \
            --out artifact_swsresearch_gap_recovery
      - name: Upload raw recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao2-c-swsresearch-301-gap-recovery-v1
          path: artifact_swsresearch_gap_recovery/
          if-no-files-found: warn
          retention-days: 30
