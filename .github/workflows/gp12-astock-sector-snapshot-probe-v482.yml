name: GP12 AStock Sector Snapshot Probe V482

on:
  push:
    branches: [gp/baostock-fullraw-crosscheck-v482]
    paths:
      - 'scripts/gp12_astock_sector_snapshot_probe_v482.py'
      - '.github/workflows/gp12-astock-sector-snapshot-probe-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Hugging Face client
        run: python -m pip install --disable-pip-version-check --quiet huggingface_hub
      - name: Enumerate dataset revisions and exact LFS metadata
        run: |
          mkdir -p out
          python scripts/gp12_astock_sector_snapshot_probe_v482.py \
            --limit 100 \
            --out out/GP12_ASTOCK_SECTOR_SNAPSHOT_HISTORY_PROBE_V482.json
      - name: Verify probe remains fail-closed
        run: |
          python - <<'PY'
          import json
          x=json.load(open('out/GP12_ASTOCK_SECTOR_SNAPSHOT_HISTORY_PROBE_V482.json'))
          assert x['repo_id']=='newbiestring-lang/astock'
          assert x['sector_source_snapshot_identity_locked'] is False
          assert x['sector_source_bytes_hash_bound'] is False
          assert x['sector_pit_membership_verified'] is False
          assert x['model_freeze_allowed'] is False
          assert x['oos_metrics_allowed'] is False
          print('candidate revisions',x['candidate_revision_n'])
          PY
      - name: Upload snapshot history probe
        uses: actions/upload-artifact@v4
        with:
          name: gp12-astock-sector-snapshot-history-probe-v482
          path: out/GP12_ASTOCK_SECTOR_SNAPSHOT_HISTORY_PROBE_V482.json
          if-no-files-found: error
          retention-days: 30
