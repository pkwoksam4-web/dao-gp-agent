name: GP V4.82 Final Six Closure

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/final_six_closure_v482.py'
      - 'scripts/test_final_six_closure_v482.py'
      - '.github/workflows/final-six-closure-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Final-six closure unit tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_final_six_closure_v482.py
