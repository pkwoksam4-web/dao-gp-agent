name: Fast Common Crawl recovery

on:
  push:
    branches:
      - gp-cc-fast-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan only relevant Common Crawl windows
        shell: bash
        run: |
          set +e
          mkdir -p probe/index probe/payloads
          python - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error, gzip, io, hashlib, concurrent.futures
          from pathlib import Path
          root=Path('probe'); ua='dao-gp-agent-provenance-probe/4.1'
          indexes=['CC-MAIN-2026-34','CC-MAIN-2026-30']
          targets=[
            'github.com/leo-quant-research/data_lake*',
            'github.com/leo-quant-research/AlphaAgent*',
            'github.com/leo-quant-research/alphaagent*',
            'raw.githubusercontent.com/leo-quant-research/data_lake/*',
            'raw.githubusercontent.com/leo-quant-research/AlphaAgent/*',
            'codeload.github.com/leo-quant-research/data_lake/*',
            'codeload.github.com/leo-quant-research/AlphaAgent/*',
          ]
          def get(url,timeout=35,headers=None):
            h={'User-Agent':ua}; h.update(headers or {})
            req=urllib.request.Request(url,headers=h)
            try:
              with urllib.request.urlopen(req,timeout=timeout) as r: return getattr(r,'status',200),dict(r.headers.items()),r.read(),''
            except urllib.error.HTTPError as e:
              try:d=e.read()
              except:d=b''
              return e.code,dict(e.headers.items()) if e.headers else {},d,repr(e)
            except Exception as e:return None,{},b'',repr(e)
          def query(item):
            idx,target=item
            api=f'https://index.commoncrawl.org/{idx}-index?'+urllib.parse.urlencode({'url':target,'output':'json','filter':'status:200','limit':'200'})
            st,h,b,e=get(api)
            key=hashlib.sha1((idx+' '+target).encode()).hexdigest()[:12]
            (root/'index'/f'{key}.json').write_bytes(b)
            (root/'index'/f'{key}.meta.json').write_text(json.dumps({'index':idx,'target':target,'status':st,'error':e},indent=2))
            out=[]
            if st==200:
              for line in b.decode('utf-8','replace').splitlines():
                try:r=json.loads(line);r['_index']=idx;r['_target']=target;out.append(r)
                except:pass
            return out
          records=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=14) as ex:
            for res in ex.map(query,[(i,t) for i in indexes for t in targets]): records.extend(res)
          uniq={}
          for r in records:
            k=(r.get('filename'),r.get('offset'),r.get('length'))
            if all(k):uniq[k]=r
          def recover(pair):
            k,r=pair; fn,off,length=k
            try:off=int(off);length=int(length)
            except:return {'record':r,'error':'bad coordinates'}
            if length>10_000_000:return {'record':r,'error':'record too large'}
            st,h,b,e=get('https://data.commoncrawl.org/'+fn,50,{'Range':f'bytes={off}-{off+length-1}'})
            out={'record':r,'status':st,'range_bytes':len(b),'error':e}
            if st in (200,206) and b:
              try:raw=gzip.decompress(b)
              except:
                try:raw=gzip.GzipFile(fileobj=io.BytesIO(b)).read()
                except:raw=b
              rid=hashlib.sha256((fn+str(off)+str(length)).encode()).hexdigest()[:16]
              (root/'payloads'/f'{rid}.warc').write_bytes(raw)
              # Locate HTTP payload more robustly: strip WARC headers, then HTTP headers.
              first=raw.find(b'\r\n\r\n'); rest=raw[first+4:] if first>=0 else raw
              second=rest.find(b'\r\n\r\n'); payload=rest[second+4:] if second>=0 else rest
              (root/'payloads'/f'{rid}.payload').write_bytes(payload)
              out.update({'id':rid,'raw_bytes':len(raw),'payload_bytes':len(payload),'payload_sha256':hashlib.sha256(payload).hexdigest()})
            return out
          recovered=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex:
            for x in ex.map(recover,list(uniq.items())[:120]):recovered.append(x)
          keyterms=['legacy_codes','rolling_rank_quantile_weighted_stats_fast','liquidity_cut','growth_moti','0_5_1','factors_raw.pkl','df_z_e','Multi Agent Factor Research System','Build and update data lake']
          hits=[]
          for p in sorted((root/'payloads').glob('*.payload')):
            txt=p.read_text('utf-8',errors='replace'); c={k:txt.lower().count(k.lower()) for k in keyterms}
            if any(c.values()): hits.append({'file':p.name,'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'counts':c,'preview':txt[:1500]})
          summary={'records':len(records),'unique_records':len(uniq),'recovered':sum(1 for x in recovered if x.get('id')),'urls':sorted({r.get('url') for r in records if r.get('url')}),'hits':hits}
          (root/'records.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
          (root/'recovered.json').write_text(json.dumps(recovered,ensure_ascii=False,indent=2))
          (root/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print(json.dumps(summary,ensure_ascii=False)[:20000])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-fast-recovery-20260914
          path: probe/
          retention-days: 30
