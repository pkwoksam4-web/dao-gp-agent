name: DAO2 A FFD Moneyflow Coverage V1

on:
  push:
    branches:
      - gp/dao2-a-main-net-flow
    paths:
      - '.github/workflows/dao2-a-ffd-moneyflow-coverage-v1.yml'
  pull_request:
    branches:
      - gp/dao2-migration-20260920
    paths:
      - '.github/workflows/dao2-a-ffd-moneyflow-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FFD_API_KEY: ${{ secrets.FFD_API_KEY }}
    steps:
      - name: Probe historical minute large/extra-large order flow
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path

          OUT=Path('artifact_ffd_moneyflow_coverage'); OUT.mkdir(exist_ok=True)
          token=os.environ.get('FFD_API_KEY','').strip()
          base='https://ffd.findesk.cn'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','Accept':'application/json'}
          result={'artifact':'DAO2_A_FFD_MINUTE_ORDER_FLOW_HISTORY_PROBE_V1','secret_present':bool(token),'requests':[],'formal_admission_changed':False}
          if not token:
              result['status']='NO_FFD_API_KEY_SECRET'
          else:
              try:
                  req=urllib.request.Request(base+'/api/v1/market/money-flow-minute/catalog',headers={'Accept':'application/json','User-Agent':'dao2-ffd-minute-probe-v1'})
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      raw=resp.read(); result['catalog_http_status']=resp.status
                  result['catalog_sha256']=hashlib.sha256(raw).hexdigest(); (OUT/'catalog.json').write_bytes(raw)
                  result['catalog']=json.loads(raw.decode('utf-8'))
              except Exception as e:
                  result['catalog_error']=f'{type(e).__name__}: {e}'

              probes=[
                  ('300673.SZ','2021-09-24'),
                  ('000695.SZ','2023-05-22'),
              ]
              for idx,(code,date) in enumerate(probes,1):
                  payload={
                      'codes':[code],
                      'mode':'range',
                      'start_date':date+' 09:31:00',
                      'end_date':date+' 09:31:00',
                      'buckets':['large','extra_large'],
                  }
                  entry={'code':code,'trade_date':date,'payload':payload}
                  try:
                      req=urllib.request.Request(base+'/api/v1/market/money-flow-minute',data=json.dumps(payload).encode('utf-8'),headers=headers,method='POST')
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          raw=resp.read(); entry['http_status']=resp.status
                      entry['raw_sha256']=hashlib.sha256(raw).hexdigest(); (OUT/f'minute_{idx}.json').write_bytes(raw)
                      entry['response']=json.loads(raw.decode('utf-8'))
                  except urllib.error.HTTPError as e:
                      body=e.read(); entry['http_status']=e.code; entry['error']=f'HTTPError: {e}'; entry['error_body_prefix']=body[:8000].decode('utf-8',errors='replace')
                  except Exception as e:
                      entry['error']=f'{type(e).__name__}: {e}'
                  result['requests'].append(entry)
                  time.sleep(2.5)
              result['status']='MINUTE_HISTORY_PROBE_COMPLETE'

          canonical=json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))
          result['content_sha256_without_hash_field']=hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'secret_present':result['secret_present'],'http_statuses':[r.get('http_status') for r in result.get('requests',[])],'result_sha256':result['content_sha256_without_hash_field']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dao2-a-ffd-moneyflow-coverage-v1
          path: artifact_ffd_moneyflow_coverage/
          if-no-files-found: error
          retention-days: 30
