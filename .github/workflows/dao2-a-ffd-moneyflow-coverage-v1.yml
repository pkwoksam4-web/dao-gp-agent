name: DAO2 A FFD Moneyflow Coverage V1

on:
  push:
    branches:
      - gp/dao2-a-main-net-flow
    paths:
      - '.github/workflows/dao2-a-ffd-moneyflow-coverage-v1.yml'
  pull_request:
    branches:
      - gp/dao2-migration-20260920
    paths:
      - '.github/workflows/dao2-a-ffd-moneyflow-coverage-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FFD_API_KEY: ${{ secrets.FFD_API_KEY }}
    steps:
      - name: Retry historical minute large/extra-large order flow with backoff
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, random, time, urllib.error, urllib.request
          from pathlib import Path

          OUT=Path('artifact_ffd_moneyflow_coverage'); OUT.mkdir(exist_ok=True)
          token=os.environ.get('FFD_API_KEY','').strip()
          base='https://ffd.findesk.cn'
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','Accept':'application/json'}
          result={'artifact':'DAO2_A_FFD_MINUTE_ORDER_FLOW_HISTORY_PROBE_V1_1','secret_present':bool(token),'requests':[],'formal_admission_changed':False}
          if not token:
              result['status']='NO_FFD_API_KEY_SECRET'
          else:
              probes=[('300673.SZ','2021-09-24'),('000695.SZ','2023-05-22')]
              time.sleep(5)
              for idx,(code,date) in enumerate(probes,1):
                  payload={'codes':[code],'mode':'range','start_date':date+' 09:31:00','end_date':date+' 09:31:00','buckets':['large','extra_large']}
                  entry={'code':code,'trade_date':date,'payload':payload,'attempts':[]}
                  for attempt in range(1,5):
                      attempt_rec={'attempt':attempt}
                      try:
                          req=urllib.request.Request(base+'/api/v1/market/money-flow-minute',data=json.dumps(payload).encode('utf-8'),headers=headers,method='POST')
                          with urllib.request.urlopen(req,timeout=45) as resp:
                              raw=resp.read(); attempt_rec['http_status']=resp.status
                          attempt_rec['raw_sha256']=hashlib.sha256(raw).hexdigest(); attempt_rec['response']=json.loads(raw.decode('utf-8'))
                          (OUT/f'minute_{idx}.json').write_bytes(raw)
                          entry['attempts'].append(attempt_rec)
                          break
                      except urllib.error.HTTPError as e:
                          body=e.read(); attempt_rec['http_status']=e.code; attempt_rec['error_body_prefix']=body[:8000].decode('utf-8',errors='replace')
                          entry['attempts'].append(attempt_rec)
                          if e.code != 429: break
                          time.sleep(4*attempt + random.random())
                      except Exception as e:
                          attempt_rec['error']=f'{type(e).__name__}: {e}'; entry['attempts'].append(attempt_rec); break
                  result['requests'].append(entry)
                  time.sleep(6)
              result['status']='MINUTE_HISTORY_RETRY_COMPLETE'

          canonical=json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))
          result['content_sha256_without_hash_field']=hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'secret_present':result['secret_present'],'attempt_statuses':[[a.get('http_status') for a in r.get('attempts',[])] for r in result.get('requests',[])],'result_sha256':result['content_sha256_without_hash_field']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dao2-a-ffd-moneyflow-coverage-v1
          path: artifact_ffd_moneyflow_coverage/
          if-no-files-found: error
          retention-days: 30
