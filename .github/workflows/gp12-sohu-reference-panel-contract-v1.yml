name: GP12 Sohu Reference Panel Contract V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/test_gp12_sohu_reference_panel_v1.py'
      - 'scripts/gp12_sohu_reference_panel_v1.py'
      - '.github/workflows/gp12-sohu-reference-panel-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime
        run: python -m pip install -q pandas pyarrow
      - name: Run Sohu reference panel contract tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest -v scripts/test_gp12_sohu_reference_panel_v1.py
