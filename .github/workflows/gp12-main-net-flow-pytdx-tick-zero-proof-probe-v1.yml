name: gp12-main-net-flow-pytdx-tick-zero-proof-probe-v1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - .github/workflows/gp12-main-net-flow-pytdx-tick-zero-proof-probe-v1.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install pytdx and BaoStock
        run: python -m pip install --quiet pytdx baostock
      - name: Probe exact historical tick upper bounds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import baostock as bs
          from pytdx.hq import TdxHq_API
          try:
              from pytdx.config.hosts import hq_hosts
          except Exception:
              hq_hosts=[]

          targets=[
            (1,'600306','2020-06-08'),
            (1,'600898','2020-11-04'),
            (1,'603996','2021-02-24'),
            (1,'600112','2022-05-06'),
            (0,'002118','2023-05-22'),
            (0,'002503','2023-05-22'),
            (0,'002504','2023-05-22'),
          ]

          # Daily turnover reference from BaoStock; this is only used to prove transaction-data completeness.
          lg=bs.login()
          print('BAOSTOCK_LOGIN',lg.error_code,lg.error_msg)
          if lg.error_code!='0':
              raise SystemExit('FAIL_BAOSTOCK_REFERENCE_LOGIN')
          daily={}
          for market,code,day in targets:
              bcode=('sh.' if market==1 else 'sz.')+code
              rs=bs.query_history_k_data_plus(bcode,'date,code,amount',start_date=day,end_date=day,frequency='d',adjustflag='3')
              rows=[]
              if rs.error_code=='0':
                  while rs.next(): rows.append(dict(zip(rs.fields,rs.get_row_data())))
              daily[(market,code,day)]=float(rows[0]['amount']) if rows and rows[0].get('amount') else None
              print('DAILY_REF',market,code,day,daily[(market,code,day)])
          bs.logout()

          candidates=[
              ('119.147.212.81',7709),('101.227.73.20',7709),('101.227.77.254',7709),
              ('124.71.187.72',7709),('218.75.126.9',7709),('14.215.128.18',7709),
          ]
          for h in hq_hosts:
              try:
                  ip=h[1]; port=int(h[2])
                  if (ip,port) not in candidates: candidates.append((ip,port))
              except Exception:
                  pass

          api=None; connected=None
          for ip,port in candidates[:40]:
              a=TdxHq_API(heartbeat=False,auto_retry=False,raise_exception=False)
              try:
                  ok=a.connect(ip,port,time_out=1.5)
              except Exception as e:
                  print('TDX_CONNECT_ERROR',ip,port,type(e).__name__,str(e)); ok=False
              if ok:
                  api=a; connected=(ip,port); print('TDX_CONNECTED',ip,port); break
              try: a.disconnect()
              except Exception: pass
          if api is None:
              raise SystemExit('FAIL_TDX_NO_PUBLIC_HOST_CONNECTED')

          results=[]; proofs=[]
          for market,code,day in targets:
              dateint=int(day.replace('-',''))
              allrows=[]; start=0; page_size=888; seen_pages=set()
              for page in range(80):
                  try:
                      part=api.get_history_transaction_data(market,code,start,page_size,dateint) or []
                  except Exception as e:
                      print('TDX_FETCH_ERROR',code,day,start,type(e).__name__,str(e)); part=[]
                  if not part: break
                  fingerprint=(len(part),str(part[0]),str(part[-1]))
                  if fingerprint in seen_pages:
                      print('REPEATED_PAGE',code,day,start); break
                  seen_pages.add(fingerprint)
                  allrows.extend(part)
                  print('PAGE',code,day,start,len(part))
                  if len(part)<page_size: break
                  start += len(part)

              # Infer transaction volume unit from full-day sum against independent daily amount.
              raw=[]
              for r in allrows:
                  try:
                      p=float(r.get('price',0)); v=float(r.get('vol',0))
                      raw.append((p,v,r.get('buyorsell'),r.get('time')))
                  except Exception: pass
              ref=daily[(market,code,day)]
              candidates_units={}
              for mult in (1.0,100.0):
                  s=sum(p*v*mult for p,v,_,_ in raw)
                  diff=None if ref is None else abs(s-ref)
                  candidates_units[mult]=(s,diff)
              unit=None
              if ref is not None and raw:
                  unit=min(candidates_units,key=lambda x:candidates_units[x][1])
              amount_sum=candidates_units[unit][0] if unit is not None else None
              abs_diff=candidates_units[unit][1] if unit is not None else None
              complete=bool(ref is not None and amount_sum is not None and abs_diff<=max(1000.0,abs(ref)*0.003))
              tick_amounts=[p*v*unit for p,v,_,_ in raw] if unit is not None else []
              max_tick=max(tick_amounts) if tick_amounts else None
              provable=bool(complete and max_tick is not None and max_tick<200000.0)
              rec={
                  'market':market,'code':code,'trade_date':day,'tdx_rows':len(raw),
                  'daily_amount_cny':ref,'volume_multiplier':unit,
                  'tick_amount_sum_cny':amount_sum,'sum_abs_diff_cny':abs_diff,
                  'complete_vs_daily_0p3pct_or_1000':complete,
                  'max_tdx_record_amount_cny':max_tick,
                  'provable_zero_by_tdx_record_upper_bound':provable,
              }
              results.append(rec); print('RESULT',json.dumps(rec,ensure_ascii=False,sort_keys=True))
              if provable: proofs.append(rec)

          api.disconnect()
          print('SUMMARY',json.dumps({
              'connected_host':connected,'targets':len(targets),
              'with_ticks':sum(1 for x in results if x['tdx_rows']>0),
              'complete_count':sum(1 for x in results if x['complete_vs_daily_0p3pct_or_1000']),
              'provable_zero_count':len(proofs),
              'provable_zero_keys':[[x['code'],x['trade_date']] for x in proofs],
          },ensure_ascii=False,sort_keys=True))
          if not any(x['tdx_rows']>0 for x in results):
              raise SystemExit('FAIL_TDX_NO_HISTORICAL_TICKS')
          PY
