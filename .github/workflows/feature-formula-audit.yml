name: Feature Formula Audit
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/feature_formula_audit.py"
      - ".github/workflows/feature-formula-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"
      - run: python scripts/feature_formula_audit.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-formula-audit-${{ github.run_id }}
          path: artifacts/feature-formula-audit.json
          retention-days: 30
