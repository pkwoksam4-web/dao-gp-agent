name: GP V4.82 Sohu RAW Crosscheck

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - '.github/workflows/sohu-raw-crosscheck-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download completed Sohu probe artifact
        uses: actions/download-artifact@v4
        with:
          name: gp-sohu-raw-probe-v482
          path: sohu
          run-id: 34139530264
          github-token: ${{ github.token }}
      - name: Checkout exact frozen astock snapshot
        uses: actions/checkout@v4
        with:
          repository: newbiestring-lang/astock
          ref: 0babe4cf6c1a175c6b84add10803b4b1f9c6000c
          path: astock
          fetch-depth: 1
      - name: Install dependencies
        run: pip install -q pandas pyarrow numpy
      - name: Diagnose schema and crosscheck amount/volume
        run: |
          mkdir -p artifact_sohu_crosscheck_v482
          python - <<'PY'
          import json, pathlib, re
          import numpy as np
          import pandas as pd

          out=pathlib.Path('artifact_sohu_crosscheck_v482')
          sohu=pathlib.Path('sohu')
          targets={
              '002002.SZ':'astock/kline_002.parquet',
              '002359.SZ':'astock/kline_002.parquet',
              '300104.SZ':'astock/kline_300.parquet',
              '600074.SH':'astock/kline_600.parquet',
              '600614.SH':'astock/kline_600.parquet',
              '600634.SH':'astock/kline_600.parquet',
          }

          def norm_code(s):
              x=str(s).strip().upper()
              m=re.search(r'(\d{6})',x)
              if m: return m.group(1)
              try: return str(int(float(x))).zfill(6)
              except Exception: return x.zfill(6)

          def norm_date_series(s):
              if pd.api.types.is_datetime64_any_dtype(s):
                  return pd.to_datetime(s).dt.strftime('%Y-%m-%d')
              if pd.api.types.is_numeric_dtype(s):
                  z=s.astype('Int64').astype(str)
                  if z.str.fullmatch(r'\d{8}').fillna(False).all():
                      return pd.to_datetime(z,format='%Y%m%d',errors='coerce').dt.strftime('%Y-%m-%d')
              return pd.to_datetime(s.astype(str),errors='coerce').dt.strftime('%Y-%m-%d')

          cache={}; checks=[]; schema=[]
          for sym,p in targets.items():
              if p not in cache:
                  q=pd.read_parquet(p,columns=['code','date','volume','amount'])
                  schema.append({
                      'partition':p,'rows':len(q),
                      'code_dtype':str(q['code'].dtype),'date_dtype':str(q['date'].dtype),
                      'code_samples':[str(x) for x in q['code'].head(5).tolist()],
                      'date_samples':[str(x) for x in q['date'].head(5).tolist()],
                  })
                  q['code_norm']=q['code'].map(norm_code)
                  q['date_norm']=norm_date_series(q['date'])
                  cache[p]=q
              code=sym.split('.')[0]
              a=cache[p][cache[p]['code_norm']==code][['date_norm','volume','amount']].copy()
              a=a.rename(columns={'date_norm':'date'})
              csvp=sohu/f'{sym}.csv'
              if not csvp.exists():
                  checks.append({'symbol':sym,'status':'SOHU_CSV_MISSING'}); continue
              s=pd.read_csv(csvp,usecols=['date','volume','amount'])
              s['date']=s['date'].astype(str).str[:10]
              z=s.merge(a,on='date',suffixes=('_sohu','_astock'))
              if z.empty:
                  checks.append({
                      'symbol':sym,'status':'NO_COMMON_ROWS',
                      'sohu_rows':len(s),'astock_code_rows':len(a),
                      'sohu_first':s['date'].min() if len(s) else None,
                      'sohu_last':s['date'].max() if len(s) else None,
                      'astock_first':a['date'].min() if len(a) else None,
                      'astock_last':a['date'].max() if len(a) else None,
                  }); continue
              for c in ('volume','amount'):
                  denom=np.maximum(np.abs(z[c+'_astock'].astype(float)),1.0)
                  z[c+'_rel']=np.abs(z[c+'_sohu'].astype(float)-z[c+'_astock'].astype(float))/denom
              checks.append({
                  'symbol':sym,'status':'COMPARED','common_rows':len(z),
                  'sohu_rows':len(s),'astock_code_rows':len(a),
                  'volume_rel_median':float(z['volume_rel'].median()),
                  'volume_rel_p99':float(z['volume_rel'].quantile(.99)),
                  'volume_rel_max':float(z['volume_rel'].max()),
                  'amount_rel_median':float(z['amount_rel'].median()),
                  'amount_rel_p99':float(z['amount_rel'].quantile(.99)),
                  'amount_rel_max':float(z['amount_rel'].max()),
              })

          compared=[x for x in checks if x['status']=='COMPARED']
          report={
              'artifact':'SOHU_ASTOCK_CROSSCHECK_V482','version':'V4.82',
              'source_commit':'0babe4cf6c1a175c6b84add10803b4b1f9c6000c',
              'schema':schema,'checks':checks,
              'compared_symbol_n':len(compared),
              'formal_admission':False,'oos_metrics_allowed':False,
          }
          (out/'SOHU_ASTOCK_CROSSCHECK_V482.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          assert len(compared)>=5, report
          PY
      - name: Upload corrected crosscheck evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-sohu-astock-crosscheck-v482
          path: artifact_sohu_crosscheck_v482/
          if-no-files-found: error
          retention-days: 30
