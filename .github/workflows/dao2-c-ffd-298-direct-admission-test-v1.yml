name: DAO2 C FFD 298 Direct Admission Test V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - 'scripts/test_dao2_c_ffd_298_direct_admission_v1.py'
      - 'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_PATCH_V1.csv'
      - 'data/dao2/modules/C_SECTOR_FFD_298_DIRECT_BINDING_CHECKPOINT_V1.json'
      - '.github/workflows/dao2-c-ffd-298-direct-admission-test-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 298 direct admission contract tests
        run: python -m unittest -v scripts/test_dao2_c_ffd_298_direct_admission_v1.py
