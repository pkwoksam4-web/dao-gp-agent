name: GP V4.82 CNINFO Offline Rematch

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/cninfo_exact_term_v481.py'
      - 'scripts/rematch_cninfo_unresolved_v482.py'
      - 'scripts/test_rematch_cninfo_unresolved_v482.py'
      - '.github/workflows/cninfo-offline-rematch-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline rematch unit tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_rematch_cninfo_unresolved_v482.py

  rematch-and-materialize:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen 92/6 recovery raw evidence
        uses: actions/download-artifact@v4
        with:
          name: gp-cninfo-remaining-low-rate-recovery-v482
          path: recovery92
          run-id: 34110213720
          github-token: ${{ github.token }}
      - name: Offline-rematch the six unresolved raw responses
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/rematch_cninfo_unresolved_v482.py \
            --recovery-dir recovery92 \
            --out-dir artifact_cninfo_offline_rematch_v482
      - name: Verify 98/98 announcement location without network refetch
        run: |
          python - <<'PY'
          import json
          p='artifact_cninfo_offline_rematch_v482/CNINFO_UNRESOLVED_OFFLINE_REMATCH_V482.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['source_target_event_n']==98
          assert x['source_matched_event_n']==92
          assert x['source_unresolved_event_n']==6
          assert x['target_event_n']==6
          assert x['matched_event_n']==6
          assert x['unresolved_event_n']==0
          assert x['network_target_event_n']==0
          assert x['formal_promotion'] is False
          assert x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False
          assert x['oos_metrics_allowed'] is False
          print(json.dumps({
            'announcement_locator_checkpoint':'98/98',
            'offline_rematched_event_n':x['matched_event_n'],
            'network_refetch_event_n':x['network_target_event_n'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Install PDF text extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Materialize only the six newly rematched official PDFs
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/materialize_remaining_recovered_v482.py \
            --recovery-dir artifact_cninfo_offline_rematch_v482 \
            --out-dir artifact_cninfo_offline_rematch_pdfs_v482 \
            --workers 3
      - name: Verify six-PDF fail-closed evidence
        run: |
          python - <<'PY'
          import json
          p='artifact_cninfo_offline_rematch_pdfs_v482/RECOVERED_REMAINING_PDF_EVIDENCE_V482.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['source_target_event_n']==6
          assert x['source_matched_event_n']==6
          assert x['source_unresolved_event_n']==0
          assert x['matched_event_n']==6
          assert x['unique_announcement_n']==6
          assert x['pdf_text_ok_event_n']==6
          assert x['formal_promotion'] is False
          assert x['validated_global_provenance_emitted'] is False
          assert x['formal_ready'] is False
          assert x['oos_metrics_allowed'] is False
          print(json.dumps({
            'matched_event_n':x['matched_event_n'],
            'pdf_text_ok_event_n':x['pdf_text_ok_event_n'],
            'effective_term_event_n':x['effective_term_event_n'],
          },ensure_ascii=False,indent=2))
          PY
      - name: Upload offline rematch evidence
        uses: actions/upload-artifact@v4
        with:
          name: gp-cninfo-unresolved-offline-rematch-v482
          path: artifact_cninfo_offline_rematch_v482/
          if-no-files-found: error
          retention-days: 30
      - name: Upload six rematched official PDFs
        uses: actions/upload-artifact@v4
        with:
          name: gp-cninfo-unresolved-offline-rematch-pdfs-v482
          path: artifact_cninfo_offline_rematch_pdfs_v482/
          if-no-files-found: error
          retention-days: 30
