name: GP V4.82 CNINFO Offline Rematch

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/rematch_cninfo_unresolved_v482.py'
      - 'scripts/test_rematch_cninfo_unresolved_v482.py'
      - '.github/workflows/cninfo-offline-rematch-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline rematch unit tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_rematch_cninfo_unresolved_v482.py
