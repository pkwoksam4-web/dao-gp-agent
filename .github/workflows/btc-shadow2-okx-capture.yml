name: BTC Shadow2 OKX Capture

on:
  push:
    branches:
      - btc-shadow2-rest-rescue-20261009
    paths:
      - "runtime/btc_shadow2_okx_capture/**"
      - ".github/workflows/btc-shadow2-okx-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify frozen OKX collector tests
        working-directory: runtime/btc_shadow2_okx_capture
        run: python -m unittest -v test_okx_capture.py

      - name: Capture frozen OKX BTC-USDT-SWAP 5m history
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/btc-shadow2-okx
          python runtime/btc_shadow2_okx_capture/okx_capture.py \
            --out artifacts/btc-shadow2-okx
          rc=$?
          printf '%s\n' "$rc" > artifacts/btc-shadow2-okx/collector_exit_code.txt
          exit 0

      - name: Upload OKX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-shadow2-okx-${{ github.run_id }}
          path: artifacts/btc-shadow2-okx/
          if-no-files-found: error
          retention-days: 30

      - name: Propagate collector status
        if: always()
        shell: bash
        run: |
          test -f artifacts/btc-shadow2-okx/collector_exit_code.txt
          rc="$(cat artifacts/btc-shadow2-okx/collector_exit_code.txt)"
          exit "$rc"
