name: GP12 Status Binding Contract V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/test_gp12_status_binding_v1.py'
      - 'scripts/gp12_status_binding_v1.py'
      - '.github/workflows/gp12-status-binding-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run status binding validator tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest -v scripts/test_gp12_status_binding_v1.py
