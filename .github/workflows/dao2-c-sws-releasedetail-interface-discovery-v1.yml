name: DAO2 C SWS Releasedetail Interface Discovery V1

on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - '.github/workflows/dao2-c-sws-releasedetail-interface-discovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect official releasedetail frontend assets read-only
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, re, urllib.parse, urllib.request, ssl
          from pathlib import Path

          OUT = Path('artifact_sws_releasedetail_discovery')
          OUT.mkdir(exist_ok=True)
          BASE='https://www.swsresearch.com'
          pages=[
            BASE + '/institute_sw/allIndex/releasedIndex/releasedetail?code=801010&name=%E5%86%9C%E6%9E%97%E7%89%A7%E6%B8%94',
            BASE + '/institute_sw/allIndex/releasedIndex/releasedetail?code=801020&name=%E9%87%87%E6%8E%98',
          ]
          ctx=ssl._create_unverified_context()
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,*/*'}
          result={'artifact':'DAO2_C_SWS_RELEASEDETAIL_INTERFACE_DISCOVERY_V1','pages':[],'assets':[],'candidate_strings':[],'formal_admission_changed':False}

          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30,context=ctx) as r:
                  return r.status, r.geturl(), r.read()

          asset_urls=[]
          for url in pages:
              try:
                  status, final, raw=get(url)
                  text=raw.decode('utf-8','replace')
                  name='page_'+hashlib.sha256(url.encode()).hexdigest()[:10]+'.html'
                  (OUT/name).write_bytes(raw)
                  scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',text,re.I)
                  resolved=[urllib.parse.urljoin(final,s) for s in scripts]
                  asset_urls.extend([u for u in resolved if urllib.parse.urlparse(u).netloc.endswith('swsresearch.com')])
                  result['pages'].append({'url':url,'final_url':final,'http_status':status,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw),'scripts':resolved})
              except Exception as e:
                  result['pages'].append({'url':url,'error':f'{type(e).__name__}: {e}'})

          # dedupe, bounded asset fetch
          seen=set(); uniq=[]
          for u in asset_urls:
              if u not in seen:
                  seen.add(u); uniq.append(u)
          uniq=uniq[:30]
          needles=('api/','index_publish','trend','released','download','history','kline','day','quotation','quote','compare','export','excel')
          for i,url in enumerate(uniq,1):
              try:
                  status, final, raw=get(url)
                  if len(raw)>15_000_000:
                      result['assets'].append({'url':url,'http_status':status,'bytes':len(raw),'skipped_parse':'too_large'})
                      continue
                  text=raw.decode('utf-8','replace')
                  sha=hashlib.sha256(raw).hexdigest()
                  asset={'url':url,'final_url':final,'http_status':status,'sha256':sha,'bytes':len(raw)}
                  result['assets'].append(asset)
                  # Extract URL-like and nearby API-related strings from minified bundles.
                  candidates=set()
                  for pat in [r'https?://[^"\'\s)]+', r'/[A-Za-z0-9_./?-]{5,180}']:
                      for m in re.finditer(pat,text):
                          s=m.group(0)
                          sl=s.lower()
                          if any(n in sl for n in needles):
                              candidates.add(s[:300])
                  for n in needles:
                      pos=0
                      low=text.lower()
                      while True:
                          j=low.find(n,pos)
                          if j<0: break
                          candidates.add(text[max(0,j-180):min(len(text),j+320)])
                          pos=j+len(n)
                          if len(candidates)>800: break
                  result['candidate_strings'].extend([{'asset':url,'text':c} for c in sorted(candidates)[:500]])
              except Exception as e:
                  result['assets'].append({'url':url,'error':f'{type(e).__name__}: {e}'})

          # compact/dedupe candidates
          out=[]; seen_txt=set()
          for x in result['candidate_strings']:
              key=x['text']
              if key in seen_txt: continue
              seen_txt.add(key); out.append(x)
          result['candidate_strings']=out[:1200]
          result['page_success_count']=sum(1 for x in result['pages'] if x.get('http_status')==200)
          result['asset_success_count']=sum(1 for x in result['assets'] if x.get('http_status')==200)
          result['candidate_count']=len(result['candidate_strings'])
          result['status']='PASS_FRONTEND_DISCOVERY' if result['candidate_count'] else 'NO_INTERFACE_CANDIDATE_DISCOVERED'
          canonical=json.dumps(result,ensure_ascii=False,sort_keys=True,separators=(',',':'))
          result['content_sha256_without_hash_field']=hashlib.sha256(canonical.encode()).hexdigest()
          (OUT/'result.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':result['status'],'page_success_count':result['page_success_count'],'asset_success_count':result['asset_success_count'],'candidate_count':result['candidate_count'],'hash':result['content_sha256_without_hash_field']},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dao2-c-sws-releasedetail-interface-discovery-v1
          path: artifact_sws_releasedetail_discovery/result.json
          if-no-files-found: error
          retention-days: 30
