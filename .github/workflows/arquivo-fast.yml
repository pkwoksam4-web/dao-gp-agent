name: Fast Arquivo recovery

on:
  push:
    branches:
      - gp-arquivo-fast-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe Arquivo.pt
        shell: bash
        run: |
          set +e
          mkdir -p probe
          python - <<'PY'
          import json,urllib.parse,urllib.request,urllib.error,hashlib,concurrent.futures
          from pathlib import Path
          root=Path('probe'); ua='dao-gp-agent-provenance-probe/4.2'
          urls={
            'data_root':'https://github.com/leo-quant-research/data_lake',
            'data_arch':'https://github.com/leo-quant-research/data_lake/blob/main/docs/architecture.md',
            'data_qa':'https://github.com/leo-quant-research/data_lake/blob/main/docs/qa_p0_p3_20260713.md',
            'data_raw_arch':'https://raw.githubusercontent.com/leo-quant-research/data_lake/main/docs/architecture.md',
            'data_cursor':'https://github.com/leo-quant-research/data_lake/blob/main/.cursor/rules/lake-factor-lab-coordination.mdc',
            'alpha_root':'https://github.com/leo-quant-research/AlphaAgent',
            'alpha_readme':'https://github.com/leo-quant-research/AlphaAgent/blob/main/README.md',
            'alpha_cursor':'https://github.com/leo-quant-research/AlphaAgent/blob/main/.cursor/rules/agent-json-outputs.mdc'
          }
          terms={
            'rolling':'rolling_rank_quantile_weighted_stats_fast',
            'legacy':'legacy_codes WHC',
            'factors':'liquidity_cut growth_moti',
            'pkl':'factors_raw.pkl df_z_e',
            'script':'0_5_1 df_raw'
          }
          def get(name,url):
            req=urllib.request.Request(url,headers={'User-Agent':ua})
            st=None; data=b''; err=''
            try:
              with urllib.request.urlopen(req,timeout=35) as r:st=getattr(r,'status',200);data=r.read()
            except urllib.error.HTTPError as e:
              st=e.code
              try:data=e.read()
              except:data=b''
              err=repr(e)
            except Exception as e:err=repr(e)
            (root/f'{name}.status').write_text(str(st or 'ERR'))
            (root/f'{name}.body').write_bytes(data)
            (root/f'{name}.err').write_text(err)
            return name,st,data,err
          queries=[]
          for n,u in urls.items():
            q='https://arquivo.pt/textsearch?'+urllib.parse.urlencode({'versionHistory':u,'from':'20260701','to':'20260914','maxItems':'100','prettyPrint':'false'})
            queries.append((n+'_history',q))
          for n,t in terms.items():
            q='https://arquivo.pt/textsearch?'+urllib.parse.urlencode({'q':t,'from':'20260701','to':'20260914','maxItems':'100','prettyPrint':'false'})
            queries.append(('text_'+n,q))
          results=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as ex:
            for n,st,b,e in ex.map(lambda x:get(*x),queries):
              rec={'name':n,'status':st,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest() if b else None,'error':e}
              try:
                o=json.loads(b); items=o.get('response_items') or [] if isinstance(o,dict) else []
                rec['count']=len(items); rec['urls']=sorted({i.get('originalURL') for i in items if isinstance(i,dict) and i.get('originalURL')})
              except:rec['count']=None
              results.append(rec)
          (root/'summary.json').write_text(json.dumps(sorted(results,key=lambda x:x['name']),ensure_ascii=False,indent=2))
          print(json.dumps(results,ensure_ascii=False)[:15000])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arquivo-fast-recovery-20260914
          path: probe/
          retention-days: 30
