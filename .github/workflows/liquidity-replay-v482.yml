name: GP V4.82 Frozen Liquidity Replay

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/liquidity_replay_v482.py'
      - 'scripts/test_liquidity_replay_v482.py'
      - '.github/workflows/liquidity-replay-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: pip install -q pandas
      - name: Frozen liquidity unit tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_liquidity_replay_v482.py

  replay:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Checkout exact public astock snapshot
        uses: actions/checkout@v4
        with:
          repository: newbiestring-lang/astock
          ref: 0babe4cf6c1a175c6b84add10803b4b1f9c6000c
          path: input/astock
          fetch-depth: 1
      - name: Install replay dependencies
        run: pip install -q pandas pyarrow numpy
      - name: Verify frozen astock byte identity
        run: |
          test "$(sha256sum input/astock/kline_002.parquet | awk '{print $1}')" = "f7e09d35183863f66ac5f72edf28135d59a0eb6577ca12720acfaf1855cc800e"
          echo 'PASS kline_002 frozen SHA256 identity'
      - name: Replay candidate V3.70 liquidity semantics
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/liquidity_replay_v482.py \
            --astock-dir input/astock \
            --out-dir artifact_liquidity_replay_v482
      - name: Upload V4.82 liquidity replay artifact
        uses: actions/upload-artifact@v4
        with:
          name: gp-liquidity-replay-v482
          path: artifact_liquidity_replay_v482/
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact frozen 80M eligibility replay
        run: |
          python - <<'PY'
          import json
          x=json.load(open('artifact_liquidity_replay_v482/LIQUIDITY_REPLAY_V482.json',encoding='utf-8'))
          s=x['source']
          assert s['kline_002_sha_match'] is True
          assert s['rows_read']==6006046, s
          assert s['symbols']==5322, s
          assert s['calendar_days']==1426, s
          assert x['frozen_80m_status']=='CLOSED_REPRODUCED_V370_80M', x
          assert x['frozen_80m_variant']=='market_day_zero_prior120_positive_summary', x
          assert x['eligibility_logic_residual_n']==0, x
          # Historical six-threshold reporting retains only tiny quantile residuals;
          # it is audit evidence and does not alter the already frozen 80M rule.
          assert x['six_threshold_reporting_residual_n']==5, x
          assert all(r['field'] in {
              'median_daily_passing_pre_st','p10_daily_passing_pre_st',
              'p25_daily_passing_pre_st','p90_daily_passing_pre_st'
          } for r in x['six_threshold_reporting_residuals'])
          print(json.dumps({
              'source':s,
              'frozen_80m_status':x['frozen_80m_status'],
              'frozen_80m_variant':x['frozen_80m_variant'],
              'eligibility_logic_residual_n':x['eligibility_logic_residual_n'],
              'six_threshold_reporting_residual_n':x['six_threshold_reporting_residual_n'],
          },indent=2))
          PY
