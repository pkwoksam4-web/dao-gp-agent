name: GP12 Main Net Flow Offline Parquet Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-offline-parquet-probe-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install -q pandas pyarrow requests
      - name: Download and inspect public offline parquet
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd, requests

          url='https://raw.githubusercontent.com/henrylin99/screener-offline-data/main/data.parquet'
          r=requests.get(url,timeout=60)
          print('HTTP',r.status_code,'BYTES',len(r.content))
          r.raise_for_status()
          p=Path('data.parquet'); p.write_bytes(r.content)
          print('SHA256',hashlib.sha256(r.content).hexdigest())
          df=pd.read_parquet(p)
          print('ROWS',len(df),'COLS',len(df.columns))
          print('COLUMNS',json.dumps(list(df.columns),ensure_ascii=False))
          date_col='trade_date' if 'trade_date' in df.columns else ('date' if 'date' in df.columns else None)
          sym_col='ts_code' if 'ts_code' in df.columns else ('symbol' if 'symbol' in df.columns else None)
          if date_col:
              d=pd.to_datetime(df[date_col],errors='coerce')
              print('DATE_MIN',d.min(),'DATE_MAX',d.max(),'DATE_NUNIQUE',d.nunique())
          if sym_col:
              print('SYMBOL_N',df[sym_col].astype(str).nunique())
          fields=['net_mf_amount','buy_lg_amount','sell_lg_amount','buy_elg_amount','sell_elg_amount']
          for c in fields:
              if c in df.columns:
                  s=pd.to_numeric(df[c],errors='coerce')
                  print(c,'NONNULL',int(s.notna().sum()),'MIN',s.min(),'MAX',s.max())
          if date_col and sym_col:
              sample=df.sort_values([date_col,sym_col]).head(3)
              keep=[c for c in [sym_col,date_col,*fields] if c in df.columns]
              print('SAMPLE',sample[keep].to_json(orient='records',force_ascii=False))
          PY
