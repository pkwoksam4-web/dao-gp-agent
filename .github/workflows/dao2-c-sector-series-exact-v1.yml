name: DAO2 C Sector Series Exact Audit V1
on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - 'scripts/dao2_c_sector_series_exact_v1.py'
      - '.github/workflows/dao2-c-sector-series-exact-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas pyarrow akshare
      - name: Download frozen Formal calendar
        uses: actions/download-artifact@v4
        with:
          name: gp-pit-st-v480-final-audit
          path: calendar-final
          run-id: 33977325822
          github-token: ${{ github.token }}
      - name: Pin taxonomy manifest
        run: |
          mkdir -p upstream artifact_series
          curl -fsSL 'https://raw.githubusercontent.com/Jessica-Zhangyj/dlquant/6b245fa09cb628f3bcb812f0662bfef520e65fb4/xst/xst_quant_experiments_20260613/03_desktop_quant_results_light/b1_tft_download/data_provenance/industry_taxonomy_manifest.json' -o upstream/industry_taxonomy_manifest.json
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p=Path("upstream/industry_taxonomy_manifest.json"); b=p.read_bytes()
          got=hashlib.sha1(b"blob "+str(len(b)).encode()+b"\0"+b).hexdigest()
          assert got=="4e00b89478581e85bf37938a8b935bdbb21a0875",(got,)
          print(got)
          PY
      - name: Materialize and close same-day gaps
        run: |
          python scripts/dao2_c_sector_series_exact_v1.py             --calendar calendar-final/OFFICIAL_A_SHARE_OPEN_DATES_V357.csv             --taxonomy upstream/industry_taxonomy_manifest.json             --out artifact_series
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dao2-c-sector-series-exact-v1
          path: artifact_series/
          if-no-files-found: warn
          retention-days: 30
