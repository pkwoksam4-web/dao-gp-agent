name: GP BaoStock one-symbol full-range intraday V482

on:
  push:
    branches:
      - gp/baostock-fullraw-crosscheck-v482
    paths:
      - '.github/workflows/baostock-intraday-fullrange-one-symbol-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BaoStock
        run: python -m pip install --upgrade pip baostock==0.9.3 pandas
      - name: Pull and audit full Formal range
        run: |
          mkdir -p out/baostock_intraday_fullrange
          python - <<'PY'
          import json, time
          from pathlib import Path
          import pandas as pd
          import baostock as bs

          symbol='000001.SZ'
          code='sz.000001'
          start='2020-06-01'
          end='2026-04-17'
          fields='date,time,code,open,high,low,close,volume,amount,adjustflag'

          lg=bs.login()
          if lg.error_code!='0':
              raise RuntimeError(f'login failed {lg.error_code}: {lg.error_msg}')
          results={}
          try:
              for freq in ('15','60'):
                  t0=time.time()
                  rs=bs.query_history_k_data_plus(code,fields,start_date=start,end_date=end,frequency=freq,adjustflag='3')
                  rows=[]
                  while rs.error_code=='0' and rs.next():
                      rows.append(rs.get_row_data())
                  elapsed=time.time()-t0
                  df=pd.DataFrame(rows,columns=fields.split(','))
                  if rs.error_code!='0':
                      raise RuntimeError(f'{freq}m query failed {rs.error_code}: {rs.error_msg}')
                  df['date_key']=pd.to_datetime(df['date']).dt.strftime('%Y-%m-%d')
                  df['time_key']=df['time'].astype(str)
                  for c in ['open','high','low','close','volume','amount']:
                      df[c]=pd.to_numeric(df[c],errors='coerce')
                  dup=int(df.duplicated(['date_key','time_key']).sum())
                  bad_ohlc=int((
                      df[['open','high','low','close']].isna().any(axis=1)
                      | (df['high'] < df[['open','close','low']].max(axis=1))
                      | (df['low'] > df[['open','close','high']].min(axis=1))
                  ).sum())
                  bad_volume=int(((df['volume'].isna()) | (df['volume']<0)).sum())
                  bad_amount=int(((df['amount'].isna()) | (df['amount']<0)).sum())
                  per_day=df.groupby('date_key').size()
                  expected=16 if freq=='15' else 4
                  irregular=per_day[per_day!=expected]
                  results[f'{freq}m']={
                      'rows':int(len(df)),
                      'trade_dates':int(df['date_key'].nunique()),
                      'first_date':df['date_key'].min() if len(df) else None,
                      'last_date':df['date_key'].max() if len(df) else None,
                      'duplicate_date_time_rows':dup,
                      'bad_ohlc_rows':bad_ohlc,
                      'bad_volume_rows':bad_volume,
                      'bad_amount_rows':bad_amount,
                      'expected_bars_per_full_day':expected,
                      'irregular_day_n':int(len(irregular)),
                      'irregular_day_examples':[{ 'date':d, 'bars':int(n)} for d,n in irregular.head(20).items()],
                      'elapsed_seconds':round(elapsed,3),
                      'first_time':str(df['time_key'].iloc[0]) if len(df) else None,
                      'last_time':str(df['time_key'].iloc[-1]) if len(df) else None,
                      'all_adjustflag_3':bool((df['adjustflag'].astype(str)=='3').all()) if len(df) else False,
                  }
                  df.to_csv(f'out/baostock_intraday_fullrange/BAOSTOCK_{freq}M_000001_V482.csv',index=False)
          finally:
              bs.logout()

          audit={
              'artifact':'BAOSTOCK_INTRADAY_FULLRANGE_ONE_SYMBOL_V482',
              'version':'V4.82',
              'symbol':symbol,
              'formal_window':[start,end],
              'results':results,
              'promotion':{'formal_admission':False,'oos_metrics_allowed':False},
          }
          Path('out/baostock_intraday_fullrange/BAOSTOCK_INTRADAY_FULLRANGE_ONE_SYMBOL_V482.json').write_text(
              json.dumps(audit,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY
      - name: Verify structural integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('out/baostock_intraday_fullrange/BAOSTOCK_INTRADAY_FULLRANGE_ONE_SYMBOL_V482.json').read_text())
          for k in ('15m','60m'):
              r=x['results'][k]
              assert r['rows']>0
              assert r['first_date']=='2020-06-01'
              assert r['last_date']=='2026-04-17'
              assert r['duplicate_date_time_rows']==0
              assert r['bad_ohlc_rows']==0
              assert r['bad_volume_rows']==0
              assert r['bad_amount_rows']==0
              assert r['all_adjustflag_3'] is True
          assert x['promotion']['formal_admission'] is False
          assert x['promotion']['oos_metrics_allowed'] is False
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-baostock-intraday-fullrange-one-symbol-v482
          path: out/baostock_intraday_fullrange/
          if-no-files-found: warn
          retention-days: 30
