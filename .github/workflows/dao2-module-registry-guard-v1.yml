name: DAO2 Module Registry Guard V1
on:
  push:
    branches:
      - gp/dao2-migration-20260920
    paths:
      - 'data/DAO2_MODULE_REGISTRY_V1.json'
      - 'docs/dao2/MODULE_SPLIT_V1.md'
      - 'scripts/dao2_module_state_guard_v1.py'
      - 'scripts/test_dao2_module_state_guard_v1.py'
      - '.github/workflows/dao2-module-registry-guard-v1.yml'
  pull_request:
    paths:
      - 'data/DAO2_MODULE_REGISTRY_V1.json'
      - 'scripts/dao2_module_state_guard_v1.py'
      - 'scripts/test_dao2_module_state_guard_v1.py'
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test segmented module guard
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_dao2_module_state_guard_v1.py
