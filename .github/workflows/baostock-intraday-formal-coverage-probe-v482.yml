name: GP BaoStock intraday Formal coverage probe V482

on:
  push:
    branches:
      - gp/baostock-fullraw-crosscheck-v482
    paths:
      - '.github/workflows/baostock-intraday-formal-coverage-probe-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install BaoStock
        run: python -m pip install --upgrade pip baostock==0.9.3
      - name: Probe dated 15m and 60m history
        run: |
          mkdir -p out/baostock_intraday_probe
          python - <<'PY'
          import csv, json
          from pathlib import Path
          import baostock as bs

          probes = [
            ('000001.SZ', '2020-06-01'),
            ('000001.SZ', '2021-01-04'),
            ('000001.SZ', '2022-01-04'),
            ('000001.SZ', '2024-01-02'),
            ('000001.SZ', '2026-04-17'),
            ('002001.SZ', '2020-06-01'),
            ('002001.SZ', '2026-04-17'),
          ]
          freqs = ['15', '60']
          fields = 'date,time,code,open,high,low,close,volume,amount,adjustflag'

          def bs_code(symbol):
              code, exch = symbol.split('.')
              return f'{exch.lower()}.{code}'

          lg = bs.login()
          if lg.error_code != '0':
              raise RuntimeError(f'login failed {lg.error_code}: {lg.error_msg}')
          rows=[]
          try:
              for symbol, day in probes:
                  for freq in freqs:
                      rs=bs.query_history_k_data_plus(
                          bs_code(symbol), fields,
                          start_date=day, end_date=day,
                          frequency=freq, adjustflag='3')
                      data=[]
                      while rs.error_code == '0' and rs.next():
                          data.append(rs.get_row_data())
                      item={
                          'symbol':symbol,'date':day,'frequency':freq,
                          'error_code':rs.error_code,'error_msg':rs.error_msg,
                          'row_n':len(data),
                          'first_time':data[0][1] if data else None,
                          'last_time':data[-1][1] if data else None,
                          'first_close':data[0][6] if data else None,
                          'last_close':data[-1][6] if data else None,
                          'all_adjustflag_3': all(r[9] == '3' for r in data) if data else None,
                      }
                      rows.append(item)
                      print(json.dumps(item, ensure_ascii=False))
          finally:
              bs.logout()

          out=Path('out/baostock_intraday_probe')
          (out/'BAOSTOCK_INTRADAY_FORMAL_COVERAGE_PROBE_V482.json').write_text(
              json.dumps({
                  'artifact':'BAOSTOCK_INTRADAY_FORMAL_COVERAGE_PROBE_V482',
                  'version':'V4.82',
                  'scope':'capability probe only; no Formal/OOS promotion',
                  'formal_window':['2020-06-01','2026-04-17'],
                  'results':rows,
                  'promotion':{'formal_admission':False,'oos_metrics_allowed':False},
              },ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          with (out/'BAOSTOCK_INTRADAY_FORMAL_COVERAGE_PROBE_V482.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]))
              w.writeheader(); w.writerows(rows)
          PY
      - name: Summarize coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('out/baostock_intraday_probe/BAOSTOCK_INTRADAY_FORMAL_COVERAGE_PROBE_V482.json').read_text())
          early=[r for r in x['results'] if r['date'] in {'2020-06-01','2021-01-04'}]
          late=[r for r in x['results'] if r['date']=='2026-04-17']
          print(json.dumps({
            'early_rows':[{k:r[k] for k in ('symbol','date','frequency','error_code','row_n')} for r in early],
            'late_rows':[{k:r[k] for k in ('symbol','date','frequency','error_code','row_n')} for r in late],
            'formal_admission':x['promotion']['formal_admission'],
            'oos_metrics_allowed':x['promotion']['oos_metrics_allowed'],
          },ensure_ascii=False,indent=2))
          assert x['promotion']['formal_admission'] is False
          assert x['promotion']['oos_metrics_allowed'] is False
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gp-baostock-intraday-formal-coverage-probe-v482
          path: out/baostock_intraday_probe/
          if-no-files-found: warn
          retention-days: 30
