name: GP BaoStock stopped-turn anomaly audit V482

on:
  push:
    branches: [gp/baostock-fullraw-crosscheck-v482]
    paths: ['.github/workflows/baostock-turnover-stopped-anomaly-audit-v482.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pandas
      - name: Download all sealed turnover shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gp-baostock-turnover-full847-shard-*
          path: upstream/shards
          merge-multiple: true
          run-id: 34459482270
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pkwoksam4-web/dao-gp-agent
      - name: Classify stopped turnover rows
        run: |
          mkdir -p out/stopped_turn_audit
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          files=sorted(Path('upstream/shards').glob('BAOSTOCK_TURNOVER_FULL847_SHARD_*_ROWS_V482.csv'))
          assert len(files)==12, len(files)
          d=pd.concat([pd.read_csv(p,dtype={'symbol':str,'date':str}) for p in files],ignore_index=True)
          for c in ['volume','amount','turn','tradestatus','isST']:
              d[c]=pd.to_numeric(d[c],errors='coerce')
          stopped=d[~d['tradestatus'].eq(1)].copy()
          a=stopped[stopped['turn'].notna()].copy().sort_values(['symbol','date'])
          a['zero_volume']=a['volume'].fillna(0).eq(0)
          a['zero_amount']=a['amount'].fillna(0).eq(0)
          a['turn_zero']=a['turn'].eq(0)
          grouped=(a.groupby('symbol').agg(
              rows=('date','size'),
              first_date=('date','min'),
              last_date=('date','max'),
              zero_volume_rows=('zero_volume','sum'),
              zero_amount_rows=('zero_amount','sum'),
              zero_turn_rows=('turn_zero','sum'),
              turn_min=('turn','min'),
              turn_max=('turn','max'),
          ).reset_index().sort_values(['rows','symbol'],ascending=[False,True]))
          audit={
            'artifact':'BAOSTOCK_STOPPED_TURN_ANOMALY_AUDIT_V482',
            'version':'V4.82',
            'source_run_id':34459482270,
            'stopped_rows_total':int(len(stopped)),
            'stopped_turn_nonmissing_n':int(len(a)),
            'affected_symbol_n':int(a['symbol'].nunique()),
            'zero_volume_n':int(a['zero_volume'].sum()),
            'zero_amount_n':int(a['zero_amount'].sum()),
            'turn_zero_n':int(a['turn_zero'].sum()),
            'positive_turn_n':int((a['turn']>0).sum()),
            'affected_symbols':grouped.to_dict('records'),
            'rows':a[['symbol','date','volume','amount','turn','tradestatus','isST']].to_dict('records'),
            'promotion':{'formal_admission':False,'turnover_ratio_blocker_closed':False,'oos_metrics_allowed':False},
          }
          Path('out/stopped_turn_audit/BAOSTOCK_STOPPED_TURN_ANOMALY_AUDIT_V482.json').write_text(json.dumps(audit,ensure_ascii=False,sort_keys=True,indent=2)+'\n',encoding='utf-8')
          a.to_csv('out/stopped_turn_audit/BAOSTOCK_STOPPED_TURN_ROWS_V482.csv',index=False)
          grouped.to_csv('out/stopped_turn_audit/BAOSTOCK_STOPPED_TURN_SYMBOLS_V482.csv',index=False)
          print(json.dumps({k:audit[k] for k in ['stopped_rows_total','stopped_turn_nonmissing_n','affected_symbol_n','zero_volume_n','zero_amount_n','turn_zero_n','positive_turn_n','affected_symbols']},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gp-baostock-stopped-turn-anomaly-audit-v482
          path: out/stopped_turn_audit/
          if-no-files-found: error
          retention-days: 30
