name: GP V4.82 CNINFO Remaining Title Variants

on:
  push:
    branches:
      - gp/v482-special-exright
    paths:
      - 'scripts/cninfo_exact_term_v481.py'
      - 'scripts/test_cninfo_title_variants_v482.py'
      - '.github/workflows/cninfo-title-variants-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remaining CNINFO title variant tests
        env:
          PYTHONPATH: scripts
        run: |
          cd scripts
          python -m unittest -v test_cninfo_title_variants_v482.py
