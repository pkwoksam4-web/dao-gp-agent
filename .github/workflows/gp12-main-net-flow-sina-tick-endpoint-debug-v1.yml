name: gp12-main-net-flow-sina-tick-endpoint-debug-v1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - .github/workflows/gp12-main-net-flow-sina-tick-endpoint-debug-v1.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Sina historical tick endpoint responses
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request, urllib.parse
          urls=[
            'https://market.finance.sina.com.cn/transHis.php?'+urllib.parse.urlencode({'symbol':'sh600421','date':'2020-06-04','page':1}),
            'http://market.finance.sina.com.cn/transHis.php?'+urllib.parse.urlencode({'symbol':'sh600421','date':'2020-06-04','page':1}),
            'https://vip.stock.finance.sina.com.cn/quotes_service/view/vMS_tradehistory.php?'+urllib.parse.urlencode({'symbol':'sh600421','date':'2020-06-04','page':1}),
            'http://vip.stock.finance.sina.com.cn/quotes_service/view/vMS_tradehistory.php?'+urllib.parse.urlencode({'symbol':'sh600421','date':'2020-06-04','page':1}),
            'https://money.finance.sina.com.cn/quotes_service/view/vMS_tradehistory.php?'+urllib.parse.urlencode({'symbol':'sh600421','date':'2020-06-04','page':1}),
          ]
          for url in urls:
              print('\nURL',url)
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://finance.sina.com.cn/'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      b=r.read()
                      print('STATUS',r.status,'FINAL',r.geturl(),'BYTES',len(b),'CONTENT_TYPE',r.headers.get('Content-Type'))
              except Exception as e:
                  print('ERROR',type(e).__name__,e)
                  continue
              s=''
              for enc in ('gb18030','gbk','utf-8'):
                  try:
                      s=b.decode(enc); break
                  except Exception: pass
              print('HEAD',repr(s[:3000]))
              print('HAS_BUY', '买盘' in s, 'HAS_SELL', '卖盘' in s, 'HAS_TIME', '成交时间' in s)
          PY
