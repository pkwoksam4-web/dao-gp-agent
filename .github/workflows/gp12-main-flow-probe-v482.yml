name: GP12 Main Net Flow Probe V4.82

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v482
    paths:
      - '.github/workflows/gp12-main-flow-probe-v482.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  parameter-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Eastmoney fund-flow parameter behavior
        run: |
          mkdir -p artifact
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from pathlib import Path

          HOSTS = [
              'https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get',
              'https://push2.eastmoney.com/api/qt/stock/fflow/daykline/get',
          ]
          UT = 'b2884a393a59ad64002292a3e90d46a5'
          FIELDS1 = 'f1,f2,f3,f7'
          FIELDS2 = 'f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61'

          def secid(symbol):
              code, exch = symbol.split('.')
              return f'{"0" if exch == "SZ" else "1"}.{code}'

          variants = [
              ('baseline_lmt5000_klt101', {'lmt':'5000','klt':'101'}),
              ('lmt0_klt101', {'lmt':'0','klt':'101'}),
              ('lmt1000_klt101', {'lmt':'1000','klt':'101'}),
              ('lmt5000_klt101_ut', {'lmt':'5000','klt':'101','ut':UT}),
              ('lmt0_klt101_ut', {'lmt':'0','klt':'101','ut':UT}),
              ('lmt0_klt1_ut', {'lmt':'0','klt':'1','ut':UT}),
              ('lmt5000_klt101_ut_begend', {
                  'lmt':'5000','klt':'101','ut':UT,'beg':'20200601','end':'20260417'}),
              ('lmt0_klt101_ut_begend', {
                  'lmt':'0','klt':'101','ut':UT,'beg':'20200601','end':'20260417'}),
          ]
          symbols = ['000001.SZ','600634.SH']
          out = {
              'artifact':'GP12_MAIN_NET_FLOW_PARAMETER_PROBE_V482',
              'hypothesis':'The 120-row response is controlled by request parameters or host selection rather than parser logic.',
              'symbols':symbols,
              'variants':[],
              'formal_admission':False,
              'oos_metrics_allowed':False,
          }

          for symbol in symbols:
              for host in HOSTS:
                  for name, delta in variants:
                      params = {
                          'secid':secid(symbol),
                          'fields1':FIELDS1,
                          'fields2':FIELDS2,
                          **delta,
                      }
                      url = host + '?' + urllib.parse.urlencode(params)
                      rec = {
                          'symbol':symbol,
                          'host':host.split('/')[2],
                          'variant':name,
                          'params':delta,
                      }
                      try:
                          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 GP12-V482-PROBE'})
                          with urllib.request.urlopen(req, timeout=30) as response:
                              body = response.read()
                              rec['http_status'] = int(response.status)
                              rec['content_type'] = response.headers.get('content-type')
                          payload = json.loads(body.decode('utf-8'))
                          data = payload.get('data') if isinstance(payload, dict) else None
                          klines = data.get('klines') if isinstance(data, dict) else None
                          dates = []
                          if isinstance(klines, list):
                              for row in klines:
                                  if isinstance(row, str) and row:
                                      dates.append(row.split(',',1)[0][:10])
                          rec.update({
                              'status':'RESPONDED',
                              'rc':payload.get('rc') if isinstance(payload,dict) else None,
                              'rt':payload.get('rt') if isinstance(payload,dict) else None,
                              'data_is_null':data is None,
                              'data_keys':sorted(data.keys()) if isinstance(data,dict) else [],
                              'row_count':len(klines) if isinstance(klines,list) else None,
                              'first_date':min(dates) if dates else None,
                              'last_date':max(dates) if dates else None,
                              'payload_total':data.get('total') if isinstance(data,dict) else None,
                              'payload_name':data.get('name') if isinstance(data,dict) else None,
                          })
                      except Exception as exc:
                          rec.update({'status':'FAILED','error_type':type(exc).__name__,'error':str(exc)})
                      out['variants'].append(rec)

          Path('artifact/GP12_MAIN_NET_FLOW_PARAMETER_PROBE_V482.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gp12-main-net-flow-parameter-probe-v482
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
