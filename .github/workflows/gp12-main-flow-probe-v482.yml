name: GP12 Main Net Flow Probe V4.82

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v482
    paths:
      - '.github/workflows/gp12-main-flow-probe-v482.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fresh-runner-probe:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - variant: baseline_lmt5000_klt101
            lmt: '5000'
            klt: '101'
            use_ut: '0'
            use_begend: '0'
          - variant: lmt0_klt101
            lmt: '0'
            klt: '101'
            use_ut: '0'
            use_begend: '0'
          - variant: lmt0_klt101_ut
            lmt: '0'
            klt: '101'
            use_ut: '1'
            use_begend: '0'
          - variant: lmt0_klt1_ut
            lmt: '0'
            klt: '1'
            use_ut: '1'
            use_begend: '0'
          - variant: lmt0_klt101_ut_begend
            lmt: '0'
            klt: '101'
            use_ut: '1'
            use_begend: '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One isolated Eastmoney request
        env:
          VARIANT: ${{ matrix.variant }}
          LMT: ${{ matrix.lmt }}
          KLT: ${{ matrix.klt }}
          USE_UT: ${{ matrix.use_ut }}
          USE_BEGEND: ${{ matrix.use_begend }}
        run: |
          mkdir -p artifact
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from pathlib import Path

          host='https://push2his.eastmoney.com/api/qt/stock/fflow/daykline/get'
          params={
              'secid':'0.000001',
              'lmt':os.environ['LMT'],
              'klt':os.environ['KLT'],
              'fields1':'f1,f2,f3,f7',
              'fields2':'f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61,f62,f63,f64,f65',
          }
          if os.environ['USE_UT']=='1':
              params['ut']='b2884a393a59ad64002292a3e90d46a5'
          if os.environ['USE_BEGEND']=='1':
              params['beg']='20200601'; params['end']='20260417'
          url=host+'?'+urllib.parse.urlencode(params)
          out={'artifact':'GP12_MAIN_NET_FLOW_FRESH_RUNNER_PROBE_V482','variant':os.environ['VARIANT'],'params':params,'formal_admission':False,'oos_metrics_allowed':False}
          try:
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36',
                  'Referer':'https://data.eastmoney.com/zjlx/000001.html',
                  'Origin':'https://data.eastmoney.com',
              })
              with urllib.request.urlopen(req,timeout=30) as response:
                  body=response.read()
                  out['http_status']=int(response.status)
                  out['content_type']=response.headers.get('content-type')
              payload=json.loads(body.decode('utf-8'))
              data=payload.get('data') if isinstance(payload,dict) else None
              klines=data.get('klines') if isinstance(data,dict) else None
              dates=[row.split(',',1)[0][:10] for row in klines or [] if isinstance(row,str) and row]
              out.update({
                  'status':'RESPONDED',
                  'rc':payload.get('rc') if isinstance(payload,dict) else None,
                  'rt':payload.get('rt') if isinstance(payload,dict) else None,
                  'data_keys':sorted(data.keys()) if isinstance(data,dict) else [],
                  'row_count':len(klines) if isinstance(klines,list) else None,
                  'first_date':min(dates) if dates else None,
                  'last_date':max(dates) if dates else None,
                  'payload_name':data.get('name') if isinstance(data,dict) else None,
              })
          except Exception as exc:
              out.update({'status':'FAILED','error_type':type(exc).__name__,'error':str(exc)})
          path=Path('artifact')/f"{os.environ['VARIANT']}.json"
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gp12-main-flow-${{ matrix.variant }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 30
