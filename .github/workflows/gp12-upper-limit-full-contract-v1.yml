name: GP12 Upper Limit Full Contract V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - 'scripts/test_gp12_upper_limit_full_v1.py'
      - 'scripts/gp12_upper_limit_full_v1.py'
      - 'scripts/gp12_upper_limit_rule_v1.py'
      - '.github/workflows/gp12-upper-limit-full-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install -q pandas
      - name: Run full upper-limit contract
        env:
          PYTHONPATH: scripts
        run: python -m unittest -v scripts/test_gp12_upper_limit_full_v1.py
