name: BTC Shadow2 Funding REST Capture

on:
  push:
    branches:
      - btc-shadow2-rest-rescue-20261009
    paths:
      - "runtime/btc_shadow2_funding_rest_capture/**"
      - ".github/workflows/btc-shadow2-funding-rest-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run funding REST capture contract tests
        working-directory: runtime/btc_shadow2_funding_rest_capture
        run: python -m unittest -v test_capture.py

      - name: Capture bounded official BTCUSDT funding history
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/btc-shadow2-funding-rest
          python runtime/btc_shadow2_funding_rest_capture/capture.py \
            --start 2026-10-01 \
            --end-exclusive 2026-10-05 \
            --out artifacts/btc-shadow2-funding-rest
          rc=$?
          printf '%s\n' "$rc" > artifacts/btc-shadow2-funding-rest/collector_exit_code.txt
          exit 0

      - name: Upload raw funding response and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-shadow2-funding-rest-${{ github.run_id }}
          path: artifacts/btc-shadow2-funding-rest/
          if-no-files-found: error
          retention-days: 30

      - name: Propagate capture validation status
        if: always()
        shell: bash
        run: |
          test -f artifacts/btc-shadow2-funding-rest/collector_exit_code.txt
          rc="$(cat artifacts/btc-shadow2-funding-rest/collector_exit_code.txt)"
          exit "$rc"
