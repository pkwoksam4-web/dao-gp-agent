name: GP12 Main Net Flow Chagubang Daily Probe V1

on:
  push:
    branches:
      - gp/gp12-turnover-ratio-v1
    paths:
      - '.github/workflows/gp12-main-net-flow-chagubang-daily-probe-v1.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: pip install -q requests
      - name: Diagnose exact getDailyMarket request contract for 2020 anchor
        run: |
          python - <<'PY'
          import json
          import requests
          from urllib.parse import quote

          BASE = 'http://api.chagubang.com:3388/data'
          TEST_KEY = 'mushuju.com'  # provider-published public test key
          DAY = '2020-06-01'
          SYMBOL = '000001'
          FIELDS = 'code,tdate,zljlr,cddlr,cddlc,cddjlr,ddlr,ddlc,ddjlr'
          # Preserve the gateway's documented nested-query syntax literally:
          # from=getDailyMarket?type=1&code=... rather than encoding '?' into %3F.
          raw_url = (
              f'{BASE}?key={TEST_KEY}'
              f'&from=getDailyMarket?type=1'
              f'&code={SYMBOL}'
              f'&startDate={DAY}'
              f'&endDate={DAY}'
              f'&fields={quote(FIELDS, safe=",")}'
          )
          r = requests.get(
              raw_url,
              headers={'User-Agent': 'Mozilla/5.0 GP12-CANDIDATE-PROBE/1.0'},
              timeout=30,
          )
          print('HTTP_STATUS', r.status_code)
          print('REQUEST_URL', r.request.url.replace(TEST_KEY, '<PUBLIC_TEST_KEY>'))
          print('CONTENT_TYPE', r.headers.get('content-type'))
          print('RETRY_AFTER', r.headers.get('retry-after'))
          print('BODY_HEAD', r.text[:2000])
          if r.status_code == 429:
              raise RuntimeError('TEST_KEY_RATE_LIMITED')
          r.raise_for_status()
          try:
              payload = r.json()
          except Exception as exc:
              raise RuntimeError(f'NON_JSON_RESPONSE: {type(exc).__name__}: {exc}') from exc
          print('PAYLOAD_TYPE', type(payload).__name__)
          if isinstance(payload, dict):
              print('DICT_KEYS', json.dumps(sorted(payload.keys()), ensure_ascii=False))
              print('DICT_JSON', json.dumps(payload, ensure_ascii=False)[:4000])
              for key in ('data', 'result', 'rows'):
                  if isinstance(payload.get(key), list):
                      payload = payload[key]
                      print('UNWRAPPED_KEY', key)
                      break
          if not isinstance(payload, list):
              raise RuntimeError(f'PAYLOAD_NOT_LIST_AFTER_UNWRAP:{type(payload).__name__}')
          print('ROW_N', len(payload))
          candidates = []
          for row in payload:
              if not isinstance(row, dict):
                  continue
              code = str(row.get('code', '')).strip()
              date = str(row.get('tdate', ''))[:10]
              if code == SYMBOL and date == DAY:
                  candidates.append(row)
          print('REQUESTED_ROW_N', len(candidates))
          if candidates:
              print('REQUESTED_ROW', json.dumps(candidates[0], ensure_ascii=False)[:4000])
          if len(candidates) != 1:
              raise RuntimeError('FORMAL_20200601_ROW_NOT_EXACTLY_ONE')
          required = ('cddlr','cddlc','cddjlr','ddlr','ddlc','ddjlr')
          missing = [key for key in required if candidates[0].get(key) is None]
          print('MISSING_FIELDS', json.dumps(missing, ensure_ascii=False))
          if missing:
              raise RuntimeError('REQUIRED_MONEYFLOW_FIELDS_MISSING')
          print('PASS_CHAGUBANG_20200601_EXACT_REQUEST_CONTRACT')
          PY
