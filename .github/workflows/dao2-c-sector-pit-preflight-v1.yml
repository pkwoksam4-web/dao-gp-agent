name: DAO2 C Sector PIT Preflight V1
on:
  push:
    branches:
      - gp/dao2-c-sector-pit
    paths:
      - 'data/dao2/modules/C_SECTOR_*_V1.json'
      - 'data/dao2/modules/C_301_GAP_LEDGER_V1.json'
      - 'data/dao2/modules/C_301_GAP_VENDOR_SCOPE_V1.csv'
      - 'data/dao2/modules/C_301_GAP_LEDGER_VALIDATION_V1.json'
      - 'data/dao2/modules/C_FORMAL_CALENDAR_BINDING_V1.json'
      - 'scripts/dao2_sector_pit_verify_v1.py'
      - 'scripts/test_dao2_sector_pit_verify_v1.py'
      - '.github/workflows/dao2-c-sector-pit-preflight-v1.yml'
  pull_request:
    paths:
      - 'data/dao2/modules/C_SECTOR_*_V1.json'
      - 'data/dao2/modules/C_301_GAP_LEDGER_V1.json'
      - 'data/dao2/modules/C_301_GAP_VENDOR_SCOPE_V1.csv'
      - 'data/dao2/modules/C_301_GAP_LEDGER_VALIDATION_V1.json'
      - 'data/dao2/modules/C_FORMAL_CALENDAR_BINDING_V1.json'
      - 'scripts/dao2_sector_pit_verify_v1.py'
      - 'scripts/test_dao2_sector_pit_verify_v1.py'
      - '.github/workflows/dao2-c-sector-pit-preflight-v1.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run fail-closed sector contract tests
        env:
          PYTHONPATH: scripts
        run: python -m unittest -v scripts/test_dao2_sector_pit_verify_v1.py

  preflight:
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download PASS membership backing artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10628585296/zip" \
            -o /tmp/dao2-c-membership-pass.zip
          test -s /tmp/dao2-c-membership-pass.zip
      - name: Verify bound Formal calendar and component checkpoints
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          mkdir -p artifact_dao2_c_preflight_v1
          python - <<'PY'
          import csv
          import gzip
          import hashlib
          import io
          import json
          import os
          import zipfile
          from pathlib import Path

          base=Path("data/dao2/modules")
          calendar_binding=json.loads((base/"C_FORMAL_CALENDAR_BINDING_V1.json").read_text(encoding="utf-8"))
          membership=json.loads((base/"C_SECTOR_MEMBERSHIP_PIT_CHECKPOINT_V1.json").read_text(encoding="utf-8"))
          series=json.loads((base/"C_SECTOR_SERIES_CHECKPOINT_V1.json").read_text(encoding="utf-8"))
          breadth=json.loads((base/"C_SECTOR_BREADTH_CHECKPOINT_V1.json").read_text(encoding="utf-8"))
          historical=json.loads((base/"C_SECTOR_HISTORICAL_RECOVERY_V1.json").read_text(encoding="utf-8"))

          assert calendar_binding["status"]=="PASS_BOUND_TO_MEMBERSHIP_PASS_ARTIFACT", calendar_binding
          assert calendar_binding["source"]["membership_artifact_id"]==membership["evidence"]["membership_audit"]["artifact_id"], calendar_binding
          expected_digest="sha256:"+membership["evidence"]["membership_audit"]["artifact_digest_sha256"]
          assert calendar_binding["source"]["membership_artifact_digest"]==expected_digest, calendar_binding

          with zipfile.ZipFile("/tmp/dao2-c-membership-pass.zip") as z:
              raw=gzip.decompress(z.read(calendar_binding["source"]["member"])).decode("utf-8")
          sector_rows=list(csv.DictReader(io.StringIO(raw)))
          assert len(sector_rows)==43084, len(sector_rows)
          dates=sorted({str(r["trade_date"]).replace("-","") for r in sector_rows})
          canonical_text="trade_date\n"+"".join(d+"\n" for d in dates)
          date_list_sha256=hashlib.sha256(canonical_text.encode("utf-8")).hexdigest()
          assert len(dates)==calendar_binding["calendar"]["rows"]==1426, len(dates)
          assert dates[0]==calendar_binding["calendar"]["start"]=="20200601", dates[0]
          assert dates[-1]==calendar_binding["calendar"]["end"]=="20260417", dates[-1]
          assert date_list_sha256==calendar_binding["calendar"]["date_list_sha256"], date_list_sha256

          assert membership["status"]=="PASS_SUBCOMPONENT", membership
          assert membership["blocker_closed_within_module"] is True, membership
          assert membership["validation"]["unresolved_rows_zero"] is True, membership
          assert membership["validation"]["full_formal_symbol_date_coverage_proven"] is True, membership
          assert series["status"] in {"BLOCKED","PASS_SUBCOMPONENT"}, series
          if series["status"]=="PASS_SUBCOMPONENT":
              assert series["blocker_closed_within_module"] is True, series
              assert series["validation"]["missing_required_keys"]==0, series
              assert series["validation"]["full_formal_coverage_proven"] is True, series
          else:
              assert series["blocker_closed_within_module"] is False, series
          series_forward_fill = series["validation"].get("forward_fill", series["validation"].get("forward_fill_allowed"))
          assert series_forward_fill is False, series
          assert breadth["blocker_closed_within_module"] is False, breadth
          assert breadth["derivation_allowed"] is False, breadth
          assert historical["historical_recovery_claim_allowed"] is False, historical
          open_blockers=[]
          if not membership["blocker_closed_within_module"]:
              open_blockers.append("SECTOR_MEMBERSHIP_PIT_UNBOUND")
          if not series["blocker_closed_within_module"]:
              open_blockers.append("SECTOR_SERIES_UNBOUND")
          if not breadth["blocker_closed_within_module"]:
              open_blockers.append("SECTOR_BREADTH_UNBOUND")
          expected_open=["SECTOR_BREADTH_UNBOUND"] if series["blocker_closed_within_module"] else ["SECTOR_SERIES_UNBOUND","SECTOR_BREADTH_UNBOUND"]
          assert open_blockers==expected_open, open_blockers

          out={
              "artifact":"DAO2_C_SECTOR_PIT_PREFLIGHT_V1",
              "status":"PASS_PREFLIGHT_CURRENT_STATE",
              "formal_calendar":{
                  "source":"PASS membership required-sector keys",
                  "membership_artifact_id":calendar_binding["source"]["membership_artifact_id"],
                  "membership_artifact_digest":calendar_binding["source"]["membership_artifact_digest"],
                  "start":"2020-06-01",
                  "end":"2026-04-17",
                  "trading_days":len(dates),
                  "date_list_sha256":date_list_sha256
              },
              "component_status":{
                  "sector_membership_pit":membership["status"],
                  "sector_series":series["status"],
                  "sector_breadth":breadth["status"]
              },
              "historical_gp_v11_sector_package_recovered":False,
              "tushare_token_available":bool(os.environ.get("TUSHARE_TOKEN")),
              "candidate_materialization_note":"Token presence is capability-only evidence. No provider bytes are accepted by this preflight.",
              "closed_blockers":["SECTOR_MEMBERSHIP_PIT_UNBOUND"] + (["SECTOR_SERIES_UNBOUND"] if series["blocker_closed_within_module"] else []),
              "blockers":open_blockers,
              "model_freeze_allowed":False,
              "oos_metrics_allowed":False
          }
          path=Path("artifact_dao2_c_preflight_v1/C_SECTOR_PIT_PREFLIGHT_V1.json")
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dao2-c-sector-pit-preflight-v1
          path: artifact_dao2_c_preflight_v1/
          if-no-files-found: warn
          retention-days: 30
