name: DAO2 Migration Guard V1

on:
  push:
    branches:
      - gp/dao2-migration-20260920
    paths:
      - 'data/DAO2_MIGRATION_STATE_V1.json'
      - 'data/DAO2_ACTIVE_FILESET_V1.json'
      - 'scripts/dao2_migration_guard_v1.py'
      - 'scripts/test_dao2_migration_guard_v1.py'
      - '.github/workflows/dao2-migration-guard-v1.yml'
  pull_request:
    paths:
      - 'data/DAO2_MIGRATION_STATE_V1.json'
      - 'data/DAO2_ACTIVE_FILESET_V1.json'
      - 'scripts/dao2_migration_guard_v1.py'
      - 'scripts/test_dao2_migration_guard_v1.py'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate migrated fail-closed state
        env:
          PYTHONPATH: scripts
        run: |
          python scripts/dao2_migration_guard_v1.py
          cd scripts
          python -m unittest -v test_dao2_migration_guard_v1.py
