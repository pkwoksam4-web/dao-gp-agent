name: ClickHouse GitHub lineage probe

on:
  push:
    branches:
      - gp-clickhouse-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect public GitHub dataset schemas
        shell: bash
        run: |
          set +e
          mkdir -p probe13
          endpoint='https://play.clickhouse.com/?user=play&default_format=JSON'
          q() {
            name="$1"; sql="$2"
            printf '%s\n' "$sql" > "probe13/${name}.sql"
            curl -L --retry 2 --connect-timeout 12 --max-time 80 -sS "$endpoint" \
              --data-binary "$sql" -o "probe13/${name}.json" 2>"probe13/${name}.err"
          }
          q github_events_schema "DESCRIBE TABLE default.github_events FORMAT JSON"
          q repos_schema "DESCRIBE TABLE default.repos FORMAT JSON"
          q repos_history_schema "DESCRIBE TABLE default.repos_history FORMAT JSON"
          q repos_raw_schema "DESCRIBE TABLE default.repos_raw FORMAT JSON"
          q actors_schema "DESCRIBE TABLE default.actors FORMAT JSON"
          q github_events_sample "SELECT * FROM default.github_events LIMIT 1 FORMAT JSON"
          q repos_sample "SELECT * FROM default.repos LIMIT 1 FORMAT JSON"
          q repos_history_sample "SELECT * FROM default.repos_history LIMIT 1 FORMAT JSON"

      - name: Build compact summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('probe13'); out={}
          for p in sorted(root.glob('*.json')):
              text=p.read_text('utf-8',errors='replace')
              try: obj=json.loads(text)
              except Exception: obj=None
              e={'bytes':p.stat().st_size,'head':text[:2500]}
              if isinstance(obj,dict):
                  e['rows']=obj.get('rows')
                  if isinstance(obj.get('data'),list): e['data']=obj['data'][:500]
              out[p.name]=e
          (root/'summary.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),'utf-8')
          print(json.dumps(out,ensure_ascii=False)[:20000])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-github-lineage
          path: probe13/
          retention-days: 30
